<div id="pageUpload" class="hidden">

  <main class="main-content">

    <!-- Page header row -->
    <div class="page-header">
      <h1 class="page-title">請求内容の登録</h1>
      <button class="btn btn-back" id="btnUploadBack">
        <i class="fa-solid fa-chevron-left"></i> 一覧に戻る
      </button>
    </div>

    <!-- 一覧に戻る確認モーダル（ファイルアップロード済み時のみ表示） -->
    <div class="modal-overlay hidden"
         id="uploadBackModal"
         role="dialog"
         aria-modal="true"
         aria-labelledby="uploadBackModalTitle"
         aria-describedby="uploadBackModalDesc">
      <div class="modal modal--warn">
        <button class="modal__close" id="uploadBackModalClose" aria-label="閉じる">&times;</button>
        <h2 class="modal__title modal__title--warn" id="uploadBackModalTitle">
          <i class="fa-solid fa-triangle-exclamation"></i>
          登録情報が破棄されます
        </h2>
        <p class="modal__message modal__message--warn" id="uploadBackModalDesc">この画面を離れると登録中の情報は破棄されますが、<br>よろしいですか？</p>
        <div class="modal__actions modal__actions--center">
          <button type="button" class="btn btn-danger" id="uploadBackModalOk">OK</button>
          <button type="button" class="btn btn-outline" id="uploadBackModalCancel">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- アップロード・エラー・ボタンを一つの白カードにまとめる -->
    <div class="card main-card">

      <!-- 期限切れバナー（初期非表示、JS で制御） -->
      <div class="deadline-banner hidden" id="uploadDeadlineBanner" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="uploadDeadlineMessage"></span>
      </div>

      <!-- Upload section -->
      <div class="upload-section">
        <p class="card-label">請求CSVファイルを登録してください</p>

        <!-- Drop zone -->
        <div class="drop-zone is-disabled" id="dropZone">
          <i class="fa-regular fa-file-lines drop-zone__icon"></i>
          <p class="drop-zone__text">ここにドラッグ＆ドロップ<br>または</p>
          <button class="btn btn-select-file" id="btnSelectFile" disabled>
            <i class="fa-regular fa-folder-open"></i> ファイルを選択
          </button>
          <input type="file" id="fileInput" accept=".csv" hidden disabled />
        </div>

        <!-- アップロード済みファイル情報（初期非表示） -->
        <div class="file-info hidden" id="fileInfo">
          <span class="file-info__label">アップロードファイル：</span>
          <span class="file-info__name" id="fileInfoName"></span>
          <button class="btn btn-file-delete" id="btnFileDelete">
            <i class="fa-regular fa-trash-can"></i> ファイルを削除する
          </button>
        </div>
      </div>

      <!-- Error / Alert list -->
      <div class="error-card hidden" id="errorCard">
        <h2 class="error-card__title">エラー／アラート一覧</h2>
        <p class="error-card__desc">
          下記のエラー／アラートが発生しています。確認の上、CSVファイルを修正し、再度アップロードしてください。
        </p>
        <ul class="alert-list" id="alertList"></ul>
      </div>

      <!-- Action buttons -->
      <div class="action-buttons">
        <button class="btn btn-primary btn-submit" id="btnToConfirm" disabled>
          確認画面へ進む <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

    </div><!-- /.main-card -->

  </main>

  <footer class="site-footer">
    <p>Copyright &copy; USEN PAY Co.,Ltd. All Rights Reserved.</p>
  </footer>

</div><!-- /#pageUpload -->
