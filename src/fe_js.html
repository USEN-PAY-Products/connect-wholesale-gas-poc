<script>
// ---- account.js ----
// =============================================================================
// Account: ログイン時のアカウント情報取得・SessionStorage管理
// =============================================================================

/**
 * アカウント情報APIのレスポンスを SessionStorage に保存する。
 * @param {Object} data - getAccountInfo() のレスポンス data フィールド
 */
function saveAccountInfo(data) {
  try {
    sessionStorage.setItem('shiire_wholesaler_id',        String(data.wholesaler_id        ?? ''));
    sessionStorage.setItem('shiire_wholesaler_user_id',   String(data.wholesaler_user_id   ?? ''));
    sessionStorage.setItem('shiire_wholesaler_name',      String(data.wholesaler_name      ?? ''));
    sessionStorage.setItem('shiire_invoice_fee_rate',     String(data.fee_rate             ?? 0));
    sessionStorage.setItem('shiire_tax_rounding_method',  String(data.tax_rounding_method  ?? ''));
    sessionStorage.setItem('shiire_merchant_mappings',    JSON.stringify(data.merchant_mappings  || []));
    sessionStorage.setItem('shiire_csv_format_rules',     JSON.stringify(data.csv_format_rules   || null));
    console.log('[account] SessionStorage に卸情報を保存しました:', data.wholesaler_name);
  } catch (e) {
    console.warn('[account] SessionStorage への保存に失敗しました:', e);
  }
  // DOM更新は sessionStorage 保存の成否に関わらず実行する
  try {
    const headerName = document.getElementById('headerWholesalerName');
    if (headerName) headerName.textContent = data.wholesaler_name || '―';
  } catch (e) {
    console.warn('[account] ヘッダー企業名の更新に失敗しました:', e);
  }
}

/**
 * SessionStorage から merchant_mappings を取得する。
 * @returns {Array<{customer_code:string, mall_code:string, store_name:string}>}
 */
function getMerchantMappings() {
  try {
    return JSON.parse(sessionStorage.getItem('shiire_merchant_mappings') || '[]');
  } catch (_) { return []; }
}

/**
 * デフォルト卸向け固定9列の columns 定義。
 * csv_format_rules が null（csv_format_rules 未設定の卸）が使用する。
 * ⚠️ 列順・csv_header は db_bq_connection.js の STAGING_SCHEMA_ と完全一致させること
 */
const DEFAULT_CSV_COLUMNS_ = [
  { index: 0, csv_header: '顧客コード',       system_column: 'customer_code',         type: 'string',  required: true  },
  { index: 1, csv_header: '日付',             system_column: 'transaction_date',      type: 'date',    required: true  },
  { index: 2, csv_header: '品目',             system_column: 'item_name',             type: 'string',  required: true  },
  { index: 3, csv_header: '数量',             system_column: 'quantity',              type: 'integer', required: true  },
  { index: 4, csv_header: '単価',             system_column: 'unit_price',            type: 'integer', required: true  },
  { index: 5, csv_header: '税率区分(%)',       system_column: 'tax_rate',              type: 'integer', required: true,  enum: [8, 10] },
  { index: 6, csv_header: '請求金額（税抜）', system_column: 'amount_ex_tax',         type: 'integer', required: true  },
  { index: 7, csv_header: '消費税',           system_column: 'tax_amount',            type: 'integer', required: true  },
  { index: 8, csv_header: '備考',             system_column: 'invoice_detail_remark', type: 'string',  required: false },
];

/**
 * sessionStorage に保存された csv_format_rules を返す。
 * 新形式（columns 配列）の場合は index 昇順にソートして返す。
 * csv_format_rules が未設定の卸は null を返す。
 * 呼び出し側は null の場合に DEFAULT_CSV_COLUMNS_ を使用する。
 *
 * @returns {{ has_header: boolean, columns: Array }|null}
 */
function getCsvFormatRules() {
  let raw;
  try {
    raw = JSON.parse(sessionStorage.getItem('shiire_csv_format_rules'));
  } catch (_) {
    // JSON パース失敗 → 不正データとして扱う
    throw new Error('[getCsvFormatRules] csv_format_rules のパースに失敗しました。管理者に連絡してください。');
  }

  // null / undefined → デフォルト卸（固定9列）
  if (raw === null || raw === undefined) return null;

  // 新形式（columns 配列あり）→ index 昇順ソートして返す
  if (typeof raw === 'object' && Array.isArray(raw.columns) && raw.columns.length > 0) {
    const sorted = raw.columns.slice().sort((a, b) => a.index - b.index);
    return { ...raw, columns: sorted };
  }

  // それ以外（旧形式・不正値）→ 明示エラー
  // バックエンドの buildStagingSchema_() も同条件で throw するため、
  // フロントで先に検知してユーザーに分かりやすく通知する。
  throw new Error(
    '[getCsvFormatRules] csv_format_rules が未対応の形式です。' +
    '管理者に csv_format_rules の設定を確認してもらってください。'
  );
}

// =============================================================================
// Account: アプリ初期化（DOMContentLoaded で実行）
// =============================================================================

document.addEventListener('DOMContentLoaded', function () {
  showLoadingOverlay('読み込み中...');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.data) {
          saveAccountInfo(result.data);
          enableUploadUi_();
        } else {
          console.error('[account] getAccountInfo のレスポンスが不正です:', result);
          showErrorPage_('system');
          location.hash = '#error'; // エラーページへ強制
        }
        hideLoadingOverlay();
        navigate(); // アカウント情報確定後にルーティング実行
      })
      .withFailureHandler(function (err) {
        console.error('[account] getAccountInfo failed:', err);
        const msg = String(err.message || err);
        if (msg.indexOf('UNAUTHORIZED') !== -1) {
          showErrorPage_('unauthorized');
        } else {
          showErrorPage_('system');
        }
        location.hash = '#error'; // エラーページへ強制
        hideLoadingOverlay();
        navigate(); // エラー時もルーティングは実行する
      })
      .getAccountInfo();
  } else {
    // GAS 環境外での実行は非対応
    console.error('[account] google.script.run が利用できません。GAS Webアプリとして実行してください。');
    showErrorPage_('env');
    location.hash = '#error'; // エラーページへ強制
    hideLoadingOverlay();
    navigate();
  }
});

/**
 * アカウント情報取得完了後にアップロードUIを有効化する。
 * DOMContentLoaded 時点では dropZone / fileInput が disabled になっている前提。
 */
function enableUploadUi_() {
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  const btn = document.getElementById('btnSelectFile');
  if (dz)  dz.classList.remove('is-disabled');
  if (fi)  fi.disabled  = false;
  if (btn) btn.disabled = false;
}

/**
 * アカウント情報取得失敗時にエラーページの表示内容を設定する。
 * この関数を呼んだ後に location.hash = '#error' → navigate() の順で実行すること。
 * @param {'unauthorized'|'system'|'env'} type - エラーの種類
 */
function showErrorPage_(type) {
  const banner   = document.getElementById('errorPageBannerText');
  const message  = document.getElementById('errorPageMessage');
  const sub      = document.getElementById('errorPageSub');

  if (type === 'unauthorized') {
    // デフォルトの文言をそのまま使用（fe_page_error.html の HTML のまま）
    return;
  }

  if (type === 'env') {
    if (banner)  banner.textContent  = '環境エラー';
    if (message) message.innerHTML   = 'この画面はGAS Webアプリとして実行してください。';
    if (sub)     sub.textContent     = '';
    return;
  }

  // type === 'system'
  if (banner)  banner.textContent  = 'システムエラーが発生しました。';
  if (message) message.innerHTML   = 'アカウント情報の取得に失敗しました。<br>ページを再読み込みしてください。';
  if (sub)     sub.textContent     = '問題が続く場合は、下記窓口までご連絡ください。';
}


// ---- utils.js ----
// =============================================================================
// Utils: 共通ユーティリティ

/**
 * 全画面ローディングスピナーを表示する。
 * @param {string} [text='登録中...'] - スピナー下部に表示するテキスト
 */
function showLoadingOverlay(text) {
  const overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  const textEl = overlay.querySelector('.loading-overlay__text');
  if (textEl) textEl.textContent = text || '登録中...';
  overlay.classList.remove('hidden');
  overlay.setAttribute('aria-hidden', 'false');
}

/** 全画面ローディングスピナーを非表示にする。 */
function hideLoadingOverlay() {
  const overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  overlay.classList.add('hidden');
  overlay.setAttribute('aria-hidden', 'true');
}

/**
 * XSS 対策: HTML 特殊文字をエスケープする
 * @param {string} str
 * @returns {string}
 */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


// ---- home.js ----
// =============================================================================
// Home page: カレンダー状態
// =============================================================================

/** 現在表示中の年月（初期値は実行時の当月） */
const _today = new Date();
let calYear  = _today.getFullYear();
let calMonth = _today.getMonth(); // 0始まり

/** スケジュールデータのキャッシュ（日付文字列 → オブジェクト配列） */
let scheduleMap = {};

// =============================================================================
// Home page: 初期化
// =============================================================================

/**
 * ホーム画面表示時に GAS からデータを取得し、カレンダーと請求履歴を描画する。
 * 既に描画済みの場合は再描画しない（フラグ管理）。
 */
let homeInitialized = false;

function initHomePage() {
  if (homeInitialized) return;
  // アカウント情報が未取得の場合（getAccountInfo失敗時など）はスキップ
  if (!sessionStorage.getItem('shiire_wholesaler_id')) return;
  homeInitialized = true;

  // カレンダーナビゲーションボタンのイベント登録
  document.getElementById('calPrev').addEventListener('click', () => {
    calMonth -= 1;
    if (calMonth < 0) { calMonth = 11; calYear -= 1; }
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonth += 1;
    if (calMonth > 11) { calMonth = 0; calYear += 1; }
    renderCalendar();
  });

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    // スケジュールデータ取得
    google.script.run
      .withSuccessHandler(function(result) {
        buildScheduleMap(result && result.data ? result.data : []);
        renderCalendar();
      })
      .withFailureHandler(function(err) {
        console.error('[home] getMockScheduleData failed:', err);
        renderCalendar(); // データなしでもカレンダーは表示
      })
      .getMockScheduleData();

    // 請求履歴取得（BQ直接取得: wholesaler_id はサーバー側でログインユーザーから確定するため引数不要）
    showLoadingOverlay('請求情報を取得中...');
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoadingOverlay();
        renderBillingHistory(result && result.data ? result.data : []);
      })
      .withFailureHandler(function(err) {
        console.error('[home] fetchInvoices failed:', err);
        hideLoadingOverlay();
        renderBillingHistory([]); // 失敗時も空リストを描画しUIが空白にならないようにする
      })
      .fetchInvoices();
  } else {
    // GAS 環境外での実行は非対応
    console.error('[home] google.script.run が利用できません。GAS Webアプリとして実行してください。');
    renderCalendar();
    renderBillingHistory([]);
    hideLoadingOverlay();
  }
}

// =============================================================================
// Home page: スケジュールマップ構築
// =============================================================================

/**
 * 配列 → { '2026-05-13': [{...}], ... } の形に変換してキャッシュ
 * @param {Array<{date:string, title:string, type:string}>} items
 */
function buildScheduleMap(items) {
  scheduleMap = {};
  (items || []).forEach(item => {
    if (!scheduleMap[item.date]) scheduleMap[item.date] = [];
    scheduleMap[item.date].push(item);
  });
}

// =============================================================================
// Home page: カレンダー描画
// =============================================================================

function renderCalendar() {
  const label = document.getElementById('calMonthLabel');
  const grid  = document.getElementById('calGrid');
  if (!label || !grid) return;

  label.innerHTML = `<span class="cal-label__year">${calYear}年</span><span class="cal-label__month">${calMonth + 1}月</span>`;
  grid.innerHTML  = '';

  // 月の初日の曜日（0=日, 6=土）
  const firstDay  = new Date(calYear, calMonth, 1).getDay();
  // 月の末日
  const lastDate  = new Date(calYear, calMonth + 1, 0).getDate();
  // 今日
  const today     = new Date();
  const isThisMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;

  // 空白セル（月初前）
  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-cell cal-cell--empty';
    grid.appendChild(blank);
  }

  // 日付セル
  for (let d = 1; d <= lastDate; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    const mm   = String(calMonth + 1).padStart(2, '0');
    const dd   = String(d).padStart(2, '0');
    const key  = `${calYear}-${mm}-${dd}`;

    if (isThisMonth && d === today.getDate()) {
      cell.classList.add('cal-cell--today');
    }

    // 日付番号
    const num = document.createElement('span');
    num.className   = 'cal-cell__num';
    num.textContent = String(d);
    cell.appendChild(num);

    // スケジュールバッジ
    const events = scheduleMap[key] || [];
    events.forEach(ev => {
      const badge = document.createElement('div');
      badge.className = `cal-badge cal-badge--${ev.type}`;
      badge.textContent = ev.title;
      cell.appendChild(badge);
    });

    if (events.length > 0) {
      cell.classList.add('cal-cell--has-event');
    }

    grid.appendChild(cell);
  }
}

// =============================================================================
// Home page: 請求履歴描画
// =============================================================================

/**
 * 請求履歴リストを描画する
 * @param {Array<{
 *   wholesaler_invoice_id: string,
 *   wholesaler_invoice_date: string,
 *   wholesaler_total_amount: number,
 *   wholesaler_subtotal_amount: number,
 *   wholesaler_tax_amount: number,
 *   wholesaler_standard_tax_target_amount: number,
 *   wholesaler_standard_tax_amount: number,
 *   wholesaler_reduced_tax_target_amount: number,
 *   wholesaler_reduced_tax_amount: number,
 *   wholesaler_fee_rate: number,
 *   invoice_fee_amount: number,
 *   payment_amount: number
 * }>} items
 */
function renderBillingHistory(items) {
  const list = document.getElementById('billingHistoryList');
  if (!list) return;
  list.innerHTML = '';

  if (!items || items.length === 0) {
    list.innerHTML = '<p class="billing-empty">請求履歴がありません。</p>';
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'billing-card';

    const fmt = n => Number(n).toLocaleString('ja-JP');

    // wholesaler_invoice_date（例: '2026-04-30'）から「4月」形式に変換
    const monthLabel = item.wholesaler_invoice_date
      ? String(Number(item.wholesaler_invoice_date.slice(5, 7))) + '月'
      : '';

    // 税率別内訳を4カラムから組み立てる
    const breakdown = [
      { rate: 10, subtotalExTax: item.wholesaler_standard_tax_target_amount, taxAmount: item.wholesaler_standard_tax_amount },
      { rate: 8,  subtotalExTax: item.wholesaler_reduced_tax_target_amount,  taxAmount: item.wholesaler_reduced_tax_amount },
    ];
    const breakdownDataRows = breakdown.map(b => `
      <div class="bc-breakdown__cell bc-breakdown__rate">${escapeHtml(String(b.rate))}%</div>
      <div class="bc-breakdown__cell bc-breakdown__col-val">${fmt(b.subtotalExTax)}円</div>
      <div class="bc-breakdown__cell bc-breakdown__col-val">${fmt(b.taxAmount)}円</div>
    `).join('');

    card.innerHTML = `
      <div class="bc-month">${escapeHtml(monthLabel)}</div>

      <div class="bc-billing">
        <div class="bc-billing__label">請求金額</div>
        <div class="bc-billing__amount">${fmt(item.wholesaler_total_amount)}円</div>
        <div class="bc-billing__sub">小計（税抜）<span>${fmt(item.wholesaler_subtotal_amount)}円</span></div>
        <div class="bc-billing__sub">税額<span>${fmt(item.wholesaler_tax_amount)}円</span></div>
      </div>

      <div class="bc-divider"></div>

      <div class="bc-breakdown">
        <div class="bc-breakdown__grid">
          <div class="bc-breakdown__cell bc-breakdown__title">内訳</div>
          <div class="bc-breakdown__cell bc-breakdown__col-label">小計（税抜）</div>
          <div class="bc-breakdown__cell bc-breakdown__col-label">税額</div>
          ${breakdownDataRows}
        </div>
      </div>

      <div class="bc-divider"></div>

      <div class="bc-fee">
        <div class="bc-fee__row">手数料<span>${fmt(item.invoice_fee_amount)}円</span></div>
        <div class="bc-fee__row">振込金額<span>${fmt(item.payment_amount)}円</span></div>
      </div>

      <button type="button" class="bc-detail-link" data-id="${escapeHtml(item.wholesaler_invoice_id)}">詳細を見る &gt;</button>
    `;

    // 詳細リンク: invoiceId をハッシュクエリに含めて #detail へ遷移
    card.querySelector('.bc-detail-link').addEventListener('click', function() {
      location.hash = '#detail?invoiceId=' + encodeURIComponent(this.dataset.id);
    });

    list.appendChild(card);
  });
}

// =============================================================================
// Upload page: DOM references
// =============================================================================

const dropZone       = document.getElementById('dropZone');
const btnSelectFile  = document.getElementById('btnSelectFile');
const fileInput      = document.getElementById('fileInput');
const btnToConfirm   = document.getElementById('btnToConfirm');
const btnCancel      = document.getElementById('btnCancel');
const btnFinalSubmit = document.getElementById('btnFinalSubmit');
const errorCard      = document.getElementById('errorCard');
const alertList      = document.getElementById('alertList');
const toast          = document.getElementById('toast');
const toastClose     = document.getElementById('toastClose');

// =============================================================================
// Upload page: State（バックエンド送信用データ保持）
// =============================================================================

/**
 * 読み込んだCSVの元バイト列をBase64エンコードした文字列（DriveにSJISなど元ファイルそのまま保存するため）。
 * ⚠️ メモリのみ保持。sessionStorage には保存しない（容量超過防止）。
 * リロード時は再アップロードが必要。
 */
let rawCsvBase64 = null;

/**
 * decodeBuffer_() で UTF-8 化した CSV テキストを Base64 エンコードした文字列（BQ Load Job 投入用）。
 * ⚠️ メモリのみ保持。sessionStorage には保存しない（容量超過防止）。
 */
let utf8CsvBase64 = null;

/**
 * handleFile() の MIN_ANALYZE_MS 待機用タイマーID。
 * 連続ファイル選択時に前回のタイマーをキャンセルして競合を防ぐ。
 */
let _analyzeTimer = null;

/**
 * handleFile() で起動中の FileReader インスタンス。
 * 連続ファイル選択時に前回の reader.onload が後から走って結果を上書きするのを防ぐため、
 * 新しい handleFile 呼び出しの先頭で abort() してから破棄する。
 */
let _currentReader = null;

/**
 * パース済みデータ行の配列。各要素は csv_format_rules のキー（bq_field）をキーとしたオブジェクト。
 * デフォルトフォーマット（9列）の場合のキー構成は以下の通り。
 * @type {Array<{
 *   customer_code:         string,
 *   transaction_date:      string,
 *   item_name:             string,
 *   quantity:              number,
 *   unit_price:            number,
 *   tax_rate:              number,
 *   amount_ex_tax:         number,
 *   tax_amount:            number,
 *   invoice_detail_remark: string,
 * }>}
 */
let parsedData = null;

// parsedData のみ sessionStorage から復元する（確認画面の表示用）。
// rawCsvBase64 / utf8CsvBase64 はメモリのみ保持のため、リロード後は送信不可。
try {
  const _saved = sessionStorage.getItem('shiire_parsedData');
  if (_saved) parsedData = JSON.parse(_saved);

  // 型バリデーション: 想定外の値は捨ててセッションをクリア
  const isValidRow = r =>
    r !== null && typeof r === 'object' &&
    'customer_code' in r &&
    'amount_ex_tax' in r &&
    'tax_rate'      in r;

  if (parsedData !== null && (!Array.isArray(parsedData) || !parsedData.every(isValidRow))) {
    console.warn('[state] sessionStorage の parsedData が不正な形式です。破棄します。');
    parsedData = null;
    sessionStorage.removeItem('shiire_parsedData');
  }
} catch (e) {
  console.warn('[state] sessionStorage の復元に失敗しました:', e);
}

// =============================================================================
// Upload page: Toast helpers
// =============================================================================

/** 自動非表示タイマーID */
let _toastTimer = null;

/**
 * @param {string} message
 * @param {'error'|'success'} [type='error']
 * @param {number} [autoHideMs] - 自動非表示までのミリ秒。省略時: success=4000ms, error=0（自動非表示なし）
 */
function showToast(message, type = 'error', autoHideMs) {
  document.getElementById('toastMessage').textContent = message;
  toast.classList.remove('hidden', 'toast--error', 'toast--success');
  toast.classList.add(`toast--${type}`);

  // 既存タイマーをクリア
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }

  // 自動非表示: success はデフォルト4秒、error は明示指定がある場合のみ
  const delay = autoHideMs !== undefined ? autoHideMs : (type === 'success' ? 4000 : 0);
  if (delay > 0) {
    _toastTimer = setTimeout(hideToast, delay);
  }
}

function hideToast() {
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  toast.classList.add('hidden');
}

toastClose.addEventListener('click', hideToast);

// =============================================================================
// Upload page: Drop zone helpers
// =============================================================================

/** 初期状態の dropZone 内 HTML（リセット時に復元する） */
const DROP_ZONE_DEFAULT_HTML = dropZone.innerHTML;

/** dropZone を初期状態に戻す */
function resetDropZone() {
  dropZone.innerHTML = DROP_ZONE_DEFAULT_HTML;
  // is-disabled / is-success を除去（アカウント取得済みの状態に戻す）
  dropZone.classList.remove('is-disabled', 'is-success');
  // innerHTML 差し替え後に DOM 参照とイベントを再登録
  const newBtn   = dropZone.querySelector('#btnSelectFile');
  const newInput = dropZone.querySelector('#fileInput');
  // disabled 属性を除去（初期HTMLは disabled 状態でキャプチャされているため）
  if (newBtn)   newBtn.disabled   = false;
  if (newInput) newInput.disabled = false;
  newBtn.addEventListener('click', () => newInput.click());
  newInput.addEventListener('change', function () {
    if (this.files[0]) handleFile(this.files[0]);
    this.value = '';
  });
}

// =============================================================================
// Upload page: File handler
// =============================================================================

/** @param {File} file */
function handleFile(file) {
  // ── Step 1: アカウント情報取得済みチェック ────────────────────────────────
  if (!sessionStorage.getItem('shiire_csv_format_rules')) {
    showToast('アカウント情報を取得中です。しばらく待ってから再度お試しください。');
    return;
  }

  // ── Step 2: ファイル形式チェック ──────────────────────────────────────────
  if (!file.name.toLowerCase().endsWith('.csv')) {
    showToast('CSVファイルを選択してください');
    resetDropZone();
    return;
  }

  hideToast();

  // ── Step 3: CSVを読み込んでパース＆バリデーション ────────────────────────
  // ファイル選択直後にドロップゾーンを「解析中」スピナーへ切り替える。
  // すぐに結果が出るとユーザーが「本当に確認したの？」と不安になるため、
  // 最低 MIN_ANALYZE_MS だけスピナーを表示してから結果を描画する。
  // 連続ファイル選択時に前回のタイマーが残っていると古い結果で上書きされるため、
  // 新しい handleFile 呼び出しの先頭で必ずキャンセルする。
  if (_analyzeTimer !== null) {
    clearTimeout(_analyzeTimer);
    _analyzeTimer = null;
  }
  // 前回の FileReader が読み込み中なら abort して onload が後から発火しないようにする
  if (_currentReader !== null) {
    _currentReader.abort();
    _currentReader = null;
  }
  setDropZoneAnalyzing(file.name);
  const analyzeStartMs = Date.now();
  const MIN_ANALYZE_MS = 600; // スピナーの最小表示時間 (ms)

  const reader = new FileReader();
  _currentReader = reader; // グローバルに保持して次回の呼び出しで abort できるようにする

  reader.onload = e => {
    // abort 後に遅れて発火した古い onload は無視する
    if (reader !== _currentReader) return;
    _currentReader = null;

    const buffer = e.target.result;
    const text   = decodeBuffer_(buffer);

    // validateCsv() 内で getCsvFormatRules() が throw する場合があるため try/catch する。
    // 未捕捉のまま例外が飛ぶと dropZone が is-analyzing のまま固まるため、
    // catch 時はスピナーを解除してユーザーに通知する。
    let errors, rows;
    try {
      ({ errors, rows } = validateCsv(text));
    } catch (err) {
      _currentReader = null;
      dropZone.classList.remove('is-analyzing');
      showToast(err.message || 'CSVの検証中にエラーが発生しました');
      resetDropZone();
      return;
    }

    if (errors.length === 0) {
      // 成功: Base64はメモリのみ保持（sessionStorageには保存しない・容量超過防止）
      rawCsvBase64  = arrayBufferToBase64_(buffer);
      // BQ Load Job は UTF-8 を前提とするため、decodeBuffer_() で変換済みの text を
      // UTF-8 として再エンコードした Base64 を別途保持する
      utf8CsvBase64 = stringToBase64Utf8_(text);
      parsedData    = rows;
      // parsedData のみ sessionStorage に保存（確認画面の表示用。リロード後は送信不可）
      try {
        sessionStorage.setItem('shiire_parsedData', JSON.stringify(rows));
      } catch (e) {
        console.warn('[state] sessionStorage への保存に失敗しました:', e);
      }
    } else {
      // エラー: 保持データをクリア
      rawCsvBase64  = null;
      utf8CsvBase64 = null;
      parsedData    = null;
      try {
        sessionStorage.removeItem('shiire_parsedData');
      } catch (e) {
        console.warn('[state] sessionStorage のクリアに失敗しました:', e);
      }
    }

    // スピナーが最低表示時間に達するまで待ってから結果を描画する
    const elapsed   = Date.now() - analyzeStartMs;
    const remaining = Math.max(0, MIN_ANALYZE_MS - elapsed);
    _analyzeTimer = setTimeout(() => {
      _analyzeTimer = null;
      dropZone.classList.remove('is-analyzing');
      renderErrors(errors, file.name);
    }, remaining);
  };

  reader.onerror = () => {
    if (reader !== _currentReader) return;
    _currentReader = null;
    dropZone.classList.remove('is-analyzing');
    showToast('ファイルの読み込みに失敗しました');
    resetDropZone();
  };

  // SJIS / UTF-8 を自動判定するため ArrayBuffer で読み込む
  reader.readAsArrayBuffer(file);
}

/**
 * ArrayBuffer を Base64 文字列に変換する。
 * @param {ArrayBuffer} buffer
 * @returns {string}
 */
function arrayBufferToBase64_(buffer) {
  const bytes     = new Uint8Array(buffer);
  const chunkSize = 8192; // 8KB ずつ処理してスタックオーバーフローを防ぐ
  const parts     = [];
  for (let i = 0; i < bytes.byteLength; i += chunkSize) {
    parts.push(String.fromCharCode(...bytes.subarray(i, i + chunkSize)));
  }
  return btoa(parts.join(''));
}

/**
 * UTF-8 文字列を Base64 エンコードする。
 * TextEncoder で UTF-8 バイト列に変換してから btoa() する。
 * BQ Load Job 投入用（Shift_JIS CSVを UTF-8 に変換した後に呼ぶ）。
 *
 * @param {string} text - UTF-8 として扱う文字列
 * @returns {string} Base64 文字列
 */
function stringToBase64Utf8_(text) {
  const bytes     = new TextEncoder().encode(text);
  const chunkSize = 8192;
  const parts     = [];
  for (let i = 0; i < bytes.byteLength; i += chunkSize) {
    parts.push(String.fromCharCode(...bytes.subarray(i, i + chunkSize)));
  }
  return btoa(parts.join(''));
}

/**
 * ArrayBuffer を文字コード自動判定してテキストに変換する。
 * UTF-8 BOM あり / UTF-8 妥当 → UTF-8 で decode。
 * それ以外 → Shift_JIS で decode し UTF-8 に変換して返す。
 *
 * @param {ArrayBuffer} buffer
 * @returns {string}
 */
function decodeBuffer_(buffer) {
  const bytes = new Uint8Array(buffer);

  // UTF-8 BOM チェック (EF BB BF)
  const hasUtf8Bom = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;
  if (hasUtf8Bom) {
    return new TextDecoder('utf-8').decode(buffer);
  }

  // UTF-8 として valid か試みる（fatal:true = 不正バイト列で例外）
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
  } catch (_) {
    // UTF-8 として invalid → Shift_JIS として decode
    return new TextDecoder('shift_jis').decode(buffer);
  }
}

// =============================================================================
// Upload page: CSV parse & validate
// =============================================================================

/**
 * CSV の1行をフィールド配列にパースする。
 * RFC 4180 準拠のダブルクォート・エスケープ（""）・空フィールド・行頭カンマを正しく処理する。
 * 正規表現の lastIndex に依存しない状態機械ベース実装のため、連続カンマ等で無限ループしない。
 *
 * @param {string} line - 改行を含まない1行
 * @returns {string[]} フィールド値の配列（前後スペースをtrim済み）
 */
function parseCsvLine(line) {
  const result = [];
  let i = 0;
  while (i <= line.length) {
    if (i === line.length) {
      // 末尾カンマがある場合のみ空フィールドを追加する。
      // クォートフィールド終端後など、カンマなしで行末に達した場合は追加しない。
      if (i > 0 && line[i - 1] === ',') result.push('');
      break;
    }
    if (line[i] === '"') {
      // ── クォートフィールド ──────────────────────────────────────────────
      let val = '';
      i++; // 開きクォートをスキップ
      while (i < line.length) {
        if (line[i] === '"' && line[i + 1] === '"') {
          // エスケープされたクォート（""）
          val += '"';
          i += 2;
        } else if (line[i] === '"') {
          // 閉じクォート
          i++;
          break;
        } else {
          val += line[i++];
        }
      }
      result.push(val.trim());
      if (line[i] === ',') i++; // 区切りカンマをスキップ
    } else {
      // ── 非クォートフィールド ────────────────────────────────────────────
      const end = line.indexOf(',', i);
      if (end === -1) {
        result.push(line.slice(i).trim());
        break;
      }
      result.push(line.slice(i, end).trim());
      i = end + 1;
    }
  }
  return result;
}

/**
 * csv_format_rules に基づいてCSVをパース・バリデーションする。
 * getCsvFormatRules() が null の場合はデフォルト9列（DEFAULT_CSV_COLUMNS_）を使用する。
 * merchant_mappings で customer_code の有効性もチェックする。
 *
 * @param {string} csvText
 * @returns {{ errors: string[], rows: Object[] }}
 */
function validateCsv(csvText) {
  const errors = [];
  const rows   = [];

  // SessionStorage からフォーマットルールとマッピングを取得
  const rules    = getCsvFormatRules();
  const columns  = rules ? rules.columns : DEFAULT_CSV_COLUMNS_;
  const mappings = getMerchantMappings();

  // columns.length（配列の要素数）ではなく 最大index+1（CSVの実際の列数）で算出する。
  // index に欠番がある場合（省略列を配列から抜いているケース）に columns.length だと
  // 正しいCSVを誤って「列数不一致」と判定してしまうため。
  const expectedCols = columns.reduce((max, col) => Math.max(max, col.index + 1), 0);

  // 有効な customer_code セットを作成
  // is_active が未提供（undefined）の場合は active 扱いにする
  const validCustomerCodes = new Set(
    mappings.filter(m => m.is_active !== false).map(m => String(m.customer_code))
  );

  // 改行コード統一・空行除去
  const lines = csvText
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .split('\n')
    .filter(line => line.trim() !== '');

  // ── 空ファイルチェック（lines[0] が undefined になる前に弾く）──────────────
  if (lines.length === 0) {
    errors.push('CSVが空です。ヘッダー行とデータ行を含むCSVをアップロードしてください');
    return { errors, rows };
  }

  // ── ヘッダー行チェック ─────────────────────────────────────────────────────
  const headerCols = parseCsvLine(lines[0]);
  if (headerCols.length !== expectedCols) {
    errors.push(`ヘッダー行のカラム数が正しくありません（${headerCols.length}列 / 期待値: ${expectedCols}列）`);
    return { errors, rows };
  }
  const headerErrors = columns
    .map((col) => {
      return headerCols[col.index] !== col.csv_header
        ? `ヘッダー行 ${col.index + 1}列目: "${col.csv_header}" が期待されますが "${headerCols[col.index]}" になっています`
        : null;
    })
    .filter(Boolean);
  if (headerErrors.length > 0) {
    errors.push(...headerErrors);
    return { errors, rows };
  }

  if (lines.length <= 1) {
    errors.push('CSVにデータ行が1件もありません');
    return { errors, rows };
  }

  // ── データ行チェック ────────────────────────────────────────────────────────
  for (let i = 1; i < lines.length; i++) {
    const rowNum  = i + 1;
    const cols    = parseCsvLine(lines[i]);
    const rowErrors = [];

    if (cols.length !== expectedCols) {
      errors.push(`${rowNum}行目: カラム数が正しくありません（${cols.length}列 / 期待値: ${expectedCols}列）`);
      continue;
    }

    const rowObj = {};
    columns.forEach((col) => {
      // system_column が null（JS の null）または文字列 "null"（GAS の JSON 変換由来）の
      // 両方を null 扱いにする。null 列はプレースホルダーキーを使用する。
      const hasSystemColumn = col.system_column !== null
        && col.system_column !== undefined
        && col.system_column !== 'null';
      const key = hasSystemColumn ? col.system_column : `_col_${col.index}`;
      const val  = cols[col.index]; // idx（配列並び順）ではなく col.index（CSV上の列位置）で参照

      // 必須チェック
      if (col.required && val === '') {
        rowErrors.push(`${rowNum}行目: "${col.csv_header}" は必須項目です`);
        return;
      }
      if (val === '') {
        rowObj[key] = '';
        return;
      }

      // 型チェック
      switch (col.type) {
        case 'date': {
          // format 定義に応じてバリデーションパターンを切り替える。
          // 変換は BigQuery 側（PARSE_DATE）に委ねるため、ここでは形式チェックのみ行う。
          // ※ BQ 側の PARSE_DATE フォーマット文字列も合わせて更新が必要な場合は
          //    be_csv_mapper.js の buildInvoiceLinesSelectSql_() を確認すること。
          const fmt = col.format || 'YYYY-MM-DD';
          let dateOk = false;
          let dateHint = '';
          if (fmt === 'YYYYMMDD') {
            // 例: 20260301
            dateOk   = /^\d{8}$/.test(val);
            dateHint = 'YYYYMMDD形式（例: 20260301）';
          } else if (fmt === 'YYYY/MM/DD') {
            // 例: 2026/03/01（Excel 日本語保存でよく発生）
            dateOk   = /^\d{4}\/\d{2}\/\d{2}$/.test(val);
            dateHint = 'YYYY/MM/DD形式（例: 2026/03/01）';
          } else if (fmt === 'YYYY-MM-DD' || !col.format) {
            // デフォルト: YYYY-MM-DD (ISO 8601)
            dateOk   = /^\d{4}-\d{2}-\d{2}$/.test(val);
            dateHint = 'YYYY-MM-DD形式（例: 2026-03-01）';
          } else {
            // 未対応フォーマット → バックエンドも throw するため明示エラー
            // 対応フォーマット: YYYYMMDD / YYYY/MM/DD / YYYY-MM-DD
            rowErrors.push(
              `${rowNum}行目: "${col.csv_header}" の日付フォーマット "${fmt}" は未対応です。` +
              'csv_format_rules の format を YYYYMMDD / YYYY/MM/DD / YYYY-MM-DD のいずれかに設定してください。'
            );
            break;
          }
          if (!dateOk) {
            rowErrors.push(`${rowNum}行目: "${col.csv_header}" は${dateHint}で入力してください`);
          } else {
            rowObj[key] = val;
          }
          break;
        }
        case 'integer':
          if (val === '' || !/^-?\d+$/.test(val.trim())) {
            rowErrors.push(`${rowNum}行目: "${col.csv_header}" は整数で入力してください`);
          } else {
            const num = Number(val);
            // enumチェック
            if (col.enum && !col.enum.includes(num)) {
              rowErrors.push(`${rowNum}行目: "${col.csv_header}" は ${col.enum.join(' または ')} を入力してください`);
            } else {
              rowObj[key] = num;
            }
          }
          break;
        default: // string
          if (col.max_length && val.length > col.max_length) {
            rowErrors.push(`${rowNum}行目: "${col.csv_header}" は${col.max_length}文字以内で入力してください`);
          } else {
            rowObj[key] = val;
          }
      }
    });

    // customer_code の有効性チェック（merchant_mappings）
    const cc = rowObj['customer_code'];
    if (cc !== undefined && cc !== '') {
      if (validCustomerCodes.size > 0 && !validCustomerCodes.has(String(cc))) {
        rowErrors.push(`${rowNum}行目: "${cc}" は請求可能な加盟店コードではありません`);
      }
    }

    if (rowErrors.length === 0) {
      rows.push(rowObj);
    } else {
      errors.push(...rowErrors);
    }
  }

  return { errors, rows };
}

// =============================================================================
// Upload page: Render errors to UI
// =============================================================================

/**
 * @param {string[]} errors
 * @param {string}   [fileName] - 成功時に dropZone に表示するファイル名
 */
function renderErrors(errors, fileName) {
  // リストをいったん空にする
  alertList.innerHTML = '';

  if (errors.length > 0) {
    // エラーがある → dropZone を初期状態に戻す → リスト生成 → errorCard 表示 → 送信ボタン disabled
    resetDropZone();
    errors.forEach(msg => {
      const li = document.createElement('li');
      li.className = 'alert-item alert-item--error';
      li.innerHTML = '<i class="fa-solid fa-circle alert-icon"></i>' + msg;
      alertList.appendChild(li);
    });
    errorCard.classList.remove('hidden');
    btnToConfirm.disabled = true;
  } else {
    // エラーなし → dropZone を成功表示に → errorCard 非表示 → 送信ボタン活性
    setDropZoneSuccess(fileName || '');
    errorCard.classList.add('hidden');
    btnToConfirm.disabled = false;
  }
}

/** 確認ページ送信ボタンのデフォルトラベル（リセット時に使用） */

/** 送信中 UI に切り替える */
function setSubmitLoading() {
  btnFinalSubmit.disabled = true;
  btnFinalSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送信中...';
}

/** 送信ボタンを通常状態に戻す（チェックボックスの状態に追従する） */
function resetSubmitButton() {
  const checked = document.getElementById('checkConfirm')?.checked ?? false;
  btnFinalSubmit.disabled = !checked;
  btnFinalSubmit.innerHTML = SUBMIT_DEFAULT_HTML;
}

/**
 * 画面全体を初期状態にリセットする（送信成功後に呼ぶ）
 */
function resetPage() {
  rawCsvBase64  = null;
  utf8CsvBase64 = null;
  parsedData    = null;
  homeInitialized = false; // 登録完了後に #home へ戻ったとき請求一覧を再取得する
  try {
    sessionStorage.removeItem('shiire_parsedData');
  } catch (e) {
    console.warn('[state] sessionStorage のクリアに失敗しました:', e);
  }
  resetDropZone();
  alertList.innerHTML = '';
  errorCard.classList.add('hidden');
  btnToConfirm.disabled = true;
  btnToConfirm.innerHTML = '確認画面へ進む <i class="fa-solid fa-chevron-right"></i>';
  resetSubmitButton();
  hideToast();
}

// アップロードページ: 確認画面へ進むボタン
btnToConfirm.addEventListener('click', () => {
  if (!parsedData || !rawCsvBase64 || !utf8CsvBase64) {
    showToast('送信できるデータがありません。CSVを再度選択してください。', 'error');
    return;
  }
  location.hash = '#confirm';
});

// アップロードページ: キャンセルボタン → アップロード前の初期状態に戻す
btnCancel.addEventListener('click', () => {
  resetPage();
});

// =============================================================================
// Upload page: CSV テンプレートダウンロード
// =============================================================================

/** BOM 付き UTF-8 CSV テンプレートをダウンロードする */
function downloadCsvTemplate() {
  // csv_format_rules（またはデフォルト定義）からヘッダーを動的生成
  const rules   = getCsvFormatRules();
  const columns = rules ? rules.columns : DEFAULT_CSV_COLUMNS_;

  // columns.map() の並び順ではなく col.index（CSV上の列位置）に基づいてヘッダーを配置する。
  // index に欠番がある場合でも列位置がずれないよう、最大index+1 の配列を作り
  // headers[col.index] に代入してから join する。
  const maxIndex = columns.reduce((max, col) => Math.max(max, col.index), 0);
  const headers  = Array(maxIndex + 1).fill('');
  columns.forEach(col => { headers[col.index] = `"${col.csv_header}"`; });

  const csvContent = headers.join(',') + '\r\n';

  // BOM (0xEF 0xBB 0xBF) を先頭に付与して UTF-8 BOM 付きにする
  const bom  = '\uFEFF';
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);

  const a    = document.createElement('a');
  a.href     = url;
  a.download = '請求CSVテンプレート.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/** モーダルを開く直前にフォーカスしていた要素を記憶する */
let _modalTrigger = null;

/** フォーカス可能なセレクタ */
const FOCUSABLE = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';

/**
 * キャンセル確認モーダルを開く
 * @param {HTMLElement} [trigger] - 開くきっかけになった要素（閉じ後にフォーカスを戻す）
 */
function openCancelModal(trigger) {
  const modal = document.getElementById('cancelModal');
  _modalTrigger = trigger || document.activeElement;
  modal.classList.remove('hidden');
  // 最初のフォーカス可能要素へ移動
  const first = modal.querySelector(FOCUSABLE);
  if (first) first.focus();
}

/** キャンセル確認モーダルを閉じる */
function closeCancelModal() {
  const modal = document.getElementById('cancelModal');
  modal.classList.add('hidden');
  // フォーカスをトリガー要素に戻す
  if (_modalTrigger && typeof _modalTrigger.focus === 'function') {
    _modalTrigger.focus();
  }
  _modalTrigger = null;
}

// 確認ページ: キャンセルボタン → モーダルを表示
document.getElementById('btnConfirmCancel').addEventListener('click', function () {
  openCancelModal(this);
});

// モーダル: キャンセル（閉じるだけ）
document.getElementById('cancelModalClose').addEventListener('click', () => {
  closeCancelModal();
});

// モーダル: OK → データをリセットしアップロード画面へ
document.getElementById('cancelModalOk').addEventListener('click', () => {
  closeCancelModal();
  resetPage();
  location.hash = '#upload';
});

// モーダル: オーバーレイクリックで閉じる
document.getElementById('cancelModal').addEventListener('click', function (e) {
  if (e.target === this) closeCancelModal();
});

// モーダル: Esc キーで閉じる
document.addEventListener('keydown', e => {
  const modal = document.getElementById('cancelModal');
  if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
    closeCancelModal();
  }
});

// モーダル: フォーカストラップ（Tab / Shift+Tab をモーダル内に閉じ込める）
document.getElementById('cancelModal').addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  const focusable = Array.from(this.querySelectorAll(FOCUSABLE));
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last  = focusable[focusable.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
  }
});

/**
 * 確認画面の金額 input から wholesalerTotal / merchantTotals を収集して返す。
 * @returns {{ wholesalerTotal: Object, merchantTotals: Array<Object> }}
 */
function collectSummaryData_() {
  // span（read-only）と input（編集可）の両方から数値を取り出す共通ヘルパー
  const readEl = el => {
    if (!el) return 0;
    const raw = el.tagName === 'INPUT' ? el.value : el.textContent;
    return Number(String(raw).replace(/[^0-9.-]/g, '')) || 0;
  };
  const getVal   = id    => readEl(document.getElementById(id));
  const getField = (card, field) => readEl(card.querySelector(`[data-field="${field}"]`));

  const wholesalerTotal = {
    totalAmount:    getVal('summaryAmountInTax'),
    subtotalAmount: getVal('summaryAmountExTax'),
    taxAmount:      getVal('summaryTax'),
    exTax10:        getVal('summaryExTax10'),
    tax10:          getVal('summaryTax10'),
    exTax8:         getVal('summaryExTax8'),
    tax8:           getVal('summaryTax8'),
    feeAmount:      getVal('summaryFee'),
    paymentAmount:  getVal('summaryTransfer'),
  };

  const merchantTotals = [];
  document.querySelectorAll('.store-accordion').forEach(card => {
    const customerCode = card.dataset.cc || '';
    merchantTotals.push({
      customerCode,
      totalAmount:    getField(card, 'totalAmount'),
      subtotalAmount: getField(card, 'subtotalAmount'),
      taxAmount:      getField(card, 'taxAmount'),
      exTax10:        getField(card, 'exTax10'),
      tax10:          getField(card, 'tax10'),
      exTax8:         getField(card, 'exTax8'),
      tax8:           getField(card, 'tax8'),
    });
  });

  return { wholesalerTotal, merchantTotals };
}

/**
 * 確認画面の備考 textarea から { customerCode: remarks文字列 } を収集して返す。
 * @returns {Object.<string, string>}
 */
function collectRemarks_() {
  const remarks = {};
  document.querySelectorAll('.remarks-input[data-customer-code]').forEach(ta => {
    remarks[ta.dataset.customerCode] = ta.value || '';
  });
  return remarks;
}

// 確認ページ: 登録内容を送信するボタン
btnFinalSubmit.addEventListener('click', () => {
  // 送信可能なデータが揃っているか念のため確認
  if (!parsedData || !rawCsvBase64 || !utf8CsvBase64) {
    showToast('送信できるデータがありません。アップロードページからやり直してください。', 'error');
    location.hash = '#upload';
    return;
  }

  // ── 送信開始: UI をローディング状態に ─────────────────────────────────────
  setSubmitLoading();
  showLoadingOverlay('登録中...');
  hideToast();

  // ── GAS バックエンドへ送信 ────────────────────────────────────────────────
  // google.script.run は GAS Webアプリ環境でのみ有効。
  // ローカル Live Server で動作確認する場合は下部の「ローカル確認用フォールバック」が使われる。
  const wholesalerName = sessionStorage.getItem('shiire_wholesaler_name') || '';
  const summaryData    = collectSummaryData_();
  const remarks        = collectRemarks_();

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(onSubmitSuccess)
      .withFailureHandler(onSubmitFailure)
      // rawCsvBase64: Drive 保存用（元ファイルのバイト列そのまま）
      // utf8CsvBase64: BQ Load Job 用（UTF-8 に変換済み）
      .sendInvoiceData(rawCsvBase64, utf8CsvBase64, summaryData, remarks);
  } else {
    // ── ローカル確認用フォールバック（GAS 環境外）────────────────────────
    console.warn('[submit] google.script.run が利用できません。モック送信を実行します。');
    console.log('[submit] wholesalerName:', wholesalerName);
    console.log('[submit] rawCsvBase64 (先頭100文字):', rawCsvBase64.slice(0, 100));
    console.log('[submit] utf8CsvBase64 (先頭100文字):', utf8CsvBase64.slice(0, 100));
    console.log('[submit] summaryData:', summaryData);
    console.log('[submit] remarks:', remarks);
    setTimeout(() => onSubmitSuccess({ status: 'success', data: '(mock)' }), 1500);
  }
});

/**
 * 送信成功ハンドラ
 * @param {{ status: string, data: * }} result - server.js の success_() が返すオブジェクト
 *   エラー時は error_() が返したオブジェクトが SuccessHandler に流れる場合がある
 */
function onSubmitSuccess(result) {
  console.log('[submit] success:', result);
  if (result && result.status === 'error') {
    // GAS 側が _error() を返した場合（SuccessHandler に流れるがエラー扱い）
    hideLoadingOverlay();
    showToast('送信に失敗しました: ' + (result.message || '不明なエラー'), 'error');
    resetSubmitButton();
    return;
  }
  resetPage();
  hideLoadingOverlay();
  location.hash = '#home';
  showToast('登録が完了しました', 'success');
}

/**
 * 送信失敗ハンドラ
 * @param {Error} error
 */
function onSubmitFailure(error) {
  console.error('[submit] failure:', error);
  hideLoadingOverlay();
  showToast('送信に失敗しました: ' + (error.message || error), 'error');
  resetSubmitButton(); // 再送信できるようにボタンを戻す
}

/**
 * 確認画面を parsedData を元に描画する。
 * navigate() が '#confirm' に切り替えるたびに呼ばれる。
 */
function renderConfirmPage() {
  // データがなければアップロード画面へ戻す
  if (!parsedData || parsedData.length === 0 || !rawCsvBase64 || !utf8CsvBase64) {
    if (parsedData && parsedData.length > 0 && (!rawCsvBase64 || !utf8CsvBase64)) {
      // リロードで Base64 が消えた場合（parsedData は残っているが送信不可）
      showToast('ページがリロードされたため、CSVを再度アップロードしてください。', 'error');
    }
    location.hash = '#upload';
    return;
  }

  // チェックボックス・送信ボタンをリセット
  const checkConfirm = document.getElementById('checkConfirm');
  if (checkConfirm) checkConfirm.checked = false;
  btnFinalSubmit.disabled = true;

  // ── 卸情報を SessionStorage から取得 ─────────────────────────────────────
  const wholesalerId     = sessionStorage.getItem('shiire_wholesaler_id')     || '';
  const wholesalerUserId = sessionStorage.getItem('shiire_wholesaler_user_id') || '';
  const wholesalerName   = sessionStorage.getItem('shiire_wholesaler_name')   || '';
  const feeRate          = Number(sessionStorage.getItem('shiire_invoice_fee_rate') || 0);
  const mappings         = getMerchantMappings();

  // customer_code → mall_code / merchant_name の変換マップ
  const mappingMap = {};
  mappings.forEach(m => { mappingMap[String(m.customer_code)] = m; });

  // ── サマリー計算（1パスで全集計）────────────────────────────────────────
  // tax_amount は amount_ex_tax × tax_rate ÷ 100（切り捨て）で計算
  const totals = parsedData.reduce((acc, r) => {
    const amtExTax  = Number(r['amount_ex_tax'] || 0);
    const taxRate   = Number(r['tax_rate']       || 0);
    const taxAmount = Math.floor(amtExTax * taxRate / 100);
    acc.amountExTax += amtExTax;
    acc.tax         += taxAmount;
    if (taxRate === 10) { acc.exTax10 += amtExTax; acc.tax10 += taxAmount; }
    else                { acc.exTax8  += amtExTax; acc.tax8  += taxAmount; }
    return acc;
  }, { amountExTax: 0, tax: 0, exTax10: 0, tax10: 0, exTax8: 0, tax8: 0 });

  const totalAmountExTax = totals.amountExTax;
  const totalTax         = totals.tax;
  const totalAmountInTax = totalAmountExTax + totalTax;
  const { exTax10, tax10, exTax8, tax8 } = totals;
  const feeAmount  = Math.floor(totalAmountInTax * feeRate / 100);
  const payAmount  = totalAmountInTax - feeAmount;

  const fmt = n => n.toLocaleString('ja-JP');
  document.getElementById('summaryAmountInTax').textContent = fmt(totalAmountInTax);
  document.getElementById('summaryAmountExTax').textContent = fmt(totalAmountExTax);
  document.getElementById('summaryTax').textContent         = fmt(totalTax);
  document.getElementById('summaryFeeRate').textContent     = feeRate;
  document.getElementById('summaryFee').textContent         = fmt(feeAmount);
  document.getElementById('summaryTransfer').textContent    = fmt(payAmount);
  document.getElementById('summaryExTax10').textContent     = fmt(exTax10);
  document.getElementById('summaryTax10').textContent       = fmt(tax10);
  document.getElementById('summaryExTax8').textContent      = fmt(exTax8);
  document.getElementById('summaryTax8').textContent        = fmt(tax8);

  // ── customer_code ごとにグルーピング ─────────────────────────────────────
  /** @type {Map<string, Array>} */
  const groups = new Map();
  parsedData.forEach(row => {
    const cc = String(row['customer_code'] || '');
    if (!groups.has(cc)) groups.set(cc, []);
    groups.get(cc).push(row);
  });


  // ── 加盟店別リストを描画 ──────────────────────────────────────────────────
  const list = document.getElementById('confirmStoreList');
  list.innerHTML = '';

  /**
   * 全カードの tax8/tax10 input を合算してサマリー欄を再計算する。
   * tax8/tax10 input 変更時に呼ぶ。
   */
  const recalcSummary_ = () => {
    let totalExTax = 0, totalTax8 = 0, totalTax10 = 0;
    document.querySelectorAll('.store-accordion').forEach(c => {
      const subSpan = c.querySelector('[data-field="subtotalAmount"]');
      const t8El    = c.querySelector('[data-field="tax8"]');
      const t10El   = c.querySelector('[data-field="tax10"]');
      totalExTax += Number(String(subSpan ? subSpan.textContent : '0').replace(/[^0-9.-]/g, '')) || 0;
      totalTax8  += Math.max(0, Math.trunc(Number(t8El  ? t8El.value  : 0) || 0));
      totalTax10 += Math.max(0, Math.trunc(Number(t10El ? t10El.value : 0) || 0));
    });
    const totalTax   = totalTax8 + totalTax10;
    const totalInTax = totalExTax + totalTax;
    const fRate      = Number(sessionStorage.getItem('shiire_invoice_fee_rate') || 0);
    const fee        = Math.floor(totalInTax * fRate / 100);
    const pay        = totalInTax - fee;
    const fmt = n => n.toLocaleString('ja-JP');
    document.getElementById('summaryAmountInTax').textContent = fmt(totalInTax);
    document.getElementById('summaryAmountExTax').textContent = fmt(totalExTax);
    document.getElementById('summaryTax').textContent         = fmt(totalTax);
    document.getElementById('summaryFee').textContent         = fmt(fee);
    document.getElementById('summaryTransfer').textContent    = fmt(pay);
    document.getElementById('summaryTax8').textContent        = fmt(totalTax8);
    document.getElementById('summaryTax10').textContent       = fmt(totalTax10);
  };

  // 列ヘッダー行
  const colHeader = document.createElement('div');
  colHeader.className = 'store-list-header';
  colHeader.innerHTML =
    `<span class="slh-col slh-col--name">加盟店名</span>` +
    `<span class="slh-col slh-col--amount">請求金額</span>` +
    `<span class="slh-col slh-col--extax">小計（税抜）</span>` +
    `<span class="slh-col slh-col--tax">消費税</span>` +
    `<span class="slh-col slh-col--tax8">消費税内訳（8%）</span>` +
    `<span class="slh-col slh-col--tax10">消費税内訳（10%）</span>` +
    `<span class="slh-col slh-col--toggle"></span>`;
  list.appendChild(colHeader);

  groups.forEach((rows, customerCode) => {
    const mapping  = mappingMap[customerCode] || {};
    // 加盟店表示名の解決ロジック:
    // 1. CSVに merchant_name 列がある（カスタムフォーマット）→ CSVの値を使用
    // 2. CSVに merchant_name 列がない（デフォルトフォーマット）→ merchant_mappings から customer_code で検索（store_name キー）
    // 3. どちらも取得できない場合 → customer_code をそのまま表示
    const merchantNameFromCsv = String(rows[0]['merchant_name'] || '');
    const merchantNameFromMap  = (mappingMap[customerCode] || {}).store_name || '';
    const displayName          = merchantNameFromCsv || merchantNameFromMap || customerCode;

    const st = rows.reduce((acc, r) => {
      const amtExTax  = Number(r['amount_ex_tax'] || 0);
      const taxRate   = Number(r['tax_rate']       || 0);
      const taxAmount = Math.floor(amtExTax * taxRate / 100);
      acc.amountExTax += amtExTax;
      acc.tax         += taxAmount;
      if (taxRate === 10) { acc.exTax10 += amtExTax; acc.tax10 += taxAmount; }
      else                { acc.exTax8  += amtExTax; acc.tax8  += taxAmount; }
      return acc;
    }, { amountExTax: 0, tax: 0, exTax8: 0, tax8: 0, exTax10: 0, tax10: 0 });

    const storeAmountExTax = st.amountExTax;
    const storeTax         = st.tax;
    const storeTotal       = storeAmountExTax + storeTax;

    const card = document.createElement('div');
    card.className = 'store-accordion';
    card.dataset.cc = customerCode;

    const header = document.createElement('div');
    header.className = 'store-accordion__header';
    header.setAttribute('role', 'button');
    header.setAttribute('tabindex', '0');
    header.setAttribute('aria-expanded', 'false');
    header.innerHTML =
      `<span class="slh-col slh-col--name store-accordion__code">${escapeHtml(displayName)}</span>` +
      `<span class="slh-col slh-col--amount"><span class="amount-display" data-field="totalAmount">${storeTotal.toLocaleString('ja-JP')}</span></span>` +
      `<span class="slh-col slh-col--extax"><span class="amount-display" data-field="subtotalAmount">${storeAmountExTax.toLocaleString('ja-JP')}</span></span>` +
      `<span class="slh-col slh-col--tax"><span class="amount-display" data-field="taxAmount">${storeTax.toLocaleString('ja-JP')}</span></span>` +
      `<span class="slh-col slh-col--tax8"><input type="number" class="amount-input" data-field="tax8" value="${st.tax8}" min="0" step="1" inputmode="numeric" aria-label="${escapeHtml(displayName)} 消費税内訳（8%）（円）" /></span>` +
      `<span class="slh-col slh-col--tax10"><input type="number" class="amount-input" data-field="tax10" value="${st.tax10}" min="0" step="1" inputmode="numeric" aria-label="${escapeHtml(displayName)} 消費税内訳（10%）（円）" /></span>` +
      `<span class="slh-col slh-col--toggle"><i class="fa-solid fa-chevron-down store-accordion__icon"></i></span>`;

    const toggleAccordion = () => {
      const isOpen = card.classList.toggle('is-open');
      header.setAttribute('aria-expanded', String(isOpen));
    };
    header.addEventListener('click', toggleAccordion);
    header.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAccordion(); }
    });

    // tax8/tax10 input 変更時: カード内の taxAmount・totalAmount を更新し全体サマリーも再計算
    const tax8Input       = header.querySelector('[data-field="tax8"]');
    const tax10Input      = header.querySelector('[data-field="tax10"]');
    const taxAmountSpan   = header.querySelector('[data-field="taxAmount"]');
    const totalAmountSpan = header.querySelector('[data-field="totalAmount"]');
    const subtotalSpan    = header.querySelector('[data-field="subtotalAmount"]');
    const recalcCard_ = () => {
      const newTax8  = Math.max(0, Math.trunc(Number(tax8Input.value)  || 0));
      const newTax10 = Math.max(0, Math.trunc(Number(tax10Input.value) || 0));
      tax8Input.value  = newTax8;
      tax10Input.value = newTax10;
      const newTax   = newTax8 + newTax10;
      const subTotal = Number(String(subtotalSpan.textContent).replace(/[^0-9.-]/g, '')) || 0;
      const newTotal = subTotal + newTax;
      taxAmountSpan.textContent   = newTax.toLocaleString('ja-JP');
      totalAmountSpan.textContent = newTotal.toLocaleString('ja-JP');
      recalcSummary_();
    };
    // input クリック時にアコーディオンが開閉しないよう伝播を止める
    [tax8Input, tax10Input].forEach(el => {
      el.addEventListener('click',  e => e.stopPropagation());
      el.addEventListener('keydown', e => e.stopPropagation());
      el.addEventListener('input',   recalcCard_);
    });

    const body = document.createElement('div');
    body.className = 'store-accordion__body';

    rows.forEach(row => {
      const amtExTax  = Number(row['amount_ex_tax'] || 0);
      const taxRate   = Number(row['tax_rate']       || 0);
      const taxAmount = Math.floor(amtExTax * taxRate / 100);
      const item = document.createElement('div');
      item.className = 'detail-row';

      const fields = [
        { label: '取引日',   value: escapeHtml(String(row['transaction_date'] || '').replace(/-/g, '/')) },
        { label: '品名',     value: escapeHtml(String(row['item_name']        || '')) },
        { label: '数量',     value: Number(row['quantity']  || 0).toLocaleString('ja-JP') },
        { label: '単価',     value: Number(row['unit_price'] || 0).toLocaleString('ja-JP') + '円' },
        { label: '明細金額', value: amtExTax.toLocaleString('ja-JP') + '円' },
        { label: '税率',     value: taxRate + '%' },
        { label: '消費税',   value: taxAmount.toLocaleString('ja-JP') + '円' },
      ];

      const mainRow = document.createElement('div');
      mainRow.className = 'detail-row__main';
      mainRow.innerHTML = fields.map(f =>
        `<span class="detail-row__field">` +
          `<span class="detail-row__label">${f.label}</span>` +
          `<span class="detail-row__sep">|</span>` +
          `<span class="detail-row__value">${f.value}</span>` +
        `</span>`
      ).join('');
      item.appendChild(mainRow);

      const remark = String(row['invoice_detail_remark'] || '');
      const noteRow = document.createElement('div');
      noteRow.className = 'detail-row__note';
      noteRow.innerHTML = `<span class="detail-row__note-label">備考：</span>${remark ? escapeHtml(remark) : '<span class="detail-row__note-empty">なし</span>'}`;
      item.appendChild(noteRow);

      body.appendChild(item);
    });

    // 加盟店ごとの内訳 hidden input（collectSummaryData_ で読み取る）
    const hiddenDiv = document.createElement('div');
    hiddenDiv.style.display = 'none';
    hiddenDiv.innerHTML =
      `<input type="number" data-field="exTax10" value="${st.exTax10}" />` +
      `<input type="number" data-field="exTax8"  value="${st.exTax8}"  />`;
    body.appendChild(hiddenDiv);

    // 卸→加盟店 備考
    const remarksDiv = document.createElement('div');
    remarksDiv.className = 'store-accordion__remarks';
    remarksDiv.innerHTML =
      `<label class="remarks-label">卸→加盟店 備考：</label>` +
      `<textarea class="remarks-input" data-customer-code="${escapeHtml(customerCode)}" placeholder="備考があれば入力してください"></textarea>`;
    body.appendChild(remarksDiv);

    card.appendChild(header);
    card.appendChild(body);
    list.appendChild(card);
  });
}

// =============================================================================
// Detail page: 請求書詳細画面（アコーディオン連動・オンデマンド読み込み方式）
// =============================================================================

/** 現在表示中の卸インボイスID（同じ ID の再描画をスキップするためのキャッシュ） */
let _detailCurrentInvoiceId = null;

/**
 * 詳細画面を初期化する。
 * navigate() から invoiceId を受け取り、GAS API でデータを取得・描画する。
 * 同じ invoiceId が渡された場合は再描画をスキップする。
 * @param {string|null} invoiceId
 */
function initDetailPage(invoiceId) {
  if (!invoiceId) {
    renderDetailError_('請求IDが指定されていません。一覧に戻ってやり直してください。');
    return;
  }
  if (_detailCurrentInvoiceId === invoiceId) return; // 同一ページの再描画スキップ

  _detailCurrentInvoiceId = invoiceId;
  resetDetailPage_();

  showLoadingOverlay('請求詳細を取得中...');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        hideLoadingOverlay();
        if (!result || !result.data) {
          renderDetailError_('データが見つかりませんでした。');
          return;
        }
        renderDetailPage_(result.data);
      })
      .withFailureHandler(function (err) {
        hideLoadingOverlay();
        console.error('[detail] fetchInvoiceDetail failed:', err);
        renderDetailError_('データの取得中にエラーが発生しました: ' + String(err.message || err));
      })
      .fetchInvoiceDetail(invoiceId);
  } else {
    hideLoadingOverlay();
    renderDetailError_('GAS 環境外での実行は非対応です。');
  }
}

/**
 * 詳細画面をリセットする（別の invoiceId に遷移する前に呼ぶ）。
 */
function resetDetailPage_() {
  const summaryCard = document.getElementById('detailSummaryCard');
  if (summaryCard) {
    summaryCard.innerHTML =
      '<div class="detail-loading-placeholder"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>';
  }
  ['detailReturnedSection', 'detailOtherSection'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });
  ['detailReturnedList', 'detailOtherList'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
}

/**
 * エラーメッセージをサマリーカードに表示する。
 * @param {string} message
 */
function renderDetailError_(message) {
  const card = document.getElementById('detailSummaryCard');
  if (card) {
    card.innerHTML =
      '<p class="detail-error-msg"><i class="fa-solid fa-circle-exclamation"></i> ' +
      escapeHtml(message) + '</p>';
  }
}

// =============================================================================

/**
 * 取得データを詳細画面に描画する。
 * @param {{ summary: Object, stores: Array<Object> }} data
 */
function renderDetailPage_(data) {
  renderDetailSummary_(data.summary);
  renderDetailStoreList_(data.stores || []);
}

  const feeRate = s.wholesaler_fee_rate != null
    ? Number(s.wholesaler_fee_rate).toFixed(1) + '%' : '―';

  card.innerHTML = `
    <div class="detail-summary-inner">
      <div class="detail-summary-meta">
        <h3 class="detail-summary-meta__title">請求基本情報</h3>

          <span class="detail-meta-label">登録日時</span>

          <span class="detail-meta-label">手数料（${escapeHtml(feeRate)}）</span>
          <span class="detail-meta-value">${fmt(s.invoice_fee_amount)}円</span>
        </div>
        <div class="detail-meta-row">
          <span class="detail-meta-label">振込予定金額</span>
          <span class="detail-meta-value">${fmt(s.payment_amount)}円</span>
        </div>
        <div class="detail-meta-row--handover">
          <span class="detail-meta-label detail-meta-label--block">チェック者からの申送事項</span>
          <textarea class="detail-handover-textarea" readonly placeholder="差戻などが発生した場合は、こちらに申し送り事項が記載される場合があります。">${escapeHtml(s.handover_matter || '')}</textarea>
          <span class="detail-handover-note">＊ご不明点・ご確認がある場合は、運営窓口【090-XXXX-XXXX】までご連絡ください。</span>
        </div>
      </div>

      <div class="detail-summary-amount">
        <div class="detail-amount-header">請求金額</div>
        <div class="detail-amount-main-row">
          <span class="detail-amount-sublabel">合計（税込）</span>
          <span class="detail-amount-total">${fmt(s.wholesaler_total_amount)}<span class="detail-amount-unit">円</span></span>
        </div>
        <div class="detail-amount-rows">
          <div class="detail-amount-row">
            <span>小計（税抜）</span><span>${fmt(s.wholesaler_subtotal_amount)}円</span>
          </div>
          <div class="detail-amount-row">
            <span>消費税</span><span>${fmt(s.wholesaler_tax_amount)}円</span>
          </div>
          <div class="detail-amount-divider"></div>
          <div class="detail-amount-section-label">内訳</div>
          <div class="detail-amount-row">
            <span>税内訳（10%）</span><span>${fmt(s.wholesaler_standard_tax_amount)}円</span>
          </div>
          <div class="detail-amount-row">
            <span>税内訳（8%）</span><span>${fmt(s.wholesaler_reduced_tax_amount)}円</span>

/**
 * backoffice_review_status に対応するステータスバッジ HTML を返す。
 * @param {string} status
 * @returns {string}
 */
function getDetailStatusBadge_(status) {
  const MAP = {
    'PENDING_REVIEW':                  { label: '未検閲',      cls: 'badge--pending'   },
    'MERCHANT_CONFIRMATION_REQUESTED': { label: '確認依頼中',  cls: 'badge--requested' },
    'RETURNED':                        { label: '差し戻し',    cls: 'badge--returned'  },
  };
  const s = MAP[status] || { label: status || '不明', cls: 'badge--pending' };
  return '<span class="detail-status-badge ' + escapeHtml(s.cls) + '">' + escapeHtml(s.label) + '</span>';
}

/**
 * 加盟店リストを RETURNED / その他で分けてそれぞれのセクションに描画する。
 * @param {Array<Object>} stores
 */
function renderDetailStoreList_(stores) {
  const returned = stores.filter(function (s) { return s.backoffice_review_status === 'RETURNED'; });
  const others   = stores.filter(function (s) { return s.backoffice_review_status !== 'RETURNED'; });

  const colHeader =
    '<div class="dsl-header">' +
      '<span class="dsl-col dsl-col--name">加盟店名</span>' +
      '<span class="dsl-col dsl-col--code">顧客コード</span>' +
      '<span class="dsl-col dsl-col--amount">請求金額</span>' +
      '<span class="dsl-col dsl-col--extax">小計（税抜）</span>' +
      '<span class="dsl-col dsl-col--tax">消費税</span>' +
      '<span class="dsl-col dsl-col--tax10">税内訳（10%）</span>' +
      '<span class="dsl-col dsl-col--tax8">税内訳（8%）</span>' +
      '<span class="dsl-col dsl-col--status">ステータス</span>' +
      '<span class="dsl-col dsl-col--toggle"></span>' +
    '</div>';

  if (returned.length > 0) {
    const section = document.getElementById('detailReturnedSection');
    const list    = document.getElementById('detailReturnedList');
    if (section) section.classList.remove('hidden');
    if (list) {
      list.innerHTML = colHeader;
      returned.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, true)); });
    }
  }

  if (others.length > 0) {
    const section = document.getElementById('detailOtherSection');
    const list    = document.getElementById('detailOtherList');
    if (section) section.classList.remove('hidden');
    if (list) {
      list.innerHTML = colHeader;
      others.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
    }
  }
}

/**
 * 加盟店アコーディオン要素を生成する。
 * @param {Object}  store
 * @param {boolean} openByDefault - RETURNED の場合 true（初期状態で展開）
 * @returns {HTMLElement}
 */
function buildDetailAccordion_(store, openByDefault) {
  const fmt       = function (n) { return Number(n || 0).toLocaleString('ja-JP'); };
  const isReturned = store.backoffice_review_status === 'RETURNED';

  const accordion = document.createElement('div');
  accordion.className = 'dsl-accordion' +
    (openByDefault  ? ' is-open'            : '') +
    (isReturned     ? ' dsl-accordion--returned' : '');
  accordion.dataset.storeInvoiceId = store.store_invoice_id;

  // ── ヘッダー行 ───────────────────────────────────────────────────────────
  const header = document.createElement('div');
  header.className = 'dsl-accordion__header';
  header.innerHTML =
    '<span class="dsl-col dsl-col--name dsl-store-name">' + escapeHtml(store.store_name || store.mall_code) + '</span>' +
    '<span class="dsl-col dsl-col--code">'    + escapeHtml(store.mall_code   || '') + '</span>' +
    '<span class="dsl-col dsl-col--amount">'  + fmt(store.total_amount)    + '円</span>' +
    '<span class="dsl-col dsl-col--extax">'   + fmt(store.subtotal_amount)  + '円</span>' +
    '<span class="dsl-col dsl-col--tax">'     + fmt(store.tax_amount)       + '円</span>' +
    '<span class="dsl-col dsl-col--tax10">'   + fmt(store.standard_tax_amount) + '円</span>' +
    '<span class="dsl-col dsl-col--tax8">'    + fmt(store.reduced_tax_amount) + '円</span>' +
    '<span class="dsl-col dsl-col--status">'  + getDetailStatusBadge_(store.backoffice_review_status) + '</span>' +
    '<span class="dsl-col dsl-col--toggle"><i class="fa-solid fa-chevron-down dsl-accordion__icon"></i></span>';

  // ── ボディ ────────────────────────────────────────────────────────────────
  const body = document.createElement('div');
  body.className = 'dsl-accordion__body';

  // 差し戻し理由バナー
  if (isReturned && store.backoffice_handover) {
    const reason = document.createElement('div');
    reason.className = 'dsl-returned-reason';
    reason.innerHTML =
      '<i class="fa-solid fa-comment-dots"></i>' +
      '<span class="dsl-returned-reason__label">差し戻しコメント：</span>' +
      '<span class="dsl-returned-reason__text">' + escapeHtml(store.backoffice_handover) + '</span>';
    body.appendChild(reason);
  }

  // 申し送りコメント（wholesaler_handover）
  if (store.wholesaler_handover) {
    const note = document.createElement('div');
    note.className = 'dsl-wholesaler-note';
    note.innerHTML =
      '<span class="dsl-wholesaler-note__label">申し送り：</span>' +
      '<span>' + escapeHtml(store.wholesaler_handover) + '</span>';
    body.appendChild(note);
  }

  // 卸備考（wholesaler_remark）: CSV アップロード時に卸が入力した備考
  if (store.wholesaler_remark) {
    const remark = document.createElement('div');
    remark.className = 'dsl-wholesaler-note';
    remark.innerHTML =
      '<span class="dsl-wholesaler-note__label">備考：</span>' +
      '<span>' + escapeHtml(store.wholesaler_remark) + '</span>';
    body.appendChild(remark);
  }

  // 明細コンテナ（オンデマンドで内容を入れる / 閉じたら空にしてメモリ解放）
  const linesContainer = document.createElement('div');
  linesContainer.className = 'dsl-lines-container';
  body.appendChild(linesContainer);

  accordion.appendChild(header);
  accordion.appendChild(body);

  // ── 開閉ロジック ──────────────────────────────────────────────────────────
  header.addEventListener('click', function () {
    const isNowOpen = accordion.classList.contains('is-open');
    if (isNowOpen) {
      accordion.classList.remove('is-open');
      linesContainer.innerHTML = ''; // DOM を空にしてブラウザのメモリを解放
    } else {
      accordion.classList.add('is-open');
      loadDetailInvoiceLines_(store.store_invoice_id, linesContainer);
    }
  });

  // RETURNED は最初から開いて明細を取得
  if (openByDefault) {
    loadDetailInvoiceLines_(store.store_invoice_id, linesContainer);
  }

  return accordion;
}

/**
 * 指定の加盟店の明細をオンデマンドで取得してコンテナに描画する。
 * @param {string}      storeInvoiceId
 * @param {HTMLElement} container
 */
function loadDetailInvoiceLines_(storeInvoiceId, container) {
  container.innerHTML =
    '<div class="dsl-lines-loading"><i class="fa-solid fa-spinner fa-spin"></i> 明細を取得中...</div>';

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        renderDetailLines_((result && result.data) ? result.data : [], container);
      })
      .withFailureHandler(function (err) {
        console.error('[detail] getInvoiceLinesByStore failed:', err);
        container.innerHTML =
          '<div class="dsl-lines-error"><i class="fa-solid fa-circle-exclamation"></i> 明細の取得に失敗しました。</div>';
      })
      .getInvoiceLinesByStore(storeInvoiceId);
  } else {
    container.innerHTML = '<div class="dsl-lines-error">GAS 環境外での実行は非対応です。</div>';
  }
}

/**
 * 明細テーブルを描画する。
 * @param {Array<Object>} lines
 * @param {HTMLElement}   container
 */
function renderDetailLines_(lines, container) {
  if (!lines || lines.length === 0) {
    container.innerHTML = '<p class="dsl-lines-empty">明細データがありません。</p>';
    return;
  }

  const fmt = function (n) { return Number(n || 0).toLocaleString('ja-JP'); };

  const rows = lines.map(function (line) {
    const date = line.transaction_date ? String(line.transaction_date).replace(/-/g, '/') : '―';
    return '<tr>' +
      '<td>' + escapeHtml(date) + '</td>' +
      '<td class="dsl-tbl__item">' + escapeHtml(line.item_name || '') + '</td>' +
      '<td class="dsl-tbl__num">' + fmt(line.quantity) + (line.quantity_unit ? ' ' + escapeHtml(line.quantity_unit) : '') + '</td>' +
      '<td class="dsl-tbl__num">' + fmt(line.unit_price) + '</td>' +
      '<td class="dsl-tbl__num">' + escapeHtml(String(line.tax_category || 0)) + '%</td>' +
      '<td class="dsl-tbl__num">' + fmt(line.line_amount_excluding_tax) + '</td>' +
      '<td class="dsl-tbl__num">' + fmt(line.line_tax_amount) + '</td>' +
      '<td class="dsl-tbl__note">' + (line.line_note ? escapeHtml(line.line_note) : '<span class="detail-row__note-empty">―</span>') + '</td>' +
    '</tr>';
  }).join('');

  container.innerHTML =
    '<div class="dsl-lines-scroll">' +
      '<table class="dsl-lines-table">' +
        '<thead><tr>' +
          '<th>取引日</th><th>品目</th><th>数量</th><th>単価</th>' +
          '<th>税率</th><th>明細金額（税抜）</th><th>消費税</th><th>備考</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
    '</div>';
}


// ---- router.js ----
// =============================================================================
// Router: ハッシュベースの簡易 SPA ルーター
// =============================================================================

/**
 * 登録済みページのマップ。
 * key   : URL ハッシュ（'#upload' など）
 * value : そのページのルート要素の id
 */
const ROUTES = {
  '#home':    'pageHome',
  '#upload':  'pageUpload',
  '#confirm': 'pageConfirm',
  '#detail':  'pageDetail',
  '#error':   'pageError',
};

/** デフォルトルート */
const DEFAULT_ROUTE = '#home';

/**
 * location.hash から { baseHash, params } を取り出す。
 * 例: '#detail?invoiceId=b001' → { baseHash: '#detail', params: URLSearchParams }
 * @returns {{ baseHash: string, params: URLSearchParams }}
 */
function parseHash() {
  const raw = location.hash || DEFAULT_ROUTE;
  const sepIdx = raw.indexOf('?');
  if (sepIdx === -1) {
    return { baseHash: raw, params: new URLSearchParams() };
  }
  return {
    baseHash: raw.slice(0, sepIdx),
    params:   new URLSearchParams(raw.slice(sepIdx + 1)),
  };
}

/**
 * 現在のハッシュに対応するページだけ表示し、他を非表示にする。
 */
function navigate() {
  const { baseHash, params } = parseHash();
  const targetId = ROUTES[baseHash] || ROUTES[DEFAULT_ROUTE];

  Object.values(ROUTES).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden', id !== targetId);
  });

  if (targetId === 'pageHome') {
    initHomePage();
  }

  if (targetId === 'pageConfirm') {
    renderConfirmPage();
  }

  if (targetId === 'pageDetail') {
    const invoiceId = params.get('invoiceId') || null;
    initDetailPage(invoiceId);
  }

  if (targetId !== 'pageDetail') {
    // 詳細画面以外に遷移したら次回の再描画を許可するためキャッシュをクリア
    _detailCurrentInvoiceId = null;
  }

  console.log(`[router] navigated to ${baseHash} -> #${targetId}`);
}

// ハッシュ変化時にルーティング実行（初回ロードは getAccountInfo 完了後に呼ぶ）
window.addEventListener('hashchange', navigate);
</script>
