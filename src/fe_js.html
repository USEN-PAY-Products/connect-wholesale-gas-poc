<script>
// ---- utils.js ----
/**
 * sessionStorage の tax_rounding_method に応じて消費税を丸める。
 * floor（切り捨て）/ ceil（切り上げ）/ round（四捨五入）
 * @param {number} value - 丸め対象の数値
 * @returns {number}
 */
function roundTax(value) {
  const method = sessionStorage.getItem('shiire_tax_rounding_method') || 'floor';
  if (method === 'ceil')  return Math.ceil(value);
  if (method === 'round') return Math.round(value);
  return Math.floor(value);
}

/**
 * JST (Asia/Tokyo) 基準で現在日時の年月日・時分を返すユーティリティ。
 * ユーザー端末のタイムゾーンに依存せず、BE 側と同じ Asia/Tokyo 基準で判定する。
 * UTC epoch に +9h の固定オフセットを加算し、ロケール依存の文字列パースを回避する。
 * @returns {{ year: number, month: number, date: number, hours: number, minutes: number, ym: string, ymd: string }}
 */
function jstNow_() {
  const JST_OFFSET_MS = 9 * 60 * 60 * 1000;
  const d = new Date(Date.now() + JST_OFFSET_MS);
  const year    = d.getUTCFullYear();
  const month   = d.getUTCMonth() + 1;
  const date    = d.getUTCDate();
  const hours   = d.getUTCHours();
  const minutes = d.getUTCMinutes();
  return {
    year:    year,
    month:   month,
    date:    date,
    hours:   hours,
    minutes: minutes,
    ym:  year + '-' + String(month).padStart(2, '0'),
    ymd: year + '-' + String(month).padStart(2, '0') + '-' + String(date).padStart(2, '0')
  };
}

/**
 * ツールチップの位置を画面内に収まるよう動的に調整する。
 * mouseenter 時に呼び出し、画面上部に余裕があれば上に、なければ下に表示する。
 */
(function initTooltipPositioning() {
  document.addEventListener('mouseenter', function (e) {
    const wrap = e.target.closest('.detail-meta-help-wrap');
    if (!wrap) return;
    const tooltip = wrap.querySelector('.detail-meta-tooltip');
    if (!tooltip) return;

    // 一旦位置リセットして表示サイズを取得
    tooltip.style.left = '';
    tooltip.style.top = '';
    tooltip.classList.remove('detail-meta-tooltip--above', 'detail-meta-tooltip--below');

    // wrap の位置を取得
    const rect = wrap.getBoundingClientRect();
    const tipWidth = 280; // CSS で固定
    // 仮に上に表示して高さを計測
    tooltip.style.visibility = 'hidden';
    tooltip.style.display = 'block';
    const tipHeight = tooltip.offsetHeight;
    tooltip.style.display = '';
    tooltip.style.visibility = '';

    const gap = 10;
    let top, dirClass;

    // 上に十分なスペースがあるか
    if (rect.top - tipHeight - gap > 0) {
      top = rect.top - tipHeight - gap;
      dirClass = 'detail-meta-tooltip--above';
    } else {
      top = rect.bottom + gap;
      dirClass = 'detail-meta-tooltip--below';
    }

    // 左右位置: wrap の中央を基準にし、画面外にはみ出さないよう補正
    let left = rect.left + rect.width / 2 - tipWidth / 2;
    if (left < 8) left = 8;
    if (left + tipWidth > window.innerWidth - 8) left = window.innerWidth - tipWidth - 8;

    tooltip.classList.add(dirClass);
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }, true);
})();

/**
 * アカウント情報APIのレスポンスを SessionStorage に保存する。
 * @param {Object} data - getAccountInfo() のレスポンス data フィールド
 */
function saveAccountInfo(data) {
  try {
    sessionStorage.setItem('shiire_wholesaler_id',        String(data.wholesaler_id        ?? ''));
    sessionStorage.setItem('shiire_wholesaler_user_id',   String(data.wholesaler_user_id   ?? ''));
    sessionStorage.setItem('shiire_wholesaler_name',      String(data.wholesaler_name      ?? ''));
    sessionStorage.setItem('shiire_invoice_fee_rate',     String(data.fee_rate             ?? 0));
    sessionStorage.setItem('shiire_tax_rounding_method',  String(data.tax_rounding_method  ?? ''));
    sessionStorage.setItem('shiire_merchant_mappings',    JSON.stringify(data.merchant_mappings  || []));
    sessionStorage.setItem('shiire_csv_format_rules',     JSON.stringify(data.csv_format_rules   || null));
    console.log('[account] SessionStorage に卸情報を保存しました:', data.wholesaler_name);
  } catch (e) {
    console.warn('[account] SessionStorage への保存に失敗しました:', e);
  }
  // DOM更新は sessionStorage 保存の成否に関わらず実行する
  try {
    const headerName = document.getElementById('headerWholesalerName');
    if (headerName) headerName.textContent = data.wholesaler_name || '―';
  } catch (e) {
    console.warn('[account] ヘッダー企業名の更新に失敗しました:', e);
  }
}

/**
 * SessionStorage から merchant_mappings を取得する。
 * @returns {Array<{customer_code:string, mall_code:string, store_name:string}>}
 */
function getMerchantMappings() {
  try {
    return JSON.parse(sessionStorage.getItem('shiire_merchant_mappings') || '[]');
  } catch (_) { return []; }
}

/**
 * デフォルト卸向け固定9列の columns 定義。
 * csv_format_rules が null（csv_format_rules 未設定の卸）が使用する。
 * ⚠️ 列順・csv_header は db_bq_connection.js の STAGING_SCHEMA_ と完全一致させること
 */
const DEFAULT_CSV_COLUMNS_ = [
  { index: 0, csv_header: '顧客コード',       system_column: 'customer_code',         type: 'string',  required: true  },
  { index: 1, csv_header: '日付',             system_column: 'transaction_date',      type: 'date',    required: true  },
  { index: 2, csv_header: '品目',             system_column: 'item_name',             type: 'string',  required: true  },
  { index: 3, csv_header: '数量',             system_column: 'quantity',              type: 'decimal', required: true  },
  { index: 4, csv_header: '単価',             system_column: 'unit_price',            type: 'decimal', required: true  },
  { index: 5, csv_header: '税率区分(%)',       system_column: 'tax_rate',              type: 'integer', required: true,  enum: [8, 10] },
  { index: 6, csv_header: '請求金額（税抜）', system_column: 'amount_ex_tax',         type: 'decimal', required: true  },
  { index: 7, csv_header: '消費税',           system_column: 'tax_amount',            type: 'decimal', required: true  },
  { index: 8, csv_header: '備考',             system_column: 'invoice_detail_remark', type: 'string',  required: false },
];

/**
 * sessionStorage に保存された csv_format_rules を返す。
 * 新形式（columns 配列）の場合は index 昇順にソートして返す。
 * csv_format_rules が未設定の卸は null を返す。
 * 呼び出し側は null の場合に DEFAULT_CSV_COLUMNS_ を使用する。
 *
 * @returns {{ has_header: boolean, columns: Array }|null}
 */
function getCsvFormatRules() {
  let raw;
  try {
    raw = JSON.parse(sessionStorage.getItem('shiire_csv_format_rules'));
  } catch (e) {
    // JSON パース失敗 → 不正データとして扱う
    console.error('[getCsvFormatRules] csv_format_rules の JSON パースに失敗しました。raw=',
      sessionStorage.getItem('shiire_csv_format_rules'), e);
    throw new Error('CSVフォーマットの設定に不備があります。管理者にお問い合わせください。');
  }

  // null / undefined → デフォルト卸（固定9列）
  if (raw === null || raw === undefined) return null;

  // 空オブジェクト({}) → バックエンドはデフォルト卸として扱うため、フロントも null と同等に扱う。
  // saveAccountInfo() が csv_format_rules={} をそのまま保存する経路があるため、
  // フロント/バックで挙動を揃えて「フロントだけアップロード不可」を防ぐ。
  if (typeof raw === 'object' && !Array.isArray(raw) && Object.keys(raw).length === 0) return null;

  // 新形式（columns 配列あり）→ index を検証してから index 昇順ソートして返す
  if (typeof raw === 'object' && Array.isArray(raw.columns) && raw.columns.length > 0) {
    // バックエンドの buildStagingSchema_() と同じ上限値
    const MAX_COL_INDEX = 200;
    const seenIndexes       = {};
    // seenSystemColumns は Object.create(null) を使う。
    // {} だと 'constructor' や 'toString' 等の既存プロパティと衝突し、
    // 初回出現でも !== undefined が true になって誤った「重複」エラーになるため。
    const seenSystemColumns = Object.create(null);
    raw.columns.forEach(function (col, i) {
      // ── 型・範囲チェック ────────────────────────────────────────────────────
      if (!Number.isInteger(col.index) || col.index < 0) {
        console.error('[getCsvFormatRules] columns[' + i + '].index が不正です。',
          'index=', col.index, 'col=', JSON.stringify(col));
        throw new Error(
          'CSVフォーマットの設定に不備があります。管理者にお問い合わせください。'
        );
      }
      if (col.index > MAX_COL_INDEX) {
        console.error('[getCsvFormatRules] columns[' + i + '].index が上限(' + MAX_COL_INDEX + ')を超えています。',
          'index=', col.index, 'col=', JSON.stringify(col));
        throw new Error(
          'CSVフォーマットの設定に不備があります。管理者にお問い合わせください。'
        );
      }
      // ── index 重複チェック ──────────────────────────────────────────────────
      // 重複があると validateCsv() で同じ列を複数回参照し、rowObj のキーが上書きされて
      // 後に定義された列の値で前の列が上書きされ、誤ったデータになる。
      if (seenIndexes[col.index] !== undefined) {
        console.error('[getCsvFormatRules] columns[' + i + '].index が重複しています。',
          'index=', col.index, '先行=columns[' + seenIndexes[col.index] + ']',
          'col=', JSON.stringify(col));
        throw new Error(
          'CSVフォーマットの設定に不備があります。管理者にお問い合わせください。'
        );
      }
      seenIndexes[col.index] = i;
      // ── system_column 重複チェック ──────────────────────────────────────────
      // 重複があるとバックエンドの INSERT カラムが重複して BQ がエラーになる。
      // null / 未設定（読み飛ばし列）は重複しても問題ないため除外する。
      const sc = col.system_column;
      if (sc && sc !== 'null') {
        if (seenSystemColumns[sc] !== undefined) {
          console.error('[getCsvFormatRules] columns[' + i + '].system_column が重複しています。',
            'system_column=', sc, '先行=columns[' + seenSystemColumns[sc] + ']',
            'col=', JSON.stringify(col));
          throw new Error(
            'CSVフォーマットの設定に不備があります。管理者にお問い合わせください。'
          );
        }
        seenSystemColumns[sc] = i;
      }
    });
    const sorted = raw.columns.slice().sort((a, b) => a.index - b.index);
    return { ...raw, columns: sorted };
  }

  // それ以外（旧形式・不正値）→ 明示エラー
  // バックエンドの buildStagingSchema_() も同条件で throw するため、
  // フロントで先に検知してユーザーに分かりやすく通知する。
  console.error('[getCsvFormatRules] columns が未定義または不正な形式です。',
    'type=', typeof raw, 'raw=', JSON.stringify(raw));
  throw new Error(
    'CSVフォーマットの設定に不備があります。管理者にお問い合わせください。'
  );
}

// =============================================================================
// Account: アプリ初期化（DOMContentLoaded で実行）
// =============================================================================

document.addEventListener('DOMContentLoaded', function () {
  showLoadingOverlay('読み込み中...');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.data) {
          saveAccountInfo(result.data);
          enableUploadUi_();
          // スケジュールデータをプリフェッチ（カレンダーを開く前にデータを準備）
          loadScheduleData_();
        } else {
          console.error('[account] getAccountInfo のレスポンスが不正です:', result);
          showErrorPage_('system');
          location.hash = '#error'; // エラーページへ強制
        }
        hideLoadingOverlay();
        navigate(); // アカウント情報確定後にルーティング実行
      })
      .withFailureHandler(function (err) {
        console.error('[account] getAccountInfo failed:', err);
        const msg = String(err.message || err);
        if (msg.startsWith('UNAUTHORIZED:')) {
          showErrorPage_('unauthorized');
        } else {
          showErrorPage_('system');
        }
        location.hash = '#error'; // エラーページへ強制
        hideLoadingOverlay();
        navigate(); // エラー時もルーティングは実行する
      })
      .getAccountInfo();
  } else {
    // GAS 環境外での実行は非対応
    console.error('[account] google.script.run が利用できません。GAS Webアプリとして実行してください。');
    showErrorPage_('env');
    location.hash = '#error'; // エラーページへ強制
    hideLoadingOverlay();
    navigate();
  }
});

/**
 * アカウント情報取得完了後にアップロードUIを有効化する。
 * DOMContentLoaded 時点では dropZone / fileInput が disabled になっている前提。
 */
function enableUploadUi_() {
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  const btn = document.getElementById('btnSelectFile');
  if (dz)  dz.classList.remove('is-disabled');
  if (fi)  fi.disabled  = false;
  if (btn) btn.disabled = false;
}

/**
 * アカウント情報取得失敗時にエラーページの表示内容を設定する。
 * この関数を呼んだ後に location.hash = '#error' → navigate() の順で実行すること。
 * @param {'unauthorized'|'system'|'env'} type - エラーの種類
 */
function showErrorPage_(type) {
  const banner   = document.getElementById('errorPageBannerText');
  const message  = document.getElementById('errorPageMessage');
  const sub      = document.getElementById('errorPageSub');

  if (type === 'unauthorized') {
    // デフォルトの文言をそのまま使用（fe_page_error.html の HTML のまま）
    return;
  }

  if (type === 'env') {
    if (banner)  banner.textContent  = '環境エラー';
    if (message) message.innerHTML   = 'この画面はGAS Webアプリとして実行してください。';
    if (sub)     sub.textContent     = '';
    return;
  }

  // type === 'system'
  if (banner)  banner.textContent  = 'システムエラーが発生しました。';
  if (message) message.innerHTML   = 'アカウント情報の取得に失敗しました。<br>ページを再読み込みしてください。';
  if (sub)     sub.textContent     = '問題が続く場合は、下記窓口までご連絡ください。';
}

/**
 * 全画面ローディングスピナーを表示する。
 * @param {string} [text='登録中...'] - スピナー下部に表示するテキスト
 */
function showLoadingOverlay(text) {
  const overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  const textEl = overlay.querySelector('.loading-overlay__text');
  if (textEl) textEl.textContent = text || '登録中...';
  overlay.classList.remove('hidden');
  overlay.setAttribute('aria-hidden', 'false');
}

/** 全画面ローディングスピナーを非表示にする。 */
function hideLoadingOverlay() {
  const overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  overlay.classList.add('hidden');
  overlay.setAttribute('aria-hidden', 'true');
}

/**
 * XSS 対策: HTML 特殊文字をエスケープする
 * @param {string} str
 * @returns {string}
 */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


// ---- home.js ----
// =============================================================================
// Home page: カレンダー状態
// =============================================================================

/** 現在表示中の年月（初期値は実行時の当月） */
const _today = new Date();
let calYear  = _today.getFullYear();
let calMonth = _today.getMonth(); // 0始まり

/** スケジュールデータのキャッシュ（日付文字列 → オブジェクト配列） */
let scheduleMap = {};
let _scheduleLoaded = false;

/**
 * スケジュールデータを取得する。
 * 1. sessionStorage に当月キャッシュがあれば即座に scheduleMap を構築（瞬時表示）
 * 2. BQ からも非同期で取得し、全月データで上書き
 *    ※ キャッシュは当月分のみ保持（初期表示高速化目的）
 */
function loadScheduleData_() {
  if (_scheduleLoaded) return;
  const wholesalerId = sessionStorage.getItem('shiire_wholesaler_id');
  if (!wholesalerId) return;
  const jst = jstNow_();
  const currentYM = jst.ym;
  const cacheKey = 'shiire_schedule_cache_' + wholesalerId + '_' + currentYM;

  // ① sessionStorage キャッシュから当月分を即座に復元
  try {
    const cached = sessionStorage.getItem(cacheKey);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (Array.isArray(parsed) && parsed.length > 0) {
        buildScheduleMap(parsed);
        const overlay = document.getElementById('calendarModalOverlay');
        if (overlay && !overlay.classList.contains('hidden')) renderCalendar();
      }
    }
  } catch (e) {
    console.warn('[calendar] sessionStorage キャッシュ復元失敗:', e);
  }

  // ② BQ から最新データを非同期取得
  if (typeof google === 'undefined' || !google.script || !google.script.run) return;
  _scheduleLoaded = true;

  google.script.run
    .withSuccessHandler(function(result) {
      const data = result && result.data ? result.data : [];
      // sessionStorage には当月分のみキャッシュ（初期表示高速化目的）
      try {
        const monthStart = currentYM + '-01';
        const lastDay = new Date(jst.year, jst.month, 0).getDate();
        const monthEnd = currentYM + '-' + String(lastDay).padStart(2, '0');
        const currentMonthOnly = data.filter(function(item) {
          const s = String(item.start_at).slice(0, 10);
          const e = String(item.end_at).slice(0, 10);
          return !(e < monthStart || s > monthEnd);
        });
        sessionStorage.setItem(cacheKey, JSON.stringify(currentMonthOnly));
      } catch (e) {
        console.warn('[calendar] sessionStorage へのキャッシュ保存失敗:', e);
      }
      buildScheduleMap(data);
      const overlay = document.getElementById('calendarModalOverlay');
      if (overlay && !overlay.classList.contains('hidden')) renderCalendar();
      // アップロードページ表示中ならキャッシュ更新後に期限チェックを再実行
      const uploadPage = document.getElementById('pageUpload');
      if (uploadPage && !uploadPage.classList.contains('hidden')) {
        checkUploadDeadline_();
      }
    })
    .withFailureHandler(function(err) {
      console.error('[calendar] fetchScheduleData failed:', err);
      _scheduleLoaded = false; // 失敗時は再取得可能にする
    })
    .fetchScheduleData();
}

// カレンダーモーダル: 開閉制御（ページに依存しないためグローバルで登録）
(function() {
  const calOverlay = document.getElementById('calendarModalOverlay');
  const btnOpen    = document.getElementById('btnCalendarOpen');
  const btnClose   = document.getElementById('calendarModalClose');
  const FOCUSABLE_SEL = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  let _calTrigger  = null; // モーダルを開いた要素（閉じ後にフォーカスを戻す）

  function openCalendarModal() {
    loadScheduleData_();
    _calTrigger = document.activeElement;
    calOverlay.classList.remove('hidden');
    renderCalendar();
    // フォーカスをモーダル内へ転送
    const first = calOverlay.querySelector(FOCUSABLE_SEL);
    if (first) first.focus();
  }

  function closeCalendarModal() {
    calOverlay.classList.add('hidden');
    // フォーカスをトリガー要素に戻す
    if (_calTrigger && typeof _calTrigger.focus === 'function') _calTrigger.focus();
    _calTrigger = null;
  }

  if (btnOpen) {
    btnOpen.addEventListener('click', openCalendarModal);
  }
  if (btnClose) {
    btnClose.addEventListener('click', closeCalendarModal);
  }
  if (calOverlay) {
    calOverlay.addEventListener('click', function(e) {
      if (e.target === calOverlay) closeCalendarModal();
    });
  }

  // Escape キーで閉じる
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && calOverlay && !calOverlay.classList.contains('hidden')) {
      e.stopPropagation();
      closeCalendarModal();
    }
  });

  // フォーカストラップ（Tab / Shift+Tab をモーダル内に閉じ込める）
  if (calOverlay) {
    calOverlay.addEventListener('keydown', function(e) {
      if (e.key !== 'Tab') return;
      const focusable = Array.from(calOverlay.querySelectorAll(FOCUSABLE_SEL));
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last  = focusable[focusable.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
  }
})();

// =============================================================================
// Home page: 初期化
// =============================================================================

/**
 * ホーム画面表示時に GAS からデータを取得し、カレンダーと請求履歴を描画する。
 * 既に描画済みの場合は再描画しない（フラグ管理）。
 */
let homeInitialized = false;

function initHomePage() {
  if (homeInitialized) return;
  // アカウント情報が未取得の場合（getAccountInfo失敗時など）はスキップ
  if (!sessionStorage.getItem('shiire_wholesaler_id')) return;
  homeInitialized = true;

  // カレンダーナビゲーションボタンのイベント登録
  document.getElementById('calPrev').addEventListener('click', () => {
    calMonth -= 1;
    if (calMonth < 0) { calMonth = 11; calYear -= 1; }
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonth += 1;
    if (calMonth > 11) { calMonth = 0; calYear += 1; }
    renderCalendar();
  });

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    // スケジュールデータ取得（共通関数で遅延ロード）
    loadScheduleData_();

    // 請求履歴取得（BQ直接取得: wholesaler_id はサーバー側でログインユーザーから確定するため引数不要）
    showLoadingOverlay('請求情報を取得中...');
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoadingOverlay();
        const invoices = result && result.data ? result.data : [];
        try {
          sessionStorage.setItem('shiire_invoices_cache', JSON.stringify(invoices));
        } catch (e) {
          console.warn('[home] sessionStorage への請求キャッシュ保存に失敗しました:', e);
        }
        renderBillingHistory(invoices);
      })
      .withFailureHandler(function(err) {
        console.error('[home] fetchInvoices failed:', err);
        hideLoadingOverlay();
        renderBillingHistory([]); // 失敗時も空リストを描画しUIが空白にならないようにする
      })
      .fetchInvoices();
  } else {
    // GAS 環境外での実行は非対応
    console.error('[home] google.script.run が利用できません。GAS Webアプリとして実行してください。');
    renderCalendar();
    renderBillingHistory([]);
    hideLoadingOverlay();
  }
}

/**
 * business_calendar の行を日付 → イベント配列のマップに変換してキャッシュ。
 * start_at〜end_at の範囲を日毎に展開し、位置情報（start/middle/end/single）を付与する。
 * @param {Array<{event_type:string, start_at:string, end_at:string, event_description:string, display_color_code:string}>} items
 */
let _rawScheduleItems = [];
function buildScheduleMap(items) {
  _rawScheduleItems = items || [];
  scheduleMap = {};
  _rawScheduleItems.forEach(item => {
    const start = new Date(item.start_at);
    const end   = new Date(item.end_at);
    const isSingle = (start.getTime() === end.getTime());
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const key = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      if (!scheduleMap[key]) scheduleMap[key] = [];
      const pos = isSingle ? 'single'
        : (d.getTime() === start.getTime()) ? 'start'
        : (d.getTime() === end.getTime()) ? 'end'
        : 'middle';
      scheduleMap[key].push({
        title: item.event_description,
        color: item.display_color_code || '#ccc',
        event_type: item.event_type,
        pos: pos,
        endDate: new Date(item.end_at),
      });
    }
  });
}

/**
 * イベント配列からセル背景色を生成
 * - 1件: ベタ塗り
 * - 2件以上: 均等分割 linear-gradient
 */
function buildCellBackground(events) {
  if (!events || events.length === 0) return '';
  if (events.length === 1) return events[0].color;
  const n = events.length;
  const stops = [];
  events.forEach(function(ev, i) {
    const from = (100 * i / n).toFixed(2) + '%';
    const to   = (100 * (i + 1) / n).toFixed(2) + '%';
    stops.push(ev.color + ' ' + from, ev.color + ' ' + to);
  });
  return 'linear-gradient(to bottom, ' + stops.join(', ') + ')';
}

/**
 * イベント配列からセルに付与する角丸クラスを決定
 */
function getCellPosClass(events) {
  if (!events || events.length === 0) return '';
  const posSet = new Set(events.map(function(e) { return e.pos; }));
  if (posSet.has('single')) return 'cal-cell--single';
  if (posSet.has('start') && posSet.has('end')) return 'cal-cell--single';
  if (posSet.has('start')) return 'cal-cell--start';
  if (posSet.has('end')) return 'cal-cell--end';
  return 'cal-cell--middle';
}

function renderCalendar() {
  const label = document.getElementById('calMonthLabel');
  const grid  = document.getElementById('calGrid');
  if (!label || !grid) return;

  // 月ラベル（右横のカレンダーアイコンで月選択パネル表示）
  label.innerHTML = `<span class="cal-label__year">${calYear}年</span><span class="cal-label__month">${calMonth + 1}月</span>` +
    `<button class="cal-month-toggle" id="calMonthToggle" aria-label="月選択"><i class="fa-regular fa-calendar"></i></button>`;
  label.style.cursor = 'default';
  label.onclick = null;
  document.getElementById('calMonthToggle').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleMonthPicker_();
  });

  grid.innerHTML  = '';

  // 月選択パネル（既存なら再利用）
  renderMonthPicker_();

  // 月の初日の曜日（0=日, 6=土）
  const firstDay  = new Date(calYear, calMonth, 1).getDay();
  // 月の末日
  const lastDate  = new Date(calYear, calMonth + 1, 0).getDate();
  // 今日
  const today     = new Date();
  const isThisMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;

  // 空白セル（月初前）
  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-cell cal-cell--empty';
    grid.appendChild(blank);
  }

  // 日付セル
  for (let d = 1; d <= lastDate; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    const mm   = String(calMonth + 1).padStart(2, '0');
    const dd   = String(d).padStart(2, '0');
    const key  = `${calYear}-${mm}-${dd}`;

    if (isThisMonth && d === today.getDate()) {
      cell.classList.add('cal-cell--today');
    }

    // 日付番号
    const num = document.createElement('span');
    num.className   = 'cal-cell__num';
    num.textContent = String(d);
    cell.appendChild(num);

    // スケジュール背景色
    const events = scheduleMap[key] || [];
    if (events.length > 0) {
      cell.style.background = buildCellBackground(events);
      const posClass = getCellPosClass(events);
      if (posClass) cell.classList.add(posClass);
      cell.classList.add('cal-cell--has-event');
    }

    grid.appendChild(cell);
  }

  // 凡例を描画
  renderCalendarLegend_();
}

/**
 * カレンダー下の凡例を描画する。
 * _rawScheduleItems のうち表示中の月に期間が重なるイベントだけを
 * 重複排除して色 + description の一覧で表示。
 */
function renderCalendarLegend_() {
  const legendEl = document.getElementById('calLegend');
  if (!legendEl) return;
  legendEl.innerHTML = '';

  // 表示中の月の範囲（YYYY-MM-DD 文字列で比較 ─ タイムゾーンずれ回避）
  const mm = String(calMonth + 1).padStart(2, '0');
  const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
  const monthStartStr = calYear + '-' + mm + '-01';
  const monthEndStr   = calYear + '-' + mm + '-' + String(lastDay).padStart(2, '0');

  // 色 + description でユニークな凡例項目を抽出（表示中の月に重なるもののみ）
  const seen = new Set();
  const items = [];
  _rawScheduleItems.forEach(function(item) {
    // イベント期間が表示中の月と重なるか判定（文字列比較）
    const evStart = String(item.start_at).slice(0, 10);
    const evEnd   = String(item.end_at).slice(0, 10);
    if (evEnd < monthStartStr || evStart > monthEndStr) return; // 月外 → スキップ

    const key = (item.display_color_code || '#ccc') + '|' + (item.event_description || '');
    if (!seen.has(key)) {
      seen.add(key);
      items.push({
        color: item.display_color_code || '#ccc',
        description: item.event_description || ''
      });
    }
  });

  items.forEach(function(item) {
    const row = document.createElement('div');
    row.className = 'cal-legend__item';

    const swatch = document.createElement('span');
    swatch.className = 'cal-legend__swatch';
    swatch.style.background = item.color;

    const label = document.createElement('span');
    label.className = 'cal-legend__label';
    label.textContent = item.description;

    row.appendChild(swatch);
    row.appendChild(label);
    legendEl.appendChild(row);
  });
}

// 月選択パネル
let _pickerYear = null; // 月選択パネルで表示中の年

function renderMonthPicker_() {
  const labelEl = document.getElementById('calMonthLabel');
  if (!labelEl) return;
  if (_pickerYear === null) _pickerYear = calYear;

  let picker = document.getElementById('calMonthPicker');
  if (!picker) {
    picker = document.createElement('div');
    picker.id = 'calMonthPicker';
    picker.className = 'cal-month-picker hidden';
    picker.addEventListener('click', function(e) { e.stopPropagation(); });
    labelEl.appendChild(picker);
  }
  picker.innerHTML = '';

  // 年ヘッダー（< 年 >）
  const yearHeader = document.createElement('div');
  yearHeader.className = 'cal-month-picker__year-header';
  yearHeader.innerHTML =
    '<button class="calendar-nav cal-picker-nav" id="pickerYearPrev">&lt;</button>' +
    '<span class="cal-month-picker__year-label">' + _pickerYear + '年</span>' +
    '<button class="calendar-nav cal-picker-nav" id="pickerYearNext">&gt;</button>';
  picker.appendChild(yearHeader);

  // 年ナビイベント
  yearHeader.querySelector('#pickerYearPrev').addEventListener('click', function(e) {
    e.stopPropagation();
    _pickerYear--;
    renderMonthPicker_();
    picker.classList.remove('hidden');
  });
  yearHeader.querySelector('#pickerYearNext').addEventListener('click', function(e) {
    e.stopPropagation();
    _pickerYear++;
    renderMonthPicker_();
    picker.classList.remove('hidden');
  });

  // 月グリッド（4x3）
  const monthGrid = document.createElement('div');
  monthGrid.className = 'cal-month-picker__grid';
  const today = new Date();
  for (let m = 0; m < 12; m++) {
    const btn = document.createElement('button');
    const isSelected = (m === calMonth && _pickerYear === calYear);
    const isCurrent  = (m === today.getMonth() && _pickerYear === today.getFullYear());
    let cls = 'cal-month-picker__btn';
    if (isSelected) cls += ' cal-month-picker__btn--active';
    else if (isCurrent) cls += ' cal-month-picker__btn--current';
    btn.className = cls;
    btn.textContent = (m + 1) + '月';
    btn.addEventListener('click', function() {
      calYear = _pickerYear;
      calMonth = m;
      picker.classList.add('hidden');
      renderCalendar();
    });
    monthGrid.appendChild(btn);
  }
  picker.appendChild(monthGrid);
}

function toggleMonthPicker_() {
  const picker = document.getElementById('calMonthPicker');
  if (picker) {
    _pickerYear = calYear;
    picker.classList.toggle('hidden');
    if (!picker.classList.contains('hidden')) {
      renderMonthPicker_();
      // 外側クリック・Escで閉じる
      setTimeout(function() {
        document.addEventListener('click', _closePickerOnOutsideClick);
        document.addEventListener('keydown', _closePickerOnEscape);
      }, 0);
    } else {
      _removePickerListeners();
    }
  }
}

/** ピッカー関連リスナーを確実に解除する */
function _removePickerListeners() {
  document.removeEventListener('click', _closePickerOnOutsideClick);
  document.removeEventListener('keydown', _closePickerOnEscape);
}

function _closePickerOnOutsideClick(e) {
  const picker = document.getElementById('calMonthPicker');
  if (!picker) {
    // DOMから消えている場合もリスナーを解除
    _removePickerListeners();
    return;
  }
  if (!picker.contains(e.target)) {
    picker.classList.add('hidden');
    _removePickerListeners();
  }
}

function _closePickerOnEscape(e) {
  if (e.key !== 'Escape') return;
  const picker = document.getElementById('calMonthPicker');
  if (picker) {
    picker.classList.add('hidden');
  }
  _removePickerListeners();
}

/**
 * 請求履歴リストを描画する
 * @param {Array<{
 *   wholesaler_invoice_id: string,
 *   wholesaler_invoice_date: string,
 *   wholesaler_total_amount: number,
 *   wholesaler_subtotal_amount: number,
 *   wholesaler_tax_amount: number,
 *   wholesaler_standard_tax_target_amount: number,
 *   wholesaler_standard_tax_amount: number,
 *   wholesaler_reduced_tax_target_amount: number,
 *   wholesaler_reduced_tax_amount: number,
 *   wholesaler_fee_rate: number,
 *   invoice_fee_amount: number,
 *   payment_amount: number
 * }>} items
 */
function renderBillingHistory(items) {
  const tbody = document.getElementById('billingHistoryBody');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (!items || items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="billing-empty">請求履歴がありません。</td></tr>';
    return;
  }

  const fmt = n => Number(n).toLocaleString('ja-JP');

  items.forEach(item => {
    const tr = document.createElement('tr');

    // 請求月
    const monthLabel = item.wholesaler_invoice_date
      ? String(Number(item.wholesaler_invoice_date.slice(0, 4))) + '年' + String(Number(item.wholesaler_invoice_date.slice(5, 7))) + '月'
      : '';

    // 登録日時（created_at があれば使用、なければ invoice_date）
    const regDate = item.created_at || item.wholesaler_invoice_date || '';
    const regLabel = regDate ? regDate.replace('T', ' ').slice(0, 16) : '';

    // 手数料（税込）
    const feeAmount = item.invoice_fee_amount != null ? fmt(item.invoice_fee_amount) + '円' : '';

    // 差戻し・否認バッジ（BQから has_resubmit / has_denial を 0/1 で取得）
    const resubmitBadge = Number(item.has_resubmit)
      ? '<span class="badge badge--resubmit"><i class="fa-solid fa-rotate-left"></i> 差戻し有</span>'
      : '<span class="badge badge--none">差戻し無</span>';
    const denialBadge = Number(item.has_denial)
      ? '<span class="badge badge--denial"><i class="fa-solid fa-minus-circle"></i> 否認有</span>'
      : '<span class="badge badge--none">否認無</span>';

    tr.innerHTML = 
      '<td>' + escapeHtml(monthLabel) + '</td>' +
      '<td>' + escapeHtml(regLabel) + '</td>' +
      '<td>' + fmt(item.wholesaler_total_amount) + '円</td>' +
      '<td>' + feeAmount + '</td>' +
      '<td>' + resubmitBadge + '</td>' +
      '<td>' + denialBadge + '</td>' +
      '<td><button type="button" class="btn-detail-link" data-id="' + escapeHtml(item.root_id || item.wholesaler_invoice_id) + '">詳細を見る &gt;</button></td>';

    tr.querySelector('.btn-detail-link').addEventListener('click', function() {
      location.hash = '#detail?invoiceId=' + encodeURIComponent(this.dataset.id);
    });

    tbody.appendChild(tr);
  });
}

/**

 * ⚠️ メモリのみ保持。sessionStorage には保存しない（容量超過防止）。

 */
let rawCsvBase64 = null;

/**
 * decodeBuffer_() で UTF-8 化した CSV テキストを Base64 エンコードした文字列（BQ Load Job 投入用）。
 * ⚠️ メモリのみ保持。sessionStorage には保存しない（容量超過防止）。

 * 新しい handleFile 呼び出しの先頭で abort() してから破棄する。
 */
let _currentReader = null;

/**
 * パース済みデータ行の配列。各要素は csv_format_rules のキー（bq_field）をキーとしたオブジェクト。
 * デフォルトフォーマット（9列）の場合のキー構成は以下の通り。
 * @type {Array<{
 *   customer_code:         string,
 *   transaction_date:      string,

 *   tax_rate:              number,
 *   amount_ex_tax:         number,
 *   tax_amount:            number,
 *   invoice_detail_remark: string,
 * }>}
 */
let parsedData = null;

// parsedData のみ sessionStorage から復元する（確認画面の表示用）。
// rawCsvBase64 / utf8CsvBase64 はメモリのみ保持のため、リロード後は送信不可。
try {
  const _saved = sessionStorage.getItem('shiire_parsedData');
  if (_saved) parsedData = JSON.parse(_saved);

  // 型バリデーション: 想定外の値は捨ててセッションをクリア
  const isValidRow = r =>
    r !== null && typeof r === 'object' &&
    'customer_code' in r &&
    'amount_ex_tax' in r &&
    'tax_rate'      in r;

  if (parsedData !== null && (!Array.isArray(parsedData) || !parsedData.every(isValidRow))) {
    console.warn('[state] sessionStorage の parsedData が不正な形式です。破棄します。');
    parsedData = null;
    sessionStorage.removeItem('shiire_parsedData');
  }
} catch (e) {

}

/** 自動非表示タイマーID */
let _toastTimer = null;

/**
 * @param {string} message
 * @param {'error'|'success'} [type='error']
 * @param {number} [autoHideMs] - 自動非表示までのミリ秒。省略時: success=4000ms, error=0（自動非表示なし）
 */
function showToast(message, type = 'error', autoHideMs, body) {
  const titleEl = document.getElementById('toastTitle');
  const bodyEl  = document.getElementById('toastBody');
  const iconEl  = document.getElementById('toastIcon');
  if (titleEl) titleEl.textContent = message;
  if (bodyEl) {
    if (body) {
      bodyEl.innerHTML = body;
      bodyEl.style.display = '';
    } else {
      bodyEl.textContent = '';
      bodyEl.style.display = 'none';
    }
  }
  // アイコン切り替え
  if (iconEl) {
    iconEl.className = type === 'success'
      ? 'fa-solid fa-circle-check'
      : 'fa-solid fa-circle-exclamation';
  }
  toast.classList.remove('hidden', 'toast--error', 'toast--success');
  toast.classList.add(`toast--${type}`);

  // 既存タイマーをクリア
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }

  // 自動非表示: success はデフォルト8秒、error は明示指定がある場合のみ
  const delay = autoHideMs !== undefined ? autoHideMs : (type === 'success' ? 8000 : 0);
  if (delay > 0) {
    _toastTimer = setTimeout(hideToast, delay);
  }
}

function hideToast() {
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  toast.classList.add('hidden');
}

 */
function checkUploadDeadline_() {
  const banner  = document.getElementById('uploadDeadlineBanner');
  const message = document.getElementById('uploadDeadlineMessage');
  if (!banner || !message) return;

  // 一旦リセット（前回の期限切れ判定で無効化した入力UIも復元）
  banner.classList.add('hidden');
  const dropZone   = document.getElementById('dropZone');
  const btnSelect  = document.getElementById('btnSelectFile');
  const fileInput  = document.getElementById('fileInput');
  const btnConfirm = document.getElementById('btnToConfirm');
  if (dropZone)   { dropZone.style.pointerEvents = ''; dropZone.style.opacity = ''; }
  if (btnSelect)  btnSelect.disabled  = false;
  if (fileInput)   fileInput.disabled  = false;
  // btnToConfirm: ファイルが正常に読み込まれていれば有効化、それ以外は disabled のまま
  if (btnConfirm) btnConfirm.disabled = !(parsedData && rawCsvBase64 && utf8CsvBase64);

  const wholesalerId = sessionStorage.getItem('shiire_wholesaler_id');
  if (!wholesalerId) return;
  const jst       = jstNow_();
  const currentYM = jst.ym;
  const cacheKey  = 'shiire_schedule_cache_' + wholesalerId + '_' + currentYM;
  const cached    = sessionStorage.getItem(cacheKey);
  if (!cached) return;

  try {
    const events  = JSON.parse(cached);
    const storage = events.find(function(e) {
      return e.event_type === 'WHOLESALER_INVOICE_STORAGE';
    });
    if (!storage) return;

    const today = jst.ymd;
    const endAt = String(storage.end_at).slice(0, 10);

    if (today > endAt) {
      // 期限切れ: アップロードフォームを無効化
      message.textContent = '請求書受付期間（' + endAt + ' まで）を過ぎているため、アップロードできません。';
      banner.classList.remove('hidden');
      if (dropZone)   { dropZone.style.pointerEvents = 'none'; dropZone.style.opacity = '0.5'; }
      if (btnSelect)  btnSelect.disabled  = true;
      if (fileInput)   fileInput.disabled  = true;
      if (btnConfirm) btnConfirm.disabled = true;
    }
  } catch (e) {
    console.warn('[upload] 期限チェック失敗:', e);
  }
}

/** @param {File} file */
function handleFile(file) {
  // ── Step 1: アカウント情報取得済みチェック ────────────────────────────────
  if (!sessionStorage.getItem('shiire_csv_format_rules')) {
    showToast('アカウント情報を取得中です。しばらく待ってから再度お試しください。');
    return;
  }

  // ── Step 2: ファイル形式チェック ──────────────────────────────────────────
  if (!file.name.toLowerCase().endsWith('.csv')) {
    showToast('CSVファイルを選択してください');
    resetDropZone();
    return;
  }

  hideToast();

  // ── Step 3: CSVを読み込んでパース＆バリデーション ────────────────────────
  // ファイル選択直後にドロップゾーンを「解析中」スピナーへ切り替える。
  // すぐに結果が出るとユーザーが「本当に確認したの？」と不安になるため、
  // 最低 MIN_ANALYZE_MS だけスピナーを表示してから結果を描画する。
  // 連続ファイル選択時に前回のタイマーが残っていると古い結果で上書きされるため、
  // 新しい handleFile 呼び出しの先頭で必ずキャンセルする。
  if (_analyzeTimer !== null) {
    clearTimeout(_analyzeTimer);
    _analyzeTimer = null;
  }
  // 前回の FileReader が読み込み中なら abort して onload が後から発火しないようにする
  if (_currentReader !== null) {
    _currentReader.abort();
    _currentReader = null;
  }
  setDropZoneAnalyzing(file.name);
  const analyzeStartMs = Date.now();
  const MIN_ANALYZE_MS = 600; // スピナーの最小表示時間 (ms)

  const reader = new FileReader();
  _currentReader = reader; // グローバルに保持して次回の呼び出しで abort できるようにする

  reader.onload = e => {
    // abort 後に遅れて発火した古い onload は無視する
    if (reader !== _currentReader) return;
    _currentReader = null;

    const buffer = e.target.result;
    const text   = stripQuotedNewlines(decodeBuffer_(buffer));

    // validateCsv() 内で getCsvFormatRules() が throw する場合があるため try/catch する。
    // 未捕捉のまま例外が飛ぶと dropZone が is-analyzing のまま固まるため、
    // catch 時はスピナーを解除してユーザーに通知する。
    let errors, rows;
    try {
      ({ errors, rows } = validateCsv(text));
    } catch (err) {
      _currentReader = null;
      dropZone.classList.remove('is-analyzing');
      showToast(err.message || 'CSVの検証中にエラーが発生しました');
      resetDropZone();
      return;
    }

    // ── 当月重複チェック（sessionStorage キャッシュ参照）────────────────
    try {
      const cachedInvoices = JSON.parse(sessionStorage.getItem('shiire_invoices_cache') || '[]');
      const jstDup = jstNow_();
      const currentYM = jstDup.year + '/' + String(jstDup.month).padStart(2, '0');
      const hasCurrentMonth = cachedInvoices.some(inv => inv.created_at && inv.created_at.startsWith(currentYM));
      if (hasCurrentMonth) {
        errors.push('今月は既に新規の請求書が登録されています。差し戻しや否認の修正版のアップロードは詳細画面からアップロードしてください。');
      }
    } catch (e) {
      console.warn('[upload] 当月重複チェックに失敗しました:', e);
    }

    // ── 加盟店網羅性チェック（アラート: 非ブロッキング）────────────────────
    const warnings = [];
    if (rows.length > 0) {
      try {
        const mappings = getMerchantMappings();
        const csvCustomerCodes = new Set(rows.map(r => String(r.customer_code)));
        mappings.forEach(m => {
          if (m.is_active !== false && !csvCustomerCodes.has(String(m.customer_code))) {
            warnings.push((m.store_name || m.customer_code) + 'の請求明細がありません。');
          }
        });
      } catch (e) {
        console.warn('[upload] 加盟店網羅性チェックに失敗しました:', e);
      }
    }

    if (errors.length === 0) {
      // 成功: Base64はメモリのみ保持（sessionStorageには保存しない・容量超過防止）
      rawCsvBase64  = arrayBufferToBase64_(buffer);
      // BQ Load Job は UTF-8 を前提とするため、decodeBuffer_() で変換済みの text を
      // UTF-8 として再エンコードした Base64 を別途保持する
      utf8CsvBase64 = stringToBase64Utf8_(text);
      parsedData    = rows;
      // parsedData のみ sessionStorage に保存（確認画面の表示用。リロード後は送信不可）
      try {
        sessionStorage.setItem('shiire_parsedData', JSON.stringify(rows));
      } catch (e) {
        console.warn('[state] sessionStorage への保存に失敗しました:', e);
      }
    } else {
      // エラー: 保持データをクリア
      rawCsvBase64  = null;
      utf8CsvBase64 = null;
      parsedData    = null;
      try {
        sessionStorage.removeItem('shiire_parsedData');
      } catch (e) {
        console.warn('[state] sessionStorage のクリアに失敗しました:', e);
      }
    }

    // スピナーが最低表示時間に達するまで待ってから結果を描画する
    const elapsed   = Date.now() - analyzeStartMs;
    const remaining = Math.max(0, MIN_ANALYZE_MS - elapsed);
    _analyzeTimer = setTimeout(() => {
      _analyzeTimer = null;
      dropZone.classList.remove('is-analyzing');
      renderErrors(errors, warnings, file.name, file.size);
    }, remaining);
  };

  reader.onerror = () => {
    if (reader !== _currentReader) return;
    _currentReader = null;
    dropZone.classList.remove('is-analyzing');
    showToast('ファイルの読み込みに失敗しました');
    resetDropZone();
  };

  // SJIS / UTF-8 を自動判定するため ArrayBuffer で読み込む
  reader.readAsArrayBuffer(file);
}

/**
 * ArrayBuffer を Base64 文字列に変換する。
 * @param {ArrayBuffer} buffer
 * @returns {string}
 */
function arrayBufferToBase64_(buffer) {
  const bytes     = new Uint8Array(buffer);
  const chunkSize = 8192; // 8KB ずつ処理してスタックオーバーフローを防ぐ
  const parts     = [];
  for (let i = 0; i < bytes.byteLength; i += chunkSize) {
    parts.push(String.fromCharCode(...bytes.subarray(i, i + chunkSize)));
  }
  return btoa(parts.join(''));
}

/**
 * UTF-8 文字列を Base64 エンコードする。
 * TextEncoder で UTF-8 バイト列に変換してから btoa() する。
 * BQ Load Job 投入用（Shift_JIS CSVを UTF-8 に変換した後に呼ぶ）。
 *
 * @param {string} text - UTF-8 として扱う文字列
 * @returns {string} Base64 文字列
 */
function stringToBase64Utf8_(text) {
  const bytes     = new TextEncoder().encode(text);
  const chunkSize = 8192;
  const parts     = [];
  for (let i = 0; i < bytes.byteLength; i += chunkSize) {
    parts.push(String.fromCharCode(...bytes.subarray(i, i + chunkSize)));
  }
  return btoa(parts.join(''));
}

/**
 * ArrayBuffer を文字コード自動判定してテキストに変換する。
 * UTF-8 BOM あり / UTF-8 妥当 → UTF-8 で decode。
 * それ以外 → Shift_JIS で decode し UTF-8 に変換して返す。
 *
 * @param {ArrayBuffer} buffer
 * @returns {string}
 */
function decodeBuffer_(buffer) {
  const bytes = new Uint8Array(buffer);

  // UTF-8 BOM チェック (EF BB BF)
  const hasUtf8Bom = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;
  if (hasUtf8Bom) {
    return new TextDecoder('utf-8').decode(buffer);
  }

  // UTF-8 として valid か試みる（fatal:true = 不正バイト列で例外）
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
  } catch (_) {
    // UTF-8 として invalid → Shift_JIS として decode
    return new TextDecoder('shift_jis').decode(buffer);
  }
}

// =============================================================================
// Upload page: CSV parse & validate
// =============================================================================

/**
 * ダブルクォートで囲まれたフィールド内の改行をスペースに置換する前処理。
 * RFC 4180 ではクォート内改行はフィールド値の一部だが、後段の split('\n') で
 * 行が壊れるため、事前にスペースへ正規化する。
 *
 * @param {string} csvText - CSV テキスト全体
 * @returns {string} クォート内改行をスペースに置換済みのテキスト
 */
function stripQuotedNewlines(csvText) {
  const buf = [];
  let inQuote = false;
  for (let i = 0; i < csvText.length; i++) {
    const ch = csvText[i];
    if (ch === '"') {
      if (inQuote && i + 1 < csvText.length && csvText[i + 1] === '"') {
        // RFC 4180 エスケープ（""）— そのまま出力し状態を変えない
        buf.push('""');
        i++;
      } else {
        inQuote = !inQuote;
        buf.push(ch);
      }
    } else if (inQuote && ch === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
      // CRLF → スペース 1 つに正規化
      buf.push(' ');
      i++;
    } else if (inQuote && (ch === '\n' || ch === '\r')) {
      buf.push(' ');
    } else {
      buf.push(ch);
    }
  }
  return buf.join('');
}

/**
 * CSV の1行をフィールド配列にパースする。
 * RFC 4180 準拠のダブルクォート・エスケープ（""）・空フィールド・行頭カンマを正しく処理する。
 * 正規表現の lastIndex に依存しない状態機械ベース実装のため、連続カンマ等で無限ループしない。
 *
 * @param {string} line - 改行を含まない1行
 * @returns {string[]} フィールド値の配列（前後スペースをtrim済み）
 */
function parseCsvLine(line) {
  const result = [];
  let i = 0;
  while (i <= line.length) {
    if (i === line.length) {
      // 末尾カンマがある場合のみ空フィールドを追加する。
      // クォートフィールド終端後など、カンマなしで行末に達した場合は追加しない。
      if (i > 0 && line[i - 1] === ',') result.push('');
      break;
    }
    if (line[i] === '"') {
      // ── クォートフィールド ──────────────────────────────────────────────
      let val = '';
      i++; // 開きクォートをスキップ
      while (i < line.length) {
        if (line[i] === '"' && line[i + 1] === '"') {
          // エスケープされたクォート（""）
          val += '"';
          i += 2;
        } else if (line[i] === '"') {
          // 閉じクォート
          i++;
          break;
        } else {
          val += line[i++];
        }
      }
      result.push(val.trim());
      if (line[i] === ',') i++; // 区切りカンマをスキップ
    } else {
      // ── 非クォートフィールド ────────────────────────────────────────────
      const end = line.indexOf(',', i);
      if (end === -1) {
        result.push(line.slice(i).trim());
        break;
      }
      result.push(line.slice(i, end).trim());
      i = end + 1;
    }
  }
  return result;
}

/**
 * csv_format_rules に基づいてCSVをパース・バリデーションする。
 * getCsvFormatRules() が null の場合はデフォルト9列（DEFAULT_CSV_COLUMNS_）を使用する。
 * merchant_mappings で customer_code の有効性もチェックする。
 *
 * @param {string} csvText
 * @returns {{ errors: string[], rows: Object[] }}
 */
function validateCsv(csvText) {
  const errors = [];
  const rows   = [];

  // SessionStorage からフォーマットルールとマッピングを取得
  const rules    = getCsvFormatRules();
  const columns  = rules ? rules.columns : DEFAULT_CSV_COLUMNS_;
  const mappings = getMerchantMappings();

  // columns.length（配列の要素数）ではなく 最大index+1（CSVの実際の列数）で算出する。
  // index に欠番がある場合（省略列を配列から抜いているケース）に columns.length だと
  // 正しいCSVを誤って「列数不一致」と判定してしまうため。
  const expectedCols = columns.reduce((max, col) => Math.max(max, col.index + 1), 0);

  // 有効な customer_code セットを作成
  // is_active が未提供（undefined）の場合は active 扱いにする
  const validCustomerCodes = new Set(
    mappings.filter(m => m.is_active !== false).map(m => String(m.customer_code))
  );

  // 改行コード統一・空行除去
  const lines = csvText
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .split('\n')
    .filter(line => line.trim() !== '');

  // ── 空ファイルチェック（lines[0] が undefined になる前に弾く）──────────────
  if (lines.length === 0) {
    errors.push('CSVが空です。ヘッダー行とデータ行を含むCSVをアップロードしてください');
    return { errors, rows };
  }

  // ── ヘッダー行チェック ─────────────────────────────────────────────────────
  const headerCols = parseCsvLine(lines[0]);
  if (headerCols.length !== expectedCols) {
    errors.push(`ヘッダー行のカラム数が正しくありません（${headerCols.length}列 / 期待値: ${expectedCols}列）`);
    return { errors, rows };
  }
  const headerErrors = columns
    .map((col) => {
      return headerCols[col.index] !== col.csv_header
        ? `ヘッダー行 ${col.index + 1}列目: "${col.csv_header}" が期待されますが "${headerCols[col.index]}" になっています`
        : null;
    })
    .filter(Boolean);
  if (headerErrors.length > 0) {
    errors.push(...headerErrors);
    return { errors, rows };
  }

  if (lines.length <= 1) {
    errors.push('CSVにデータ行が1件もありません');
    return { errors, rows };
  }

  // ── データ行チェック ────────────────────────────────────────────────────────
  for (let i = 1; i < lines.length; i++) {
    const rowNum  = i + 1;
    // 空行（末尾改行等）はスキップ
    if (lines[i].trim() === '') continue;
    const cols    = parseCsvLine(lines[i]);
    const rowErrors = [];

    if (cols.length !== expectedCols) {
      errors.push(`${rowNum}行目: カラム数が正しくありません（${cols.length}列 / 期待値: ${expectedCols}列）`);
      continue;
    }

    const rowObj = {};
    columns.forEach((col) => {
      // system_column が null（JS の null）または文字列 "null"（GAS の JSON 変換由来）の
      // 両方を null 扱いにする。null 列はプレースホルダーキーを使用する。
      const hasSystemColumn = col.system_column !== null
        && col.system_column !== undefined
        && col.system_column !== 'null';
      const key = hasSystemColumn ? col.system_column : `_col_${col.index}`;
      const val  = cols[col.index]; // idx（配列並び順）ではなく col.index（CSV上の列位置）で参照

      // 必須チェック
      if (col.required && val === '') {
        rowErrors.push(`${rowNum}行目: "${col.csv_header}" は必須項目です`);
        return;
      }
      if (val === '') {
        rowObj[key] = '';
        return;
      }

      // 型チェック
      switch (col.type) {
        case 'date': {
          // format 定義に応じてバリデーションパターンを切り替える。
          // 1) 正規表現で形式チェック → 2) Date オブジェクトで実在チェック。
          // ※ BQ 側の PARSE_DATE フォーマット文字列も合わせて更新が必要な場合は
          //    be_csv_mapper.js の buildInvoiceLinesSelectSql_() を確認すること。
          const fmt = col.format || 'YYYY-MM-DD';
          let dateOk = false;
          let dateHint = '';
          if (fmt === 'YYYYMMDD') {
            // 例: 20260301
            dateOk   = /^\d{8}$/.test(val);
            dateHint = 'YYYYMMDD形式（例: 20260301）';
          } else if (fmt === 'YYYY/MM/DD') {
            // 例: 2026/03/01（Excel 日本語保存でよく発生）
            dateOk   = /^\d{4}\/\d{2}\/\d{2}$/.test(val);
            dateHint = 'YYYY/MM/DD形式（例: 2026/03/01）';
          } else if (fmt === 'YYYY-MM-DD' || !col.format) {
            // デフォルト: YYYY-MM-DD (ISO 8601)
            dateOk   = /^\d{4}-\d{2}-\d{2}$/.test(val);
            dateHint = 'YYYY-MM-DD形式（例: 2026-03-01）';
          } else {
            // 未対応フォーマット → バックエンドも throw するため明示エラー
            // 対応フォーマット: YYYYMMDD / YYYY/MM/DD / YYYY-MM-DD
            rowErrors.push(
              `${rowNum}行目: "${col.csv_header}" の日付フォーマット "${fmt}" は未対応です。` +
              'csv_format_rules の format を YYYYMMDD / YYYY/MM/DD / YYYY-MM-DD のいずれかに設定してください。'
            );
            break;
          }
          if (!dateOk) {
            rowErrors.push(`${rowNum}行目: "${col.csv_header}" は${dateHint}で入力してください`);
          } else {
            // 日付の実在チェック（例: 2月30日, 13月 などを検出）
            // JS の Date は不正な日付を自動補正する（2/30 → 3/2）ため、
            // 復元した年月日が元の値と一致するか確認する。
            let y, m, d;
            if (fmt === 'YYYYMMDD') {
              y = parseInt(val.substring(0, 4), 10);
              m = parseInt(val.substring(4, 6), 10);
              d = parseInt(val.substring(6, 8), 10);
            } else {
              const parts = val.split(/[-\/]/);
              y = parseInt(parts[0], 10);
              m = parseInt(parts[1], 10);
              d = parseInt(parts[2], 10);
            }
            const dt = new Date(0);
            dt.setUTCFullYear(y, m - 1, d);
            if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) {
              rowErrors.push(`${rowNum}行目: "${col.csv_header}" に存在しない日付が含まれています（${val}）`);
            } else {
              rowObj[key] = val;
            }
          }
          break;
        }
        case 'integer':
          if (val === '' || !/^-?\d+$/.test(val.trim())) {
            rowErrors.push(`${rowNum}行目: "${col.csv_header}" は整数で入力してください`);
          } else {
            const num = Number(val);
            // enumチェック
            if (col.enum && !col.enum.includes(num)) {
              rowErrors.push(`${rowNum}行目: "${col.csv_header}" は ${col.enum.join(' または ')} を入力してください`);
            } else {
              rowObj[key] = num;
            }
          }
          break;
        case 'decimal':
          if (val === '' || !/^-?\d+(\.\d{1,3})?$/.test(val.trim())) {
            rowErrors.push(`${rowNum}行目: "${col.csv_header}" は数値（小数第3位まで）で入力してください`);
          } else {
            const num = Number(val);
            if (col.enum && !col.enum.includes(num)) {
              rowErrors.push(`${rowNum}行目: "${col.csv_header}" は ${col.enum.join(' または ')} を入力してください`);
            } else {
              rowObj[key] = num;
            }
          }
          break;
        default: // string
          if (col.max_length && val.length > col.max_length) {
            rowErrors.push(`${rowNum}行目: "${col.csv_header}" は${col.max_length}文字以内で入力してください`);
          } else {
            rowObj[key] = val;
          }
      }
    });

    // customer_code の有効性チェック（merchant_mappings）
    // ※ cc === undefined の場合は汎用 required チェック（L1615）で既にエラー追加済みのためスキップ
    const cc = rowObj['customer_code'];
    const ccCol = columns.find(c => c.system_column === 'customer_code' || c.field === 'customer_code');
    const ccHeader = ccCol ? ccCol.csv_header : '加盟店コード';
    if (cc !== undefined && cc === '') {
      rowErrors.push(`${rowNum}行目: "${ccHeader}" は必須です`);
    } else if (cc !== undefined) {
      if (validCustomerCodes.size > 0 && !validCustomerCodes.has(String(cc))) {
        rowErrors.push(`${rowNum}行目: "${ccHeader}" の値 "${cc}" は請求可能な${ccHeader}ではありません`);
      }
    }

    if (rowErrors.length === 0) {
      rows.push(rowObj);
    } else {
      errors.push(...rowErrors);
    }
  }

  return { errors, rows };
}

// =============================================================================
// Upload page: Render errors to UI
// =============================================================================

/**
 * @param {string[]} errors   - ブロッキングエラー（送信ボタンを disabled にする）
 * @param {string[]} warnings - 非ブロッキングアラート（送信は可能）
 * @param {string}   [fileName] - 成功時に表示するファイル名
 * @param {number}   [fileSize] - ファイルサイズ（バイト）
 */
function renderErrors(errors, warnings, fileName, fileSize) {
  // リストをいったん空にする
  alertList.innerHTML = '';
  const hasErrors   = errors.length > 0;
  const hasWarnings = warnings && warnings.length > 0;

  if (hasErrors || hasWarnings) {
    // エラーがある場合は dropZone を初期状態に戻しファイル情報も非表示、アラートのみなら成功表示
    if (hasErrors) {
      resetDropZone();
      fileInfoEl.classList.add('hidden');
    } else {
      setDropZoneSuccess(fileName || '', fileSize);
    }

    // エラーを先に表示
    errors.forEach(msg => {
      const li = document.createElement('li');
      li.className = 'alert-item alert-item--error';
      li.innerHTML = '<i class="fa-solid fa-circle alert-icon"></i>' + escapeHtml(msg);
      alertList.appendChild(li);
    });
    // アラートを後に表示
    (warnings || []).forEach(msg => {
      const li = document.createElement('li');
      li.className = 'alert-item alert-item--warn';
      li.innerHTML = '<i class="fa-solid fa-triangle-exclamation alert-icon"></i>' + escapeHtml(msg);
      alertList.appendChild(li);
    });

    errorCard.classList.remove('hidden');
    btnToConfirm.disabled = hasErrors; // エラーがなければボタン有効
  } else {
    // エラーもアラートもなし → 成功表示
    setDropZoneSuccess(fileName || '', fileSize);
    errorCard.classList.add('hidden');
    btnToConfirm.disabled = false;
  }
}

  if (_modalTrigger && typeof _modalTrigger.focus === 'function') {

  }
  _modalTrigger = null;
}
