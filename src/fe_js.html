<script>
// ---- account.js ----
// =============================================================================
// Account: ログイン時のアカウント情報取得・SessionStorage管理
// =============================================================================

/**
 * アカウント情報APIのレスポンスを SessionStorage に保存する。
 * @param {Object} data - getAccountInfo() のレスポンス data フィールド
 */
function saveAccountInfo(data) {
  try {
    sessionStorage.setItem('shiire_wholesaler_id',    String(data.wholesaler_id   ?? ''));
    sessionStorage.setItem('shiire_wholesaler_user_id', String(data.wholesaler_user_id ?? ''));
    sessionStorage.setItem('shiire_wholesaler_name',  String(data.wholesaler_name ?? ''));
    sessionStorage.setItem('shiire_user_name',        String(data.user_name       ?? ''));
    sessionStorage.setItem('shiire_invoice_fee_rate', String(data.fee_rate ?? 0));
    sessionStorage.setItem('shiire_merchant_mappings',  JSON.stringify(data.merchant_mappings  || []));
    sessionStorage.setItem('shiire_csv_format_rules',   JSON.stringify(data.csv_format_rules   || null));
    console.log('[account] SessionStorage に卸情報を保存しました:', data.wholesaler_name);
  } catch (e) {
    console.warn('[account] SessionStorage への保存に失敗しました:', e);
  }
}

/**
 * SessionStorage から merchant_mappings を取得する。
 * @returns {Array<{customer_code:string, mall_code:string, merchant_name:string, is_active:boolean}>}
 */
function getMerchantMappings() {
  try {
    return JSON.parse(sessionStorage.getItem('shiire_merchant_mappings') || '[]');
  } catch (_) { return []; }
}

/**
 * SessionStorage から csv_format_rules を取得する。
 * null の場合はデフォルトフォーマット定義を返す。
 * @returns {Object}
 */
function getCsvFormatRules() {
  try {
    const raw = JSON.parse(sessionStorage.getItem('shiire_csv_format_rules'));
    if (raw && Object.keys(raw).length > 0) return raw;
  } catch (_) {}
  // デフォルトフォーマット（csv_format_rules が空の卸向け）
  return {
    customer_code:         { csv_header: '加盟店コード',       type: 'string',  required: true  },
    transaction_date:      { csv_header: '日付',               type: 'date',    required: true  },
    item_name:             { csv_header: '品目',               type: 'string',  required: true  },
    quantity:              { csv_header: '数量',               type: 'integer', required: true  },
    unit_price:            { csv_header: '単価',               type: 'integer', required: true  },
    tax_rate:              { csv_header: '税率区分(%)',         type: 'integer', required: true, enum: [8, 10] },
    amount_ex_tax:         { csv_header: '請求金額（税抜）',   type: 'integer', required: true  },
    invoice_detail_remark: { csv_header: '備考',               type: 'string',  required: false },
  };
}

// =============================================================================
// Account: アプリ初期化（DOMContentLoaded で実行）
// =============================================================================

document.addEventListener('DOMContentLoaded', function () {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.data) {
          saveAccountInfo(result.data);
          enableUploadUi_();
        } else {
          console.error('[account] getAccountInfo のレスポンスが不正です:', result);
          showUploadUiError_('アカウント情報の取得に失敗しました。ページを再読み込みしてください。');
        }
      })
      .withFailureHandler(function (err) {
        console.error('[account] getAccountInfo failed:', err);
        showUploadUiError_('アカウント情報の取得に失敗しました。ページを再読み込みしてください。');
      })
      .getAccountInfo();
  } else {
    // ── ローカル確認用フォールバック（GAS 環境外）────────────────────────
    console.warn('[account] google.script.run が利用できません。モックデータを使用します。');
    saveAccountInfo({
      wholesaler_id:      1,
      wholesaler_name:    'ベジクル',
      wholesaler_user_id: 1,
      user_name:          '卸 担当者A',
      fee_rate:           3,
      csv_format_rules: {
        transaction_date: { csv_header: '伝票日付',   type: 'date',    required: true },
        slip_number:      { csv_header: '伝票番号',   type: 'integer', required: true },
        customer_code:    { csv_header: '得意先コード', type: 'string', required: true },
        merchant_name:    { csv_header: '請求先名',   type: 'string',  required: true },
        item_name:        { csv_header: '商品名',     type: 'string',  required: true, max_length: 250 },
        quantity:         { csv_header: '売上数量',   type: 'integer', required: true },
        unit:             { csv_header: '数量単位',   type: 'string',  required: true },
        unit_price:       { csv_header: '単価',       type: 'integer', required: true },
        amount_ex_tax:    { csv_header: '金額',       type: 'integer', required: true },
        tax_rate:         { csv_header: '消費税率',   type: 'integer', required: true, enum: [8, 10] },
      },
      merchant_mappings: [
        { customer_code: '1189', mall_code: 'U123', merchant_name: '焼肉USEN 1号店', is_active: true },
        { customer_code: '1200', mall_code: 'U234', merchant_name: '焼肉USEN 2号店', is_active: true },
      ],
    });
    enableUploadUi_();
  }
});

/**
 * アカウント情報取得完了後にアップロードUIを有効化する。
 * DOMContentLoaded 時点では dropZone / fileInput が disabled になっている前提。
 */
function enableUploadUi_() {
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  const btn = document.getElementById('btnSelectFile');
  if (dz)  dz.classList.remove('is-disabled');
  if (fi)  fi.disabled  = false;
  if (btn) btn.disabled = false;
}

/**
 * アカウント情報取得失敗時にアップロードUIをエラー表示に切り替える。
 * @param {string} message
 */
function showUploadUiError_(message) {
  const dz = document.getElementById('dropZone');
  if (dz) {
    dz.innerHTML = '<p class="upload-area__error">' + message + '</p>';
  }
}


// ---- utils.js ----
// =============================================================================
// Utils: 共通ユーティリティ
// =============================================================================

/**
 * 全画面ローディングスピナーを表示する。
 * @param {string} [text='登録中...'] - スピナー下部に表示するテキスト
 */
function showLoadingOverlay(text) {
  const overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  const textEl = overlay.querySelector('.loading-overlay__text');
  if (textEl) textEl.textContent = text || '登録中...';
  overlay.classList.remove('hidden');
  overlay.setAttribute('aria-hidden', 'false');
}

/** 全画面ローディングスピナーを非表示にする。 */
function hideLoadingOverlay() {
  const overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  overlay.classList.add('hidden');
  overlay.setAttribute('aria-hidden', 'true');
}

/**
 * XSS 対策: HTML 特殊文字をエスケープする
 * @param {string} str
 * @returns {string}
 */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


// ---- home.js ----
// =============================================================================
// Home page: カレンダー状態
// =============================================================================

/** 現在表示中の年月（初期値は実行時の当月） */
const _today = new Date();
let calYear  = _today.getFullYear();
let calMonth = _today.getMonth(); // 0始まり

/** スケジュールデータのキャッシュ（日付文字列 → オブジェクト配列） */
let scheduleMap = {};

// =============================================================================
// Home page: 初期化
// =============================================================================

/**
 * ホーム画面表示時に GAS からデータを取得し、カレンダーと請求履歴を描画する。
 * 既に描画済みの場合は再描画しない（フラグ管理）。
 */
let homeInitialized = false;

function initHomePage() {
  if (homeInitialized) return;
  homeInitialized = true;

  // カレンダーナビゲーションボタンのイベント登録
  document.getElementById('calPrev').addEventListener('click', () => {
    calMonth -= 1;
    if (calMonth < 0) { calMonth = 11; calYear -= 1; }
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonth += 1;
    if (calMonth > 11) { calMonth = 0; calYear += 1; }
    renderCalendar();
  });

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    // スケジュールデータ取得
    google.script.run
      .withSuccessHandler(function(result) {
        buildScheduleMap(result && result.data ? result.data : []);
        renderCalendar();
      })
      .withFailureHandler(function(err) {
        console.error('[home] getMockScheduleData failed:', err);
        renderCalendar(); // データなしでもカレンダーは表示
      })
      .getMockScheduleData();

    // 請求履歴取得
    google.script.run
      .withSuccessHandler(function(result) {
        renderBillingHistory(result && result.data ? result.data : []);
      })
      .withFailureHandler(function(err) {
        console.error('[home] getMockBillingHistory failed:', err);
        renderBillingHistory([]); // 失敗時も空リストを描画しUIが空白にならないようにする
      })
      .getMockBillingHistory();
  } else {
    // ローカル確認用フォールバック
    // NOTE: 以下のデータは server.js の MOCK_SCHEDULE_ / MOCK_BILLING_BASE_ / MOCK_BILLING_ENTRIES_
    //       と同一形式を維持すること。BackOffice API 実装後は両方まとめて削除する。
    console.warn('[home] google.script.run が利用できません。モックデータを使用します。');
    const mockSchedule = [
      { date: '2026-05-13', title: '請求確定', type: 'billing' },
      { date: '2026-05-27', title: '口座振替', type: 'payment' },
    ];
    /** server.js MOCK_BILLING_BASE_ と同一 */
    const billingBase = {
      billingAmount: 99999999, subtotalExTax: 90000000, taxAmount: 9999999,
      breakdown: [
        { rate: 10, subtotalExTax: 49999999, taxAmount: 4999999 },
        { rate: 8,  subtotalExTax: 50000000, taxAmount: 4000000 },
      ],
      fee: 9999999, transferAmount: 990000000, status: '支払完了',
    };
    /** server.js MOCK_BILLING_ENTRIES_ と同一 */
    const mockBilling = [
      { id: 'b001', monthLabel: '4月' },
      { id: 'b002', monthLabel: '3月' },
      { id: 'b003', monthLabel: '2月' },
      { id: 'b004', monthLabel: '1月' },
    ].map(entry => Object.assign({}, billingBase, entry));
    buildScheduleMap(mockSchedule);
    renderCalendar();
    renderBillingHistory(mockBilling);
  }
}

// =============================================================================
// Home page: スケジュールマップ構築
// =============================================================================

/**
 * 配列 → { '2026-05-13': [{...}], ... } の形に変換してキャッシュ
 * @param {Array<{date:string, title:string, type:string}>} items
 */
function buildScheduleMap(items) {
  scheduleMap = {};
  (items || []).forEach(item => {
    if (!scheduleMap[item.date]) scheduleMap[item.date] = [];
    scheduleMap[item.date].push(item);
  });
}

// =============================================================================
// Home page: カレンダー描画
// =============================================================================

function renderCalendar() {
  const label = document.getElementById('calMonthLabel');
  const grid  = document.getElementById('calGrid');
  if (!label || !grid) return;

  label.innerHTML = `<span class="cal-label__year">${calYear}年</span><span class="cal-label__month">${calMonth + 1}月</span>`;
  grid.innerHTML  = '';

  // 月の初日の曜日（0=日, 6=土）
  const firstDay  = new Date(calYear, calMonth, 1).getDay();
  // 月の末日
  const lastDate  = new Date(calYear, calMonth + 1, 0).getDate();
  // 今日
  const today     = new Date();
  const isThisMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;

  // 空白セル（月初前）
  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-cell cal-cell--empty';
    grid.appendChild(blank);
  }

  // 日付セル
  for (let d = 1; d <= lastDate; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    const mm   = String(calMonth + 1).padStart(2, '0');
    const dd   = String(d).padStart(2, '0');
    const key  = `${calYear}-${mm}-${dd}`;

    if (isThisMonth && d === today.getDate()) {
      cell.classList.add('cal-cell--today');
    }

    // 日付番号
    const num = document.createElement('span');
    num.className   = 'cal-cell__num';
    num.textContent = String(d);
    cell.appendChild(num);

    // スケジュールバッジ
    const events = scheduleMap[key] || [];
    events.forEach(ev => {
      const badge = document.createElement('div');
      badge.className = `cal-badge cal-badge--${ev.type}`;
      badge.textContent = ev.title;
      cell.appendChild(badge);
    });

    if (events.length > 0) {
      cell.classList.add('cal-cell--has-event');
    }

    grid.appendChild(cell);
  }
}

// =============================================================================
// Home page: 請求履歴描画
// =============================================================================

/**
 * 請求履歴リストを描画する
 * @param {Array<{
 *   id: string,
 *   monthLabel: string,
 *   billingAmount: number,
 *   subtotalExTax: number,
 *   taxAmount: number,
 *   breakdown: Array<{rate: number, subtotalExTax: number, taxAmount: number}>,
 *   fee: number,
 *   transferAmount: number,
 *   status: string
 * }>} items
 */
function renderBillingHistory(items) {
  const list = document.getElementById('billingHistoryList');
  if (!list) return;
  list.innerHTML = '';

  if (!items || items.length === 0) {
    list.innerHTML = '<p class="billing-empty">請求履歴がありません。</p>';
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'billing-card';

    const fmt = n => Number(n).toLocaleString('ja-JP');

    // 内訳：グリッド表形式（内訳 | 小計ラベル | 税額ラベル → 10% | 値 | 値 → 8% | 値 | 値）
    const rateItems = (item.breakdown || []);
    const breakdownDataRows = rateItems.map(b => `
      <div class="bc-breakdown__cell bc-breakdown__rate">${escapeHtml(String(b.rate))}%</div>
      <div class="bc-breakdown__cell bc-breakdown__col-val">${fmt(b.subtotalExTax)}円</div>
      <div class="bc-breakdown__cell bc-breakdown__col-val">${fmt(b.taxAmount)}円</div>
    `).join('');

    card.innerHTML = `
      <div class="bc-month">${escapeHtml(item.monthLabel)}</div>

      <div class="bc-billing">
        <div class="bc-billing__label">請求金額</div>
        <div class="bc-billing__amount">${fmt(item.billingAmount)}円</div>
        <div class="bc-billing__sub">小計（税抜）<span>${fmt(item.subtotalExTax)}円</span></div>
        <div class="bc-billing__sub">税額<span>${fmt(item.taxAmount)}円</span></div>
      </div>

      <div class="bc-divider"></div>

      <div class="bc-breakdown">
        <div class="bc-breakdown__grid">
          <div class="bc-breakdown__cell bc-breakdown__title">内訳</div>
          <div class="bc-breakdown__cell bc-breakdown__col-label">小計（税抜）</div>
          <div class="bc-breakdown__cell bc-breakdown__col-label">税額</div>
          ${breakdownDataRows}
        </div>
      </div>

      <div class="bc-divider"></div>

      <div class="bc-fee">
        <div class="bc-fee__row">手数料<span>${fmt(item.fee)}円</span></div>
        <div class="bc-fee__row">振込金額<span>${fmt(item.transferAmount)}円</span></div>
      </div>

      <button type="button" class="bc-detail-link" data-id="${escapeHtml(item.id)}">詳細を見る &gt;</button>
    `;

    // 詳細リンク: invoiceId をハッシュクエリに含めて #detail へ遷移
    card.querySelector('.bc-detail-link').addEventListener('click', function() {
      location.hash = '#detail?invoiceId=' + encodeURIComponent(this.dataset.id);
    });

    list.appendChild(card);
  });
}


// ---- upload.js ----
// =============================================================================
// Upload page: DOM references
// =============================================================================

const dropZone       = document.getElementById('dropZone');
const btnSelectFile  = document.getElementById('btnSelectFile');
const fileInput      = document.getElementById('fileInput');
const btnToConfirm   = document.getElementById('btnToConfirm');
const btnCancel      = document.getElementById('btnCancel');
const btnFinalSubmit = document.getElementById('btnFinalSubmit');
const errorCard      = document.getElementById('errorCard');
const alertList      = document.getElementById('alertList');
const toast          = document.getElementById('toast');
const toastClose     = document.getElementById('toastClose');

// =============================================================================
// Upload page: State（バックエンド送信用データ保持）
// =============================================================================

/** 読み込んだCSVの元バイト列をBase64エンコードした文字列（DriveにSJISなど元ファイルそのまま保存するため） */
let rawCsvBase64 = null;

/**
 * パース済みデータ行の配列。各要素はカラム名をキーとしたオブジェクト。
 * @type {Array<{storeCode:string, date:string, item:string, qty:number,
 *              unitPrice:number, taxRate:number, amountExTax:number,
 *              tax:number, note:string}>}
 */
let parsedData = null;

// sessionStorage からリロード時に復元（GAS セッションタイムアウト対策）
try {
  const _saved  = sessionStorage.getItem('shiire_parsedData');
  const _rawB64  = sessionStorage.getItem('shiire_rawCsvBase64');
  if (_saved)  parsedData    = JSON.parse(_saved);
  if (_rawB64) rawCsvBase64 = _rawB64;

  // 型バリデーション: 想定外の値は捨ててセッションをクリア
  // 新フォーマット（csv_format_rules ベース）は customer_code と amount_ex_tax / tax_rate が必須キー
  const isValidRow = r =>
    r !== null && typeof r === 'object' &&
    'customer_code' in r &&
    'amount_ex_tax' in r &&
    'tax_rate'      in r;

  if (parsedData !== null && (!Array.isArray(parsedData) || !parsedData.every(isValidRow))) {
    console.warn('[state] sessionStorage の parsedData が不正な形式です。破棄します。');
    parsedData    = null;
    rawCsvBase64  = null;
    sessionStorage.removeItem('shiire_parsedData');
    sessionStorage.removeItem('shiire_rawCsvBase64');
  }
} catch (e) {
  console.warn('[state] sessionStorage の復元に失敗しました:', e);
}

// =============================================================================
// Upload page: Toast helpers
// =============================================================================

/** @param {string} message @param {'error'|'success'} [type='error'] */
function showToast(message, type = 'error') {
  document.getElementById('toastMessage').textContent = message;
  toast.classList.remove('hidden', 'toast--error', 'toast--success');
  toast.classList.add(`toast--${type}`);
}

function hideToast() {
  toast.classList.add('hidden');
}

toastClose.addEventListener('click', hideToast);

// =============================================================================
// Upload page: Drop zone helpers
// =============================================================================

/** 初期状態の dropZone 内 HTML（リセット時に復元する） */
const DROP_ZONE_DEFAULT_HTML = dropZone.innerHTML;

/** dropZone を初期状態に戻す */
function resetDropZone() {
  dropZone.innerHTML = DROP_ZONE_DEFAULT_HTML;
  // is-disabled / is-success を除去（アカウント取得済みの状態に戻す）
  dropZone.classList.remove('is-disabled', 'is-success');
  // innerHTML 差し替え後に DOM 参照とイベントを再登録
  const newBtn   = dropZone.querySelector('#btnSelectFile');
  const newInput = dropZone.querySelector('#fileInput');
  // disabled 属性を除去（初期HTMLは disabled 状態でキャプチャされているため）
  if (newBtn)   newBtn.disabled   = false;
  if (newInput) newInput.disabled = false;
  newBtn.addEventListener('click', () => newInput.click());
  newInput.addEventListener('change', function () {
    if (this.files[0]) handleFile(this.files[0]);
    this.value = '';
  });
}

/**
 * dropZone を成功表示に切り替える
 * @param {string} fileName
 */
function setDropZoneSuccess(fileName) {
  dropZone.innerHTML = `
    <i class="fa-regular fa-circle-check drop-zone__icon drop-zone__icon--success"></i>
    <p class="drop-zone__text drop-zone__text--success">
      📄 <strong id="dropZoneFileName"></strong> を読み込みました
    </p>
    <button class="btn btn-select-file" id="btnSelectFile">
      <i class="fa-regular fa-folder-open"></i> 別のファイルを選択
    </button>
    <input type="file" id="fileInput" accept=".csv" hidden />
  `;
  // XSS対策: ファイル名は textContent で挿入
  dropZone.querySelector('#dropZoneFileName').textContent = fileName;
  dropZone.classList.add('is-success');
  // 再バインド
  const newBtn   = dropZone.querySelector('#btnSelectFile');
  const newInput = dropZone.querySelector('#fileInput');
  newBtn.addEventListener('click', () => newInput.click());
  newInput.addEventListener('change', function () {
    if (this.files[0]) handleFile(this.files[0]);
    this.value = '';
  });
}

// =============================================================================
// Upload page: Drag & Drop
// =============================================================================

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});

['dragleave', 'dragend'].forEach(ev =>
  dropZone.addEventListener(ev, () => dropZone.classList.remove('drag-over'))
);

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

// =============================================================================
// Upload page: Click to select file
// =============================================================================

btnSelectFile.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
  // 同じファイルを再選択できるようリセット
  fileInput.value = '';
});

// =============================================================================
// Upload page: File handler
// =============================================================================

/** @param {File} file */
function handleFile(file) {
  // ── Step 1: アカウント情報取得済みチェック ────────────────────────────────
  if (!sessionStorage.getItem('shiire_csv_format_rules')) {
    showToast('アカウント情報を取得中です。しばらく待ってから再度お試しください。');
    return;
  }

  // ── Step 2: ファイルサイズチェック（Base64後に sessionStorage quota を超えないよう 5MB 上限）──
  const MAX_CSV_BYTES = 5 * 1024 * 1024; // 5MB（Base64後≒6.7MB、1.5万行程度まで対応）
  if (file.size > MAX_CSV_BYTES) {
    showToast('ファイルサイズが大きすぎます（上限 5MB）。行数を分割して再度お試しください。');
    resetDropZone();
    return;
  }

  // ── Step 3: ファイル形式チェック ──────────────────────────────────────────
  if (!file.name.toLowerCase().endsWith('.csv')) {
    showToast('CSVファイルを選択してください');
    resetDropZone();
    return;
  }

  hideToast();

  // ── Step 3: CSVを読み込んでパース＆バリデーション ────────────────────────
  const reader = new FileReader();

  reader.onload = e => {
    const buffer = e.target.result;
    const text   = decodeBuffer_(buffer);
    const { errors, rows } = validateCsv(text);

    if (errors.length === 0) {
      // 成功: 元バイト列をBase64で保持（Drive保存時に元ファイルをそのまま再現するため）
      const base64 = arrayBufferToBase64_(buffer);
      rawCsvBase64 = base64;
      parsedData   = rows;
      // リロード対策: sessionStorage に保存（容量超過時はベストエフォート）
      try {
        sessionStorage.setItem('shiire_parsedData',   JSON.stringify(rows));
        sessionStorage.setItem('shiire_rawCsvBase64', base64);
      } catch (e) {
        console.warn('[state] sessionStorage への保存に失敗しました:', e);
        showToast('ブラウザの一時保存領域が不足しています。このままページを離れると最初からやり直しになります。');
      }
    } else {
      // エラー: 保持データをクリア
      rawCsvBase64 = null;
      parsedData   = null;
      try {
        sessionStorage.removeItem('shiire_parsedData');
        sessionStorage.removeItem('shiire_rawCsvBase64');
      } catch (e) {
        console.warn('[state] sessionStorage のクリアに失敗しました:', e);
      }
    }

    renderErrors(errors, file.name);
  };

  reader.onerror = () => {
    showToast('ファイルの読み込みに失敗しました');
    resetDropZone();
  };

  // SJIS / UTF-8 を自動判定するため ArrayBuffer で読み込む
  reader.readAsArrayBuffer(file);
}

/**
 * ArrayBuffer を Base64 文字列に変換する。
 * @param {ArrayBuffer} buffer
 * @returns {string}
 */
function arrayBufferToBase64_(buffer) {
  const bytes     = new Uint8Array(buffer);
  const chunkSize = 8192; // 8KB ずつ処理してスタックオーバーフローを防ぐ
  const parts     = [];
  for (let i = 0; i < bytes.byteLength; i += chunkSize) {
    parts.push(String.fromCharCode(...bytes.subarray(i, i + chunkSize)));
  }
  return btoa(parts.join(''));
}

/**
 * ArrayBuffer を文字コード自動判定してテキストに変換する。
 * UTF-8 BOM あり / UTF-8 妥当 → UTF-8 で decode。
 * それ以外 → Shift_JIS で decode し UTF-8 に変換して返す。
 *
 * @param {ArrayBuffer} buffer
 * @returns {string}
 */
function decodeBuffer_(buffer) {
  const bytes = new Uint8Array(buffer);

  // UTF-8 BOM チェック (EF BB BF)
  const hasUtf8Bom = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;
  if (hasUtf8Bom) {
    return new TextDecoder('utf-8').decode(buffer);
  }

  // UTF-8 として valid か試みる（fatal:true = 不正バイト列で例外）
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
  } catch (_) {
    // UTF-8 として invalid → Shift_JIS として decode
    return new TextDecoder('shift_jis').decode(buffer);
  }
}

// Upload page: CSV parse & validate

/**
 * ダブルクォーテーション対応の1行パーサ。
 * @param {string} line
 * @returns {string[]}
 */
/**
 * CSV の1行をフィールド配列にパースする。
 * RFC 4180 準拠のクォート・エスケープ（""）・空フィールド・行頭カンマを正しく処理する。
 * 正規表現の lastIndex に依存しない状態機械ベース実装のため、連続カンマ等で無限ループしない。
 *
 * @param {string} line - 改行を含まない1行
 * @returns {string[]} フィールド値の配列（前後スペースをtrim済み）
 */
function parseCsvLine(line) {
  const result = [];
  let i = 0;
  while (i <= line.length) {
    if (i === line.length) {
      // 末尾カンマの後の空フィールドを処理
      result.push('');
      break;
    }
    if (line[i] === '"') {
      // ── クォートフィールド ──────────────────────────────────────────────
      let val = '';
      i++; // 開きクォートをスキップ
      while (i < line.length) {
        if (line[i] === '"' && line[i + 1] === '"') {
          // エスケープされたクォート（""）
          val += '"';
          i += 2;
        } else if (line[i] === '"') {
          // 閉じクォート
          i++;
          break;
        } else {
          val += line[i++];
        }
      }
      result.push(val.trim());
      if (line[i] === ',') i++; // 区切りカンマをスキップ
    } else {
      // ── 非クォートフィールド ────────────────────────────────────────────
      const end = line.indexOf(',', i);
      if (end === -1) {
        result.push(line.slice(i).trim());
        break;
      }
      result.push(line.slice(i, end).trim());
      i = end + 1;
    }
  }
  return result;
}

/**
 * csv_format_rules に基づいてCSVをパース・バリデーションする。
 * rules が空の場合はデフォルトフォーマットにフォールバック（getCsvFormatRules()）。
 * merchant_mappings で customer_code の有効性もチェックする。
 *
 * @param {string} csvText
 * @returns {{ errors: string[], rows: Object[] }}
 */
function validateCsv(csvText) {
  const errors = [];
  const rows   = [];

  // SessionStorage からフォーマットルールとマッピングを取得
  const rules    = getCsvFormatRules();
  const mappings = getMerchantMappings();

  // フィールドキー順リスト（ヘッダー順 = ルールの定義順）
  const fieldKeys   = Object.keys(rules);
  const expectedCols = fieldKeys.length;

  // 有効な customer_code セットを作成
  // is_active が未提供（undefined）の場合は active 扱いにする
  const validCustomerCodes = new Set(
    mappings.filter(m => m.is_active !== false).map(m => String(m.customer_code))
  );

  // 改行コード統一・空行除去
  const lines = csvText
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .split('\n')
    .filter(line => line.trim() !== '');

  // ── 空ファイルチェック（lines[0] が undefined になる前に弾く）──────────────
  if (lines.length === 0) {
    errors.push('CSVが空です。ヘッダー行とデータ行を含むCSVをアップロードしてください');
    return { errors, rows };
  }

  // ── ヘッダー行チェック ─────────────────────────────────────────────────────
  const headerCols = parseCsvLine(lines[0]);
  if (headerCols.length !== expectedCols) {
    errors.push(`ヘッダー行のカラム数が正しくありません（${headerCols.length}列 / 期待値: ${expectedCols}列）`);
    return { errors, rows };
  }
  const headerErrors = fieldKeys
    .map((key, idx) => {
      const expected = rules[key].csv_header;
      return headerCols[idx] !== expected
        ? `ヘッダー行 ${idx + 1}列目: "${expected}" が期待されますが "${headerCols[idx]}" になっています`
        : null;
    })
    .filter(Boolean);
  if (headerErrors.length > 0) {
    errors.push(...headerErrors);
    return { errors, rows };
  }

  if (lines.length <= 1) {
    errors.push('CSVにデータ行が1件もありません');
    return { errors, rows };
  }

  // ── データ行チェック ────────────────────────────────────────────────────────
  for (let i = 1; i < lines.length; i++) {
    const rowNum  = i + 1;
    const cols    = parseCsvLine(lines[i]);
    const rowErrors = [];

    if (cols.length !== expectedCols) {
      errors.push(`${rowNum}行目: カラム数が正しくありません（${cols.length}列 / 期待値: ${expectedCols}列）`);
      continue;
    }

    const rowObj = {};
    fieldKeys.forEach((key, idx) => {
      const rule = rules[key];
      const val  = cols[idx];

      // 必須チェック
      if (rule.required && val === '') {
        rowErrors.push(`${rowNum}行目: "${rule.csv_header}" は必須項目です`);
        return;
      }
      if (val === '') {
        rowObj[key] = '';
        return;
      }

      // 型チェック
      switch (rule.type) {
        case 'date':
          if (!/^\d{4}-\d{2}-\d{2}$/.test(val)) {
            rowErrors.push(`${rowNum}行目: "${rule.csv_header}" はYYYY-MM-DD形式で入力してください`);
          } else {
            rowObj[key] = val;
          }
          break;
        case 'integer':
          if (val === '' || !/^-?\d+$/.test(val.trim())) {
            rowErrors.push(`${rowNum}行目: "${rule.csv_header}" は整数で入力してください`);
          } else {
            const num = Number(val);
            // enumチェック
            if (rule.enum && !rule.enum.includes(num)) {
              rowErrors.push(`${rowNum}行目: "${rule.csv_header}" は ${rule.enum.join(' または ')} を入力してください`);
            } else {
              rowObj[key] = num;
            }
          }
          break;
        default: // string
          if (rule.max_length && val.length > rule.max_length) {
            rowErrors.push(`${rowNum}行目: "${rule.csv_header}" は${rule.max_length}文字以内で入力してください`);
          } else {
            rowObj[key] = val;
          }
      }
    });

    // customer_code の有効性チェック（merchant_mappings）
    const cc = rowObj['customer_code'];
    if (cc !== undefined && cc !== '') {
      if (validCustomerCodes.size > 0 && !validCustomerCodes.has(String(cc))) {
        rowErrors.push(`${rowNum}行目: "${cc}" は請求可能な加盟店コードではありません`);
      }
    }

    if (rowErrors.length === 0) {
      rows.push(rowObj);
    } else {
      errors.push(...rowErrors);
    }
  }

  return { errors, rows };
}

/**
 * @param {string[]} errors
 * @param {string}   [fileName] - 成功時に dropZone に表示するファイル名

function renderErrors(errors, fileName) {
  // リストをいったん空にする

  if (errors.length > 0) {
    // エラーがある → dropZone を初期状態に戻す → リスト生成 → errorCard 表示 → 送信ボタン disabled
    resetDropZone();
    errors.forEach(msg => {
      const li = document.createElement('li');
      li.className = 'alert-item alert-item--error';
      li.innerHTML = '<i class="fa-solid fa-circle alert-icon"></i>' + msg;
      alertList.appendChild(li);
    });
    errorCard.classList.remove('hidden');
    btnToConfirm.disabled = true;
  } else {
    // エラーなし → dropZone を成功表示に → errorCard 非表示 → 送信ボタン活性
    setDropZoneSuccess(fileName || '');
    errorCard.classList.add('hidden');
    btnToConfirm.disabled = false;
  }
}

/** BOM 付き UTF-8 CSV テンプレートをダウンロードする */
function downloadCsvTemplate() {
  // csv_format_rules（またはデフォルト定義）からヘッダーを動的生成
  const rules   = getCsvFormatRules();
  const headers = Object.values(rules).map(r => `"${r.csv_header}"`);
  const csvContent = headers.join(',') + '\r\n';

  // BOM (0xEF 0xBB 0xBF) を先頭に付与して UTF-8 BOM 付きにする
  const bom  = '\uFEFF';
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);

  const a    = document.createElement('a');
  a.href     = url;
  a.download = '請求CSVテンプレート.csv';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('btnTemplateDlHeader').addEventListener('click', downloadCsvTemplate);
document.getElementById('btnTemplateDlPage').addEventListener('click', e => {
  e.preventDefault();
  downloadCsvTemplate();
});

/** モーダルを開く直前にフォーカスしていた要素を記憶する */
let _modalTrigger = null;

/** フォーカス可能なセレクタ */
const FOCUSABLE = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';

/**
 * キャンセル確認モーダルを開く
 * @param {HTMLElement} [trigger] - 開くきっかけになった要素（閉じ後にフォーカスを戻す）
 */
function openCancelModal(trigger) {
  const modal = document.getElementById('cancelModal');
  _modalTrigger = trigger || document.activeElement;
  modal.classList.remove('hidden');
  // 最初のフォーカス可能要素へ移動
  const first = modal.querySelector(FOCUSABLE);
  if (first) first.focus();
}

/** キャンセル確認モーダルを閉じる */
function closeCancelModal() {
  const modal = document.getElementById('cancelModal');
  modal.classList.add('hidden');
  // フォーカスをトリガー要素に戻す
  if (_modalTrigger && typeof _modalTrigger.focus === 'function') {
    _modalTrigger.focus();
  }
  _modalTrigger = null;
}

// 確認ページ: キャンセルボタン → モーダルを表示
document.getElementById('btnConfirmCancel').addEventListener('click', function () {
  openCancelModal(this);
});

// モーダル: キャンセル（閉じるだけ）
document.getElementById('cancelModalClose').addEventListener('click', () => {
  closeCancelModal();
});

// モーダル: OK → データをリセットしアップロード画面へ
document.getElementById('cancelModalOk').addEventListener('click', () => {
  closeCancelModal();
  resetPage();
  location.hash = '#upload';
});

// モーダル: オーバーレイクリックで閉じる
document.getElementById('cancelModal').addEventListener('click', function (e) {
  if (e.target === this) closeCancelModal();
});

// モーダル: Esc キーで閉じる
document.addEventListener('keydown', e => {
  const modal = document.getElementById('cancelModal');
  if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
    closeCancelModal();
  }
});

// モーダル: フォーカストラップ（Tab / Shift+Tab をモーダル内に閉じ込める）
document.getElementById('cancelModal').addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  const focusable = Array.from(this.querySelectorAll(FOCUSABLE));
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last  = focusable[focusable.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
  }
});

  // customer_code → mall_code / merchant_name の変換マップ
  const mappingMap = {};
  mappings.forEach(m => { mappingMap[String(m.customer_code)] = m; });

  // ── サマリー計算（1パスで全集計）────────────────────────────────────────
  // tax_amount は amount_ex_tax × tax_rate ÷ 100（切り捨て）で計算
  const totals = parsedData.reduce((acc, r) => {
    const amtExTax  = Number(r['amount_ex_tax'] || 0);
    const taxRate   = Number(r['tax_rate']       || 0);
    const taxAmount = Math.floor(amtExTax * taxRate / 100);
    acc.amountExTax += amtExTax;
    acc.tax         += taxAmount;
    if (taxRate === 10) { acc.exTax10 += amtExTax; acc.tax10 += taxAmount; }
    else                { acc.exTax8  += amtExTax; acc.tax8  += taxAmount; }
    return acc;
  }, { amountExTax: 0, tax: 0, exTax10: 0, tax10: 0, exTax8: 0, tax8: 0 });

  const totalAmountExTax = totals.amountExTax;
  const totalTax         = totals.tax;
  const totalAmountInTax = totalAmountExTax + totalTax;
  const { exTax10, tax10, exTax8, tax8 } = totals;
  const feeAmount  = Math.floor(totalAmountInTax * feeRate / 100);
  const payAmount  = totalAmountInTax - feeAmount;

  document.getElementById('summaryAmountInTax').value = totalAmountInTax;
  document.getElementById('summaryAmountExTax').value = totalAmountExTax;
  document.getElementById('summaryTax').value         = totalTax;
  document.getElementById('summaryFeeRate').textContent = feeRate;
  document.getElementById('summaryFee').value         = feeAmount;
  document.getElementById('summaryTransfer').value    = payAmount;
  document.getElementById('summaryExTax10').value     = exTax10;
  document.getElementById('summaryTax10').value       = tax10;
  document.getElementById('summaryExTax8').value      = exTax8;
  document.getElementById('summaryTax8').value        = tax8;

  // ── customer_code ごとにグルーピング ─────────────────────────────────────
  /** @type {Map<string, Array>} */
  const groups = new Map();
  parsedData.forEach(row => {
    const cc = String(row['customer_code'] || '');
    if (!groups.has(cc)) groups.set(cc, []);
    groups.get(cc).push(row);
  });


  // ── 加盟店別リストを描画 ──────────────────────────────────────────────────
  const list = document.getElementById('confirmStoreList');
  list.innerHTML = '';

  // 列ヘッダー行
  const colHeader = document.createElement('div');
  colHeader.className = 'store-list-header';
  colHeader.innerHTML =
    `<span class="slh-col slh-col--name">加盟店名</span>` +
    `<span class="slh-col slh-col--amount">請求金額</span>` +
    `<span class="slh-col slh-col--extax">小計（税抜）</span>` +
    `<span class="slh-col slh-col--tax">消費税</span>` +
    `<span class="slh-col slh-col--tax8">消費税内訳（8%）</span>` +
    `<span class="slh-col slh-col--tax10">消費税内訳（10%）</span>` +
    `<span class="slh-col slh-col--toggle"></span>`;
  list.appendChild(colHeader);

  groups.forEach((rows, customerCode) => {
    const mapping  = mappingMap[customerCode] || {};
    // 加盟店表示名の解決ロジック:
    // 1. CSVに merchant_name 列がある（カスタムフォーマット）→ CSVの値を使用
    // 2. CSVに merchant_name 列がない（デフォルトフォーマット）→ merchant_mappings から customer_code で検索
    // 3. どちらも取得できない場合 → customer_code をそのまま表示
    const merchantNameFromCsv = String(rows[0]['merchant_name'] || '');
    const merchantNameFromMap  = (mappingMap[customerCode] || {}).merchant_name || '';
    const displayName          = merchantNameFromCsv || merchantNameFromMap || customerCode;

    const st = rows.reduce((acc, r) => {
      const amtExTax  = Number(r['amount_ex_tax'] || 0);
      const taxRate   = Number(r['tax_rate']       || 0);
      const taxAmount = Math.floor(amtExTax * taxRate / 100);
      acc.amountExTax += amtExTax;
      acc.tax         += taxAmount;
      if (taxRate === 10) { acc.exTax10 += amtExTax; acc.tax10 += taxAmount; }
      else                { acc.exTax8  += amtExTax; acc.tax8  += taxAmount; }
      return acc;
    }, { amountExTax: 0, tax: 0, exTax8: 0, tax8: 0, exTax10: 0, tax10: 0 });

    const storeAmountExTax = st.amountExTax;
    const storeTax         = st.tax;
    const storeTotal       = storeAmountExTax + storeTax;

    const card = document.createElement('div');
    card.className = 'store-accordion';
    card.dataset.cc = customerCode;

    const header = document.createElement('div');
    header.className = 'store-accordion__header';
    header.setAttribute('role', 'button');
    header.setAttribute('tabindex', '0');
    header.setAttribute('aria-expanded', 'false');
    header.innerHTML =
      `<span class="slh-col slh-col--name store-accordion__code">${escapeHtml(displayName)}</span>` +
      `<span class="slh-col slh-col--amount"><input type="number" class="amount-input" data-field="totalAmount" value="${storeTotal}" /></span>` +
      `<span class="slh-col slh-col--extax"><input type="number" class="amount-input" data-field="subtotalAmount" value="${storeAmountExTax}" /></span>` +
      `<span class="slh-col slh-col--tax"><input type="number" class="amount-input" data-field="taxAmount" value="${storeTax}" /></span>` +
      `<span class="slh-col slh-col--tax8"><input type="number" class="amount-input" data-field="tax8" value="${st.tax8}" /></span>` +
      `<span class="slh-col slh-col--tax10"><input type="number" class="amount-input" data-field="tax10" value="${st.tax10}" /></span>` +
      `<span class="slh-col slh-col--toggle"><i class="fa-solid fa-chevron-down store-accordion__icon"></i></span>`;

    const toggleAccordion = () => {
      const isOpen = card.classList.toggle('is-open');
      header.setAttribute('aria-expanded', String(isOpen));
    };
    header.addEventListener('click', toggleAccordion);
    header.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAccordion(); }
    });

    const body = document.createElement('div');
    body.className = 'store-accordion__body';

    rows.forEach(row => {
      const amtExTax  = Number(row['amount_ex_tax'] || 0);
      const taxRate   = Number(row['tax_rate']       || 0);
      const taxAmount = Math.floor(amtExTax * taxRate / 100);
      const item = document.createElement('div');
      item.className = 'detail-row';

      const fields = [
        { label: '取引日',   value: escapeHtml(String(row['transaction_date'] || '').replace(/-/g, '/')) },
        { label: '品名',     value: escapeHtml(String(row['item_name']        || '')) },
        { label: '数量',     value: Number(row['quantity']  || 0).toLocaleString('ja-JP') },
        { label: '単価',     value: Number(row['unit_price'] || 0).toLocaleString('ja-JP') + '円' },
        { label: '明細金額', value: amtExTax.toLocaleString('ja-JP') + '円' },
        { label: '税率',     value: taxRate + '%' },
        { label: '消費税',   value: taxAmount.toLocaleString('ja-JP') + '円' },
      ];

      const mainRow = document.createElement('div');
      mainRow.className = 'detail-row__main';
      mainRow.innerHTML = fields.map(f =>
        `<span class="detail-row__field">` +
          `<span class="detail-row__label">${f.label}</span>` +
          `<span class="detail-row__sep">|</span>` +
          `<span class="detail-row__value">${f.value}</span>` +
        `</span>`
      ).join('');
      item.appendChild(mainRow);

      const remark = String(row['invoice_detail_remark'] || '');
      const noteRow = document.createElement('div');
      noteRow.className = 'detail-row__note';
      noteRow.innerHTML = `<span class="detail-row__note-label">備考：</span>${remark ? escapeHtml(remark) : '<span class="detail-row__note-empty">なし</span>'}`;
      item.appendChild(noteRow);

      body.appendChild(item);
    });

    // 加盟店ごとの内訳 hidden input（collectSummaryData_ で読み取る）
    const hiddenDiv = document.createElement('div');
    hiddenDiv.style.display = 'none';
    hiddenDiv.innerHTML =
      `<input type="number" data-field="exTax10" value="${st.exTax10}" />` +
      `<input type="number" data-field="exTax8"  value="${st.exTax8}"  />`;
    body.appendChild(hiddenDiv);

    // 卸→加盟店 備考
    const remarksDiv = document.createElement('div');
    remarksDiv.className = 'store-accordion__remarks';
    remarksDiv.innerHTML =
      `<label class="remarks-label">卸→加盟店 備考：</label>` +
      `<textarea class="remarks-input" data-customer-code="${escapeHtml(customerCode)}" placeholder="備考があれば入力してください"></textarea>`;
    body.appendChild(remarksDiv);

    card.appendChild(header);
    card.appendChild(body);
    list.appendChild(card);
  });
}

// =============================================================================
// Router: ハッシュベースの簡易 SPA ルーター
// =============================================================================

/**
 * 登録済みページのマップ。
 * key   : URL ハッシュ（'#upload' など）
 * value : そのページのルート要素の id
 */
const ROUTES = {
  '#home':    'pageHome',
  '#upload':  'pageUpload',
  '#confirm': 'pageConfirm',
  '#detail':  'pageDetail',
};

/** デフォルトルート */
const DEFAULT_ROUTE = '#home';

/**
 * location.hash から { baseHash, params } を取り出す。
 * 例: '#detail?invoiceId=b001' → { baseHash: '#detail', params: URLSearchParams }
 * @returns {{ baseHash: string, params: URLSearchParams }}
 */
function parseHash() {
  const raw = location.hash || DEFAULT_ROUTE;
  const sepIdx = raw.indexOf('?');
  if (sepIdx === -1) {
    return { baseHash: raw, params: new URLSearchParams() };
  }
  return {
    baseHash: raw.slice(0, sepIdx),
    params:   new URLSearchParams(raw.slice(sepIdx + 1)),
  };
}

/**
 * 現在のハッシュに対応するページだけ表示し、他を非表示にする。
 */
function navigate() {
  const { baseHash, params } = parseHash();
  const targetId = ROUTES[baseHash] || ROUTES[DEFAULT_ROUTE];

  Object.values(ROUTES).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden', id !== targetId);
  });

  if (targetId === 'pageHome') {
    initHomePage();
  }

  if (targetId === 'pageConfirm') {
    renderConfirmPage();
  }

  if (targetId === 'pageDetail') {
    const invoiceId = params.get('invoiceId') || null;
    console.log('[router] 詳細画面: invoiceId =', invoiceId);
    // TODO: initDetailPage(invoiceId) を呼ぶ
  }

  console.log(`[router] navigated to ${baseHash} -> #${targetId}`);
}

// ハッシュ変化時・初回ロード時にルーティング実行
window.addEventListener('hashchange', navigate);
window.addEventListener('DOMContentLoaded', navigate);
</script>
