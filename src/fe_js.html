/**
 * 確認画面の金額 input から wholesalerTotal / merchantTotals を収集して返す。
 * @returns {{ wholesalerTotal: Object, merchantTotals: Array<Object> }}
 */
function collectSummaryData_() {
  // span（read-only）と input（編集可）の両方から数値を取り出す共通ヘルパー
  const readEl = el => {
    if (!el) return 0;
    const raw = el.tagName === 'INPUT' ? el.value : el.textContent;
    return Number(String(raw).replace(/[^0-9.-]/g, '')) || 0;
  };
  const getVal   = id    => readEl(document.getElementById(id));
  const getField = (card, field) => readEl(card.querySelector(`[data-field="${field}"]`));

  const wholesalerTotal = {
    totalAmount:    getVal('summaryAmountInTax'),
    subtotalAmount: getVal('summaryAmountExTax'),
    taxAmount:      getVal('summaryTax'),
    exTax10:        getVal('summaryExTax10'),
    tax10:          getVal('summaryTax10'),
    exTax8:         getVal('summaryExTax8'),
    tax8:           getVal('summaryTax8'),
    feeAmount:      getVal('summaryFee'),
    paymentAmount:  getVal('summaryTransfer'),
  };

  const merchantTotals = [];
  const confirmList = document.getElementById('confirmStoreList');
  (confirmList ? confirmList.querySelectorAll('.store-accordion') : []).forEach(card => {
    const customerCode = card.dataset.cc || '';
    merchantTotals.push({
      customerCode,
      totalAmount:    getField(card, 'totalAmount'),
      subtotalAmount: getField(card, 'subtotalAmount'),
      taxAmount:      getField(card, 'taxAmount'),
      exTax10:        getField(card, 'exTax10'),
      tax10:          getField(card, 'tax10'),
      exTax8:         getField(card, 'exTax8'),
      tax8:           getField(card, 'tax8'),
    });
  });

  return { wholesalerTotal, merchantTotals };
}

/**
 * 確認画面の備考 textarea から { customerCode: remarks文字列 } を収集して返す。
 * @returns {Object.<string, string>}
 */
function collectRemarks_() {
  const remarks = {};
  document.querySelectorAll('.remarks-input[data-customer-code]').forEach(ta => {
    remarks[ta.dataset.customerCode] = ta.value || '';
  });
  return remarks;
}

/**
 * 確認画面上の handover テキストエリアから値を収集する。
 * @returns {Object.<string, string>}  { customerCode: handoverText }
 */
function collectHandovers_() {
  const handovers = {};
  document.querySelectorAll('.confirm-handover-input[data-customer-code]').forEach(function (ta) {
    handovers[ta.dataset.customerCode] = ta.value || '';
  });
  return handovers;
}

// =============================================================================
// Confirm page: Submit
// =============================================================================

// 確認ページ: 登録内容を送信するボタン
btnFinalSubmit.addEventListener('click', () => {
  // 送信可能なデータが揃っているか念のため確認
  if (!parsedData || !rawCsvBase64 || !utf8CsvBase64) {
    showToast('送信できるデータがありません。アップロードページからやり直してください。', 'error');
    location.hash = '#upload';
    return;
  }

  // ── 送信開始: UI をローディング状態に ─────────────────────────────────────
  setSubmitLoading();
  showLoadingOverlay('登録中...');
  hideToast();

  // ── GAS バックエンドへ送信 ────────────────────────────────────────────────
  // google.script.run は GAS Webアプリ環境でのみ有効。
  // ローカル Live Server で動作確認する場合は下部の「ローカル確認用フォールバック」が使われる。
  const wholesalerName = sessionStorage.getItem('shiire_wholesaler_name') || '';
  const summaryData    = collectSummaryData_();
  const remarks        = collectRemarks_();

  // 備考の文字数バリデーション（250文字以内）
  const overLimitRemarks = Object.entries(remarks).filter(([, v]) => v.length > 250);
  if (overLimitRemarks.length > 0) {
    hideLoadingOverlay();
    resetSubmitButton();
    showToast('加盟店別請求書備考は250文字以内で入力してください。', 'error');
    return;
  }

  // ── 税額 ±1円バリデーション ─────────────────────────────────────────────
  const taxAdjustErrors = [];
  const confirmListForTax = document.getElementById('confirmStoreList');
  (confirmListForTax ? confirmListForTax.querySelectorAll('.store-accordion') : []).forEach(card => {
    const cc = card.dataset.cc || '';
    card.querySelectorAll('[data-field="tax8"], [data-field="tax10"]').forEach(el => {
      const orig = Number(el.dataset.orig || 0);
      const cur  = Math.trunc(Number(el.value) || 0);
      if (Math.abs(cur - orig) > 1) {
        const label = el.dataset.field === 'tax10' ? '税内訳（10%）' : '税内訳（8%）';
        taxAdjustErrors.push('加盟店 ' + cc + ': ' + label + 'の調整は±1円までです（現在: ' + cur + '円 / 計算値: ' + orig + '円）');
      }
    });
  });
  if (taxAdjustErrors.length > 0) {
    hideLoadingOverlay();
    resetSubmitButton();
    showToast(taxAdjustErrors[0], 'error');
    return;
  }

  // ── 金額桁数バリデーション（DDL制約に基づく） ──────────────────────────────
  const validationErrors = [];

  // 加盟店単位の金額チェック
  summaryData.merchantTotals.forEach(m => {
    const cc = m.customerCode;
    // store_invoices: total_amount NUMERIC(12), subtotal_amount NUMERIC(12),
    //                 tax_amount NUMERIC(11), standard_tax_amount NUMERIC(11),
    //                 reduced_tax_amount NUMERIC(11), non_taxable_amount NUMERIC(12)
    if (Math.abs(m.totalAmount) > 999999999999) {
      validationErrors.push(`加盟店 ${cc}: 請求金額合計が上限（12桁）を超えています`);
    }
    if (Math.abs(m.subtotalAmount) > 999999999999) {
      validationErrors.push(`加盟店 ${cc}: 小計（税抜）が上限（12桁）を超えています`);
    }
    if (Math.abs(m.taxAmount) > 99999999999) {
      validationErrors.push(`加盟店 ${cc}: 消費税合計が上限（11桁）を超えています`);
    }
    if (Math.abs(m.tax10) > 99999999999) {
      validationErrors.push(`加盟店 ${cc}: 税内訳（10%）が上限（11桁）を超えています`);
    }
    if (Math.abs(m.tax8) > 99999999999) {
      validationErrors.push(`加盟店 ${cc}: 税内訳（8%）が上限（11桁）を超えています`);
    }
  });

  // 卸全体の金額チェック（wholesaler_invoices: NUMERIC(25)）
  // 25桁は Number.MAX_SAFE_INTEGER を超えるため BigInt で比較
  const MAX_25 = BigInt('9999999999999999999999999');
  const wt = summaryData.wholesalerTotal;
  const abs = v => { const b = BigInt(Math.trunc(v)); return b < 0n ? -b : b; };
  if (abs(wt.totalAmount) > MAX_25) {
    validationErrors.push('請求金額合計（税込）が上限（25桁）を超えています');
  }
  if (abs(wt.feeAmount) > MAX_25) {
    validationErrors.push('手数料金額が上限（25桁）を超えています');
  }
  if (abs(wt.paymentAmount) > MAX_25) {
    validationErrors.push('振込予定金額が上限（25桁）を超えています');
  }

  if (validationErrors.length > 0) {
    hideLoadingOverlay();
    resetSubmitButton();
    showToast(validationErrors[0], 'error');
    return;
  }

  if (_isResubmitConfirm) {
    // ── 再送信モード: bulkResubmitInvoiceData を呼ぶ ──────────────────────
    const parentInvoiceId = _resubmitParentInvoiceId;
    // 確認画面の handover 入力欄から最新値を取得
    const handovers = collectHandovers_();
    // 否認店舗の handover 必須チェック
    const missingCodes = _resubmitDisputedCodes.filter(function (cc) {
      return !handovers[cc] || !handovers[cc].trim();
    });
    if (missingCodes.length > 0) {
      // 未入力の handover textarea にエラー表示
      document.querySelectorAll('.confirm-handover-input[data-customer-code]').forEach(function (ta) {
        const cc = ta.dataset.customerCode;
        const parentDiv = ta.closest('.backoffice-remark__disputed-handover');
        if (missingCodes.indexOf(cc) !== -1) {
          ta.classList.add('confirm-handover-input--error');
          ta.setAttribute('aria-invalid', 'true');
          const errId = 'handover-err-' + cc;
          ta.setAttribute('aria-describedby', errId);
          if (!ta.nextElementSibling || !ta.nextElementSibling.classList.contains('handover-validation-error')) {
            const errSpan = document.createElement('div');
            errSpan.className = 'handover-validation-error';
            errSpan.id = errId;
            errSpan.textContent = '※ 加盟店との合意内容を記入してください';
            ta.insertAdjacentElement('afterend', errSpan);
          }
          // 対象アコーディオンを開く
          const accordion = ta.closest('.store-accordion');
          if (accordion && !accordion.classList.contains('is-open')) {
            accordion.classList.add('is-open');
            const accHeader = accordion.querySelector('.store-accordion__header');
            if (accHeader) accHeader.setAttribute('aria-expanded', 'true');
          }
        } else {
          ta.classList.remove('confirm-handover-input--error');
          ta.removeAttribute('aria-invalid');
          ta.removeAttribute('aria-describedby');
          if (parentDiv) {
            const errEl = parentDiv.querySelector('.handover-validation-error');
            if (errEl) errEl.remove();
          }
        }
      });
      // 最初のエラー箇所までスクロールしフォーカスを当てる
      const firstErr = document.querySelector('.confirm-handover-input--error');
      if (firstErr) {
        firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
        firstErr.focus();
      }
      hideLoadingOverlay();
      resetSubmitButton();
      return;
    }
    // 確認画面の備考で上書き
    const confirmRemarks = collectRemarks_();
    Object.keys(confirmRemarks).forEach(function (k) { remarks[k] = confirmRemarks[k]; });
    // _resubmitRemarks もマージ
    Object.keys(_resubmitRemarks).forEach(function (k) { if (!(k in remarks)) remarks[k] = _resubmitRemarks[k]; });

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (result) {
          hideLoadingOverlay();
          resetSubmitButton();
          if (result && result.status === 'error') {
            showToast('登録に失敗しました: ' + (result.message || '不明なエラー'), 'error');
            return;
          }
          rawCsvBase64 = null; utf8CsvBase64 = null; parsedData = null;
          _isResubmitConfirm = false;
          _detailCurrentInvoiceId = null;
          location.hash = '#detail?invoiceId=' + parentInvoiceId;
          showToast('再請求の登録が完了しました。', 'success');
        })
        .withFailureHandler(function (err) {
          hideLoadingOverlay();
          resetSubmitButton();
          showToast('登録に失敗しました: ' + (err.message || err), 'error');
        })
        .bulkResubmitInvoiceData(rawCsvBase64, utf8CsvBase64, summaryData, remarks, parentInvoiceId, handovers);
    } else {
      console.warn('[bulkResubmit] google.script.run が利用できません（モック）');
      console.log('[resubmit] parentInvoiceId:', parentInvoiceId);
      console.log('[resubmit] summaryData:', summaryData);
      console.log('[resubmit] remarks:', remarks);
      console.log('[resubmit] handovers:', handovers);
      setTimeout(function () {
        hideLoadingOverlay();
        resetSubmitButton();
        rawCsvBase64 = null; utf8CsvBase64 = null; parsedData = null;
        _isResubmitConfirm = false;
        _detailCurrentInvoiceId = null;
        location.hash = '#detail?invoiceId=' + parentInvoiceId;
        showToast('再請求の登録が完了しました。', 'success');
      }, 1500);
    }
  } else if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(onSubmitSuccess)
      .withFailureHandler(onSubmitFailure)
      // rawCsvBase64: Drive 保存用（元ファイルのバイト列そのまま）
      // utf8CsvBase64: BQ Load Job 用（UTF-8 に変換済み）
      .sendInvoiceData(rawCsvBase64, utf8CsvBase64, summaryData, remarks);
  } else {
    // ── ローカル確認用フォールバック（GAS 環境外）────────────────────────
    console.warn('[submit] google.script.run が利用できません。モック送信を実行します。');
    console.log('[submit] wholesalerName:', wholesalerName);
    console.log('[submit] rawCsvBase64 (先頭100文字):', rawCsvBase64.slice(0, 100));
    console.log('[submit] utf8CsvBase64 (先頭100文字):', utf8CsvBase64.slice(0, 100));
    console.log('[submit] summaryData:', summaryData);
    console.log('[submit] remarks:', remarks);
    setTimeout(() => onSubmitSuccess({ status: 'success', data: '(mock)' }), 1500);
  }
});

/**
 * 送信成功ハンドラ
 * @param {{ status: string, data: * }} result - server.js の success_() が返すオブジェクト
 *   エラー時は error_() が返したオブジェクトが SuccessHandler に流れる場合がある
 */
function onSubmitSuccess(result) {
  console.log('[submit] success:', result);
  if (result && result.status === 'error') {
    // GAS 側が _error() を返した場合（SuccessHandler に流れるがエラー扱い）
    hideLoadingOverlay();
    showToast('送信に失敗しました: ' + (result.message || '不明なエラー'), 'error');
    resetSubmitButton();
    return;
  }
  resetPage();
  hideLoadingOverlay();
  location.hash = '#home';

  const toastBody =
    '請求のご登録ありがとうございます。<br>' +
    '本請求は、本サービスの運営チームによる内容確認ののち、加盟店側での内容確認が行われます。<br>' +
    '運営からの差戻、もしくは加盟店からの否認が発生した場合は再度対応をお願いします。';

  showToast('請求情報の登録が完了しました。', 'success', undefined, toastBody);
}

/**
 * 送信失敗ハンドラ
 * @param {Error} error
 */
function onSubmitFailure(error) {
  console.error('[submit] failure:', error);
  hideLoadingOverlay();
  showToast('送信に失敗しました: ' + (error.message || error), 'error');
  resetSubmitButton(); // 再送信できるようにボタンを戻す
}

// 確認ページ: チェックボックスで送信ボタンの活性/非活性を切り替える
document.getElementById('checkConfirm').addEventListener('change', function () {
  btnFinalSubmit.disabled = !this.checked;
});

// =============================================================================
// Confirm page: render
// =============================================================================

/**
 * 確認画面を parsedData を元に描画する。
 * navigate() が '#confirm' に切り替えるたびに呼ばれる。
 */
function renderConfirmPage() {
  // データがなければ元の画面へ戻す
  if (!parsedData || parsedData.length === 0 || !rawCsvBase64 || !utf8CsvBase64) {
    if (parsedData && parsedData.length > 0 && (!rawCsvBase64 || !utf8CsvBase64)) {
      showToast('ページがリロードされたため、CSVを再度アップロードしてください。', 'error');
    }
    if (_isResubmitConfirm) {
      _isResubmitConfirm = false;
      location.hash = '#detail?invoiceId=' + (_resubmitParentInvoiceId || '');
    } else {
      location.hash = '#upload';
    }
    return;
  }

  // 再送信モード: ページタイトルを変更
  const confirmTitle = document.querySelector('#pageConfirm .page-title');
  if (confirmTitle) {
    confirmTitle.textContent = _isResubmitConfirm ? '再請求内容の確認' : '請求内容の確認';
  }

  // チェックボックス・送信ボタンをリセット
  const checkConfirm = document.getElementById('checkConfirm');
  if (checkConfirm) checkConfirm.checked = false;
  btnFinalSubmit.disabled = true;

  // ── 卸情報を SessionStorage から取得 ─────────────────────────────────────
  const wholesalerId     = sessionStorage.getItem('shiire_wholesaler_id')     || '';
  const wholesalerUserId = sessionStorage.getItem('shiire_wholesaler_user_id') || '';
  const wholesalerName   = sessionStorage.getItem('shiire_wholesaler_name')   || '';
  const feeRate          = Number(sessionStorage.getItem('shiire_invoice_fee_rate') || 0);
  const mappings         = getMerchantMappings();

  // customer_code → mall_code / merchant_name の変換マップ
  const mappingMap = {};
  mappings.forEach(m => { mappingMap[String(m.customer_code)] = m; });

  // ── サマリー計算（1パスで全集計）────────────────────────────────────────
  // tax_amount は CSV の値をそのまま使用。未マッピング時は amount_ex_tax × tax_rate で計算
  const totals = parsedData.reduce((acc, r) => {
    const amtExTax  = Number(r['amount_ex_tax'] || 0);
    const taxRate   = Number(r['tax_rate']       || 0);
    const rawTax    = r['tax_amount'];
    const taxAmount = (rawTax !== undefined && rawTax !== '') ? Number(rawTax) : roundTax(amtExTax * taxRate / 100);
    acc.amountExTax += amtExTax;
    acc.tax         += taxAmount;
    if (taxRate === 10)     { acc.exTax10 += amtExTax; acc.tax10 += taxAmount; }
    else if (taxRate === 8) { acc.exTax8  += amtExTax; acc.tax8  += taxAmount; }
    return acc;
  }, { amountExTax: 0, tax: 0, exTax10: 0, tax10: 0, exTax8: 0, tax8: 0 });

  const totalAmountExTax = roundTax(totals.amountExTax);
  const totalTax         = roundTax(totals.tax);
  const totalAmountInTax = totalAmountExTax + totalTax;
  const exTax10 = roundTax(totals.exTax10);
  const tax10   = roundTax(totals.tax10);
  const exTax8  = roundTax(totals.exTax8);
  const tax8    = roundTax(totals.tax8);
  const feeAmount  = roundTax(totalAmountInTax * feeRate / 100);
  const payAmount  = totalAmountInTax - feeAmount;

  const fmt = n => n.toLocaleString('ja-JP');

  // 登録日時（JST 基準の現在日時）
  const jstReg = jstNow_();
  const registeredAt = `${jstReg.year}/${String(jstReg.month).padStart(2,'0')}/${String(jstReg.date).padStart(2,'0')} ${String(jstReg.hours).padStart(2,'0')}:${String(jstReg.minutes).padStart(2,'0')}`;
  const registeredAtEl = document.getElementById('summaryRegisteredAt');
  if (registeredAtEl) registeredAtEl.textContent = registeredAt;

  // 請求月（JST 基準のアップロード月）
  const billingMonth = `${jstReg.year}年${jstReg.month}月`;
  const billingMonthEl = document.getElementById('summaryBillingMonth');
  if (billingMonthEl) billingMonthEl.textContent = billingMonth;

  document.getElementById('summaryAmountInTax').textContent = fmt(totalAmountInTax);
  document.getElementById('summaryAmountExTax').textContent = fmt(totalAmountExTax);
  document.getElementById('summaryTax').textContent         = fmt(totalTax);
  document.getElementById('summaryFeeRate').textContent     = feeRate;
  document.getElementById('summaryFee').textContent         = fmt(feeAmount);
  document.getElementById('summaryTransfer').textContent    = fmt(payAmount);
  document.getElementById('summaryExTax10').textContent     = fmt(exTax10);
  document.getElementById('summaryTax10').textContent       = fmt(tax10);
  document.getElementById('summaryExTax8').textContent      = fmt(exTax8);
  document.getElementById('summaryTax8').textContent        = fmt(tax8);

  // ── 再送信モード: USEN PAY社からのコメントを表示 ─────────────────────────
  const handoverRow  = document.getElementById('confirmHandoverRow');
  const handoverText = document.getElementById('confirmHandoverText');
  if (_isResubmitConfirm) {
    const handoverMatter = sessionStorage.getItem('shiire_resubmit_handover_matter') || '';
    if (handoverRow)  handoverRow.classList.remove('hidden');
    if (handoverText) handoverText.value = handoverMatter;
  } else {
    if (handoverRow)  handoverRow.classList.add('hidden');
  }

  // ── customer_code ごとにグルーピング ─────────────────────────────────────
  /** @type {Map<string, Array>} */
  const groups = new Map();
  parsedData.forEach(row => {
    const cc = String(row['customer_code'] || '');
    if (!groups.has(cc)) groups.set(cc, []);
    groups.get(cc).push(row);
  });


  // ── 加盟店別リストを描画 ──────────────────────────────────────────────────
  const list = document.getElementById('confirmStoreList');
  list.innerHTML = '';

  /**
   * 全カードの tax8/tax10 input を合算してサマリー欄を再計算する。
   * tax8/tax10 input 変更時に呼ぶ。
   */
  const recalcSummary_ = () => {
    let totalExTax = 0, totalTax8 = 0, totalTax10 = 0;
    const confirmList = document.getElementById('confirmStoreList');
    (confirmList ? confirmList.querySelectorAll('.store-accordion') : []).forEach(c => {
      const subSpan = c.querySelector('[data-field="subtotalAmount"]');
      const t8El    = c.querySelector('[data-field="tax8"]');
      const t10El   = c.querySelector('[data-field="tax10"]');
      totalExTax += Number(String(subSpan ? subSpan.textContent : '0').replace(/[^0-9.-]/g, '')) || 0;
      totalTax8  += Math.trunc(Number(t8El  ? t8El.value  : 0) || 0);
      totalTax10 += Math.trunc(Number(t10El ? t10El.value : 0) || 0);
    });
    const totalTax   = totalTax8 + totalTax10;
    const totalInTax = totalExTax + totalTax;
    const fRate      = Number(sessionStorage.getItem('shiire_invoice_fee_rate') || 0);
    const fee        = roundTax(totalInTax * fRate / 100);
    const pay        = totalInTax - fee;
    const fmt = n => n.toLocaleString('ja-JP');
    document.getElementById('summaryAmountInTax').textContent = fmt(totalInTax);
    document.getElementById('summaryAmountExTax').textContent = fmt(totalExTax);
    document.getElementById('summaryTax').textContent         = fmt(totalTax);
    document.getElementById('summaryFee').textContent         = fmt(fee);
    document.getElementById('summaryTransfer').textContent    = fmt(pay);
    document.getElementById('summaryTax8').textContent        = fmt(totalTax8);
    document.getElementById('summaryTax10').textContent       = fmt(totalTax10);
  };

  // 列ヘッダー行
  const colHeader = document.createElement('div');
  colHeader.className = 'store-list-header';
  colHeader.innerHTML =
    `<span class="slh-col slh-col--name">加盟店名</span>` +
    `<span class="slh-col slh-col--mallcode">顧客ID</span>` +
    `<span class="slh-col slh-col--amount">請求金額</span>` +
    `<span class="slh-col slh-col--extax">小計（税抜）</span>` +
    `<span class="slh-col slh-col--tax">消費税</span>` +
    `<span class="slh-col slh-col--tax10">税内訳（10%）</span>` +
    `<span class="slh-col slh-col--tax8">税内訳（8%）</span>` +
    `<span class="slh-col slh-col--toggle"></span>`;
  list.appendChild(colHeader);

  groups.forEach((rows, customerCode) => {
    const mapping  = mappingMap[customerCode] || {};
    // 加盟店表示名の解決ロジック:
    // 1. CSVに merchant_name 列がある（カスタムフォーマット）→ CSVの値を使用
    // 2. CSVに merchant_name 列がない（デフォルトフォーマット）→ merchant_mappings から customer_code で検索（store_name キー）
    // 3. どちらも取得できない場合 → customer_code をそのまま表示
    const merchantNameFromCsv = String(rows[0]['merchant_name'] || '');
    const merchantNameFromMap  = (mappingMap[customerCode] || {}).store_name || '';
    const displayName          = merchantNameFromCsv || merchantNameFromMap || customerCode;

    const st = rows.reduce((acc, r) => {
      const amtExTax  = Number(r['amount_ex_tax'] || 0);
      const taxRate   = Number(r['tax_rate']       || 0);
      const rawTax    = r['tax_amount'];
      const taxAmount = (rawTax !== undefined && rawTax !== '') ? Number(rawTax) : roundTax(amtExTax * taxRate / 100);
      acc.amountExTax += amtExTax;
      acc.tax         += taxAmount;
      if (taxRate === 10)     { acc.exTax10 += amtExTax; acc.tax10 += taxAmount; }
      else if (taxRate === 8) { acc.exTax8  += amtExTax; acc.tax8  += taxAmount; }
      return acc;
    }, { amountExTax: 0, tax: 0, exTax8: 0, tax8: 0, exTax10: 0, tax10: 0 });

    const storeAmountExTax = roundTax(st.amountExTax);
    const storeTax         = roundTax(st.tax);
    const storeTotal       = storeAmountExTax + storeTax;

    const card = document.createElement('div');
    card.className = 'store-accordion';
    card.dataset.cc = customerCode;

    const header = document.createElement('div');
    header.className = 'store-accordion__header';
    header.setAttribute('role', 'button');
    header.setAttribute('tabindex', '0');
    header.setAttribute('aria-expanded', 'false');
    const mallCode = String(mapping.mall_code || customerCode);
    header.innerHTML =
      `<span class="slh-col slh-col--name store-accordion__code">${escapeHtml(displayName)}</span>` +
      `<span class="slh-col slh-col--mallcode">${escapeHtml(customerCode)}</span>` +
      `<span class="slh-col slh-col--amount"><span class="amount-display" data-field="totalAmount">${storeTotal.toLocaleString('ja-JP')}</span>円</span>` +
      `<span class="slh-col slh-col--extax"><span class="amount-display" data-field="subtotalAmount">${storeAmountExTax.toLocaleString('ja-JP')}</span>円</span>` +
      `<span class="slh-col slh-col--tax"><span class="amount-display" data-field="taxAmount">${storeTax.toLocaleString('ja-JP')}</span>円</span>` +
      `<span class="slh-col slh-col--tax10"><input type="number" class="amount-input" data-field="tax10" data-orig="${st.tax10}" value="${st.tax10}" max="99999999999" step="1" inputmode="numeric" aria-label="${escapeHtml(displayName)} 税内訳（10%）（円）" /><span class="unit-label">円</span></span>` +
      `<span class="slh-col slh-col--tax8"><input type="number" class="amount-input" data-field="tax8" data-orig="${st.tax8}" value="${st.tax8}" max="99999999999" step="1" inputmode="numeric" aria-label="${escapeHtml(displayName)} 税内訳（8%）（円）" /><span class="unit-label">円</span></span>` +
      `<span class="slh-col slh-col--toggle"><i class="fa-solid fa-chevron-down store-accordion__icon"></i></span>`;

    const toggleAccordion = () => {
      const isOpen = card.classList.toggle('is-open');
      header.setAttribute('aria-expanded', String(isOpen));
    };
    header.addEventListener('click', toggleAccordion);
    header.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAccordion(); }
    });

    // tax8/tax10 input 変更時: カード内の taxAmount・totalAmount を更新し全体サマリーも再計算
    const tax8Input       = header.querySelector('[data-field="tax8"]');
    const tax10Input      = header.querySelector('[data-field="tax10"]');
    const taxAmountSpan   = header.querySelector('[data-field="taxAmount"]');
    const totalAmountSpan = header.querySelector('[data-field="totalAmount"]');
    const subtotalSpan    = header.querySelector('[data-field="subtotalAmount"]');
    const recalcCard_ = () => {
      const newTax8  = Math.trunc(Number(tax8Input.value)  || 0);
      const newTax10 = Math.trunc(Number(tax10Input.value) || 0);
      tax8Input.value  = newTax8;
      tax10Input.value = newTax10;
      const newTax   = newTax8 + newTax10;
      const subTotal = Number(String(subtotalSpan.textContent).replace(/[^0-9.-]/g, '')) || 0;
      const newTotal = subTotal + newTax;
      taxAmountSpan.textContent   = newTax.toLocaleString('ja-JP');
      totalAmountSpan.textContent = newTotal.toLocaleString('ja-JP');
      recalcSummary_();
    };
    // input クリック時にアコーディオンが開閉しないよう伝播を止める
    const MAX_TAX_VALUE = 99999999999; // NUMERIC(11)
    [tax8Input, tax10Input].forEach(el => {
      el.addEventListener('click',  e => e.stopPropagation());
      el.addEventListener('keydown', e => e.stopPropagation());
      el.addEventListener('input', e => {
        // 桁数上限チェック（11桁）
        const v = Number(el.value);
        if (!isNaN(v) && Math.abs(v) > MAX_TAX_VALUE) {
          el.value = v > 0 ? MAX_TAX_VALUE : -MAX_TAX_VALUE;
        }
        recalcCard_();
        // ±1円バリデーション
        const orig = Number(el.dataset.orig || 0);
        const cur  = Math.trunc(Number(el.value) || 0);
        const diff = Math.abs(cur - orig);
        const parentCol = el.closest('.slh-col');
        const errId = 'tax-err-' + customerCode + '-' + el.dataset.field;
        let errMsg = parentCol ? parentCol.querySelector('.tax-validation-error') : null;
        if (diff > 1) {
          el.classList.add('amount-input--error');
          el.setAttribute('aria-invalid', 'true');
          el.setAttribute('aria-describedby', errId);
          if (!errMsg && parentCol) {
            errMsg = document.createElement('span');
            errMsg.className = 'tax-validation-error';
            errMsg.id = errId;
            parentCol.appendChild(errMsg);
          }
          if (errMsg) errMsg.textContent = '※±1円まで';
        } else {
          el.classList.remove('amount-input--error');
          el.removeAttribute('aria-invalid');
          el.removeAttribute('aria-describedby');
          if (errMsg) errMsg.remove();
        }
      });
    });

    const body = document.createElement('div');
    body.className = 'store-accordion__body';

    // 備考 input（加盟店への備考）
    const remarksDiv = document.createElement('div');
    remarksDiv.className = 'store-accordion__remarks';
    remarksDiv.innerHTML =
      `<label class="remarks-label">・ 加盟店別請求書備考 <span class="detail-meta-help-wrap"><i class="fa-solid fa-circle-question detail-meta-help" style="color:#00A7B8"></i><span class="detail-meta-tooltip">加盟店への請求書備考欄に記載されるテキストです。請求における、加盟店への連絡事項を記載ください。</span></span></label>` +
      `<textarea class="remarks-input" data-customer-code="${escapeHtml(customerCode)}" placeholder="※加盟店請求書に表示される備考情報を記載ください。" rows="2" maxlength="250"></textarea>`;
    body.appendChild(remarksDiv);

    // 再送信モード: 否認店舗の handover 入力欄を追加（詳細画面の否認セクションと同じデザイン）
    if (_isResubmitConfirm && _resubmitDisputedCodes.indexOf(customerCode) !== -1) {
      const handoverDiv = document.createElement('div');
      handoverDiv.className = 'store-accordion__backoffice-remark';
      handoverDiv.innerHTML =
        '<div class="backoffice-remark__disputed-left">' +
          '<div class="backoffice-remark__disputed-handover">' +
            '<span class="backoffice-remark__label">・ 【必須】加盟店<br>　との合意内容</span>' +
            '<textarea class="backoffice-remark__handover-input confirm-handover-input" data-customer-code="' + escapeHtml(customerCode) + '"' +
              ' placeholder="【必須】否認に対する加盟店との合意事項と変更された内容を記載ください。"></textarea>' +
          '</div>' +
        '</div>';
      const handoverTa = handoverDiv.querySelector('textarea');
      if (handoverTa && _resubmitHandovers[customerCode]) {
        handoverTa.value = _resubmitHandovers[customerCode];
      }
      // 入力時にエラー状態をクリア
      if (handoverTa) {
        handoverTa.addEventListener('input', function () {
          handoverTa.classList.remove('confirm-handover-input--error');
          handoverTa.removeAttribute('aria-invalid');
          handoverTa.removeAttribute('aria-describedby');
          const errEl = handoverTa.nextElementSibling;
          if (errEl && errEl.classList.contains('handover-validation-error')) errEl.remove();
        });
      }
      body.appendChild(handoverDiv);
    }

    // 明細アコーディオン（ネスト）
    const detailAccordion = document.createElement('div');
    detailAccordion.className = 'detail-accordion';

    const detailHeader = document.createElement('div');
    detailHeader.className = 'detail-accordion__header';
    detailHeader.setAttribute('role', 'button');
    detailHeader.setAttribute('tabindex', '0');
    detailHeader.innerHTML =
      `<span class="detail-accordion__label">・ 明細</span>` +
      `<i class="fa-solid fa-chevron-down detail-accordion__icon"></i>`;

    const toggleDetail_ = () => { detailAccordion.classList.toggle('is-open'); };
    detailHeader.addEventListener('click', toggleDetail_);
    detailHeader.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDetail_(); }
    });

    const detailBody = document.createElement('div');
    detailBody.className = 'detail-accordion__body';

    const table = document.createElement('table');
    table.className = 'detail-table';
    const thead = table.createTHead();
    thead.innerHTML =
      `<tr>` +
        `<th>取引日</th>` +
        `<th>明細項目</th>` +
        `<th class="num-th">単価</th>` +
        `<th class="num-th">数量</th>` +
        `<th class="num-th">明細金額（税抜）</th>` +
        `<th class="num-th">内 消費税</th>` +
        `<th>備考</th>` +
      `</tr>`;

    const tbody = table.createTBody();
    rows.forEach(row => {
      const amtExTax  = Number(row['amount_ex_tax'] || 0);
      const taxRate   = Number(row['tax_rate']       || 0);
      const rawTax    = row['tax_amount'];
      const taxAmount = (rawTax !== undefined && rawTax !== '') ? Number(rawTax) : roundTax(amtExTax * taxRate / 100);
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td>${escapeHtml(String(row['transaction_date'] || '').replace(/-/g, '/'))}</td>` +
        `<td>${escapeHtml(String(row['item_name'] || ''))}</td>` +
        `<td class="num-td">${Number(row['unit_price'] || 0).toLocaleString('ja-JP')}円</td>` +
        `<td class="num-td">${Number(row['quantity'] || 0).toLocaleString('ja-JP')}</td>` +
        `<td class="num-td">${amtExTax.toLocaleString('ja-JP')}円</td>` +
        `<td class="num-td">${taxAmount.toLocaleString('ja-JP')}円（${taxRate}%）</td>` +
        `<td>${escapeHtml(String(row['invoice_detail_remark'] || '')) || '—'}</td>`;
      tbody.appendChild(tr);
    });

    detailBody.appendChild(table);
    detailAccordion.appendChild(detailHeader);
    detailAccordion.appendChild(detailBody);
    body.appendChild(detailAccordion);

    // 加盟店ごとの内訳 hidden input（collectSummaryData_ で読み取る）
    const hiddenDiv = document.createElement('div');
    hiddenDiv.style.display = 'none';
    hiddenDiv.innerHTML =
      `<input type="number" data-field="exTax10" value="${roundTax(st.exTax10)}" />` +
      `<input type="number" data-field="exTax8"  value="${roundTax(st.exTax8)}"  />`;
    body.appendChild(hiddenDiv);

    card.appendChild(header);
    card.appendChild(body);
    list.appendChild(card);
  });
}

/** 現在表示中の卸インボイスID（同じ ID の再描画をスキップするためのキャッシュ） */
let _detailCurrentInvoiceId = null;
let _detailActionRequiredMallCodes = [];
/** RETURNED かつ invoice_status が null の加盟店 mall_code（警告のみでエラーにしない） */
let _detailReturnedOnlyMallCodes = [];
/** 異議申立期間の終了日（OBJECTION_PERIOD の end_at）。期間終了後は「取下げをやめる」を無効化する */
let _objectionEndAt = null;
/** リロード完了後に表示するトーストメッセージ（取り下げ / 取り消し成功時） */
let _detailPendingToastMsg = null;
/** 再送信モードで確認画面を表示する際のコンテキスト */
let _isResubmitConfirm = false;

/**
 * 詳細画面を初期化する。
 * navigate() から invoiceId を受け取り、GAS API でデータを取得・描画する。
 * 同じ invoiceId が渡された場合は再描画をスキップする。
 * @param {string|null} invoiceId
 */
function initDetailPage(invoiceId) {
  if (!invoiceId) {
    renderDetailError_('請求IDが指定されていません。一覧に戻ってやり直してください。');
    return;
  }
  if (_detailCurrentInvoiceId === invoiceId) return; // 同一ページの再描画スキップ

  _detailCurrentInvoiceId = invoiceId;
  resetDetailPage_();

  showLoadingOverlay('請求詳細を取得中...');

  // ペンディングトースト: 取り下げ / 取り消し成功後のリロード時に使用
  const pendingToastMsg = _detailPendingToastMsg || null;
  _detailPendingToastMsg = null;

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        hideLoadingOverlay();
        if (!result || !result.data) {
          renderDetailError_('データが見つかりませんでした。');
          return;
        }
        renderDetailPage_(result.data);
        if (pendingToastMsg) showToast(pendingToastMsg, 'success');
      })
      .withFailureHandler(function (err) {
        hideLoadingOverlay();
        console.error('[detail] fetchInvoiceDetail failed:', err);
        renderDetailError_('データの取得中にエラーが発生しました: ' + String(err.message || err));
      })
      .fetchInvoiceDetail(invoiceId);
  } else {
    hideLoadingOverlay();
    renderDetailError_('GAS 環境外での実行は非対応です。');
  }
}

/**
 * 詳細画面をリセットする（別の invoiceId に遷移する前に呼ぶ）。
 */
function resetDetailPage_() {
  const summaryCard = document.getElementById('detailSummaryCard');
  if (summaryCard) {
    summaryCard.innerHTML =
      '<div class="detail-loading-placeholder"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>';
  }
  ['detailActionRequiredSection', 'detailNormalSection', 'detailWithdrawnSection', 'detailReturnedSubsection', 'detailDisputedSubsection'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });
  ['detailReturnedList', 'detailDisputedList', 'detailNormalList', 'detailWithdrawnList'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
}

/**
 * エラーメッセージをサマリーカードに表示する。
 * @param {string} message
 */
function renderDetailError_(message) {
  const card = document.getElementById('detailSummaryCard');
  if (card) {
    card.innerHTML =
      '<p class="detail-error-msg"><i class="fa-solid fa-circle-exclamation"></i> ' +
      escapeHtml(message) + '</p>';
  }
}

/**
 * 取得データを詳細画面に描画する。
 * @param {{ summary: Object, stores: Array<Object> }} data
 */
function renderDetailPage_(data) {
  _objectionEndAt = (data.summary && data.summary.objection_end_at) || null;
  renderDetailSummary_(data.summary);
  renderDetailStoreList_(data.stores || []);
  checkReuploadDeadline_();
}

/**
 * 異議申立期間（OBJECTION_PERIOD）の end_at を確認し、
 * 期限切れなら「修正ファイルをアップ」「変更なしで再請求」「請求取り下げ」「CSV一括アップロード」ボタンを無効化する。
 */
function checkReuploadDeadline_() {
  if (!_objectionEndAt) return;
  const today = jstNow_().ymd;
  const endAt = String(_objectionEndAt).slice(0, 10);
  if (today <= endAt) return;

  // 期限切れ: 再アップロード系ボタンを無効化
  const expiredMsg = '異議申立期間（' + endAt + ' まで）を過ぎているため、操作できません。';

  // 個別ボタン（修正ファイルをアップ / 変更なしで再請求 / 請求取り下げ）
  document.querySelectorAll('[data-action="reupload"], [data-action="resubmit"], [data-action="withdraw"]').forEach(function(btn) {
    btn.disabled = true;
    btn.title    = expiredMsg;
    btn.style.opacity = '0.5';
  });
  // 各 .backoffice-remark__actions に期限切れメッセージを追加（重複防止）
  document.querySelectorAll('.backoffice-remark__actions').forEach(function(actionsEl) {
    if (actionsEl.querySelector('.detail-action-btn__period-expired-msg')) return;
    const msgEl = document.createElement('p');
    msgEl.className = 'detail-action-btn__period-expired-msg';
    msgEl.textContent = '異議申立期間が終了しています';
    actionsEl.appendChild(msgEl);
  });

  // 一括再送信ボタン（CSV一括アップロード）
  const bulkBtn = document.getElementById('detailBtnUploadCsv');
  if (bulkBtn) {
    bulkBtn.disabled = true;
    bulkBtn.title    = expiredMsg;
    bulkBtn.style.opacity = '0.5';
    // ボタンの親要素に期限切れメッセージを追加
    const parentActions = bulkBtn.parentElement;
    if (parentActions && !parentActions.querySelector('.detail-action-btn__period-expired-msg')) {
      const msgEl = document.createElement('p');
      msgEl.className = 'detail-action-btn__period-expired-msg';
      msgEl.textContent = '異議申立期間が終了しています';
      parentActions.appendChild(msgEl);
    }
  }
}

/**
 * backoffice_review_status に対応するステータスバッジ HTML を返す。
 * @param {string} status
 * @returns {string}
 */
function getDetailStatusBadge_(backofficeStatus, invoiceStatus) {
  // 取り下げ済: WITHDRAWN
  if (invoiceStatus === 'WITHDRAWN') {
    return '<span class="detail-status-badge badge--withdrawn"><i class="fa-solid fa-check"></i> 取下げ済</span>';
  }
  // 否認差戻: MERCHANT_CONFIRMATION_REQUESTED + DISPUTED
  if (backofficeStatus === 'MERCHANT_CONFIRMATION_REQUESTED' && invoiceStatus === 'DISPUTED') {
    return '<span class="detail-status-badge badge--disputed"><i class="fa-solid fa-minus-circle"></i> 否認差戻</span>';
  }
  // 否認差戻: RETURNED + DISPUTED
  if (backofficeStatus === 'RETURNED' && invoiceStatus === 'DISPUTED') {
    return '<span class="detail-status-badge badge--disputed"><i class="fa-solid fa-minus-circle"></i> 否認差戻</span>';
  }
  // 差戻し: RETURNED（DISPUTED でない）
  if (backofficeStatus === 'RETURNED') {
    return '<span class="detail-status-badge badge--returned"><i class="fa-solid fa-rotate-left"></i> 差戻し</span>';
  }
  // 承認: MERCHANT_CONFIRMATION_REQUESTED + APPROVED
  if (backofficeStatus === 'MERCHANT_CONFIRMATION_REQUESTED' && invoiceStatus === 'APPROVED') {
    return '<span class="detail-status-badge badge--approved"><i class="fa-solid fa-circle-check"></i> 承認</span>';
  }
  // 確認中: MERCHANT_CONFIRMATION_REQUESTED + PENDING_CONFIRMATION
  if (backofficeStatus === 'MERCHANT_CONFIRMATION_REQUESTED' && invoiceStatus === 'PENDING_CONFIRMATION') {
    return '<span class="detail-status-badge badge--requested">確認中</span>';
  }
  // 未検収: PENDING_REVIEW
  return '<span class="detail-status-badge badge--pending">未検収</span>';
}

/**
 * 加盟店リストを RETURNED / その他で分けてそれぞれのセクションに描画する。
 * @param {Array<Object>} stores
 */
function renderDetailStoreList_(stores) {
  // 差し戻し: RETURNED かつ DISPUTED でなく WITHDRAWN でもない
  const returned  = stores.filter(function (s) {
    return s.backoffice_review_status === 'RETURNED' && s.invoice_status !== 'DISPUTED' && s.invoice_status !== 'WITHDRAWN';
  });
  // 否認: (MCR/RETURNED/PENDING_REVIEW + DISPUTED) ※WITHDRAWN は除外
  const disputed  = stores.filter(function (s) {
    return (s.backoffice_review_status === 'MERCHANT_CONFIRMATION_REQUESTED' && s.invoice_status === 'DISPUTED') ||
           (s.backoffice_review_status === 'RETURNED' && s.invoice_status === 'DISPUTED') ||
           (s.backoffice_review_status === 'PENDING_REVIEW' && s.invoice_status === 'DISPUTED');
  });
  // 取下げ済: WITHDRAWN
  const withdrawn = stores.filter(function (s) {
    return s.invoice_status === 'WITHDRAWN';
  });
  // 正常: 上記以外すべて
  const normal    = stores.filter(function (s) {
    return s.invoice_status !== 'WITHDRAWN' &&
      !(s.backoffice_review_status === 'RETURNED') &&
      !(s.backoffice_review_status === 'MERCHANT_CONFIRMATION_REQUESTED' && s.invoice_status === 'DISPUTED') &&
      !(s.backoffice_review_status === 'PENDING_REVIEW' && s.invoice_status === 'DISPUTED');
  });

  // 要対応の mall_code 一覧をグローバル変数に保持（バリデーション用）
  // ※ WITHDRAWN は分離済みのため disputed にはもう含まれない
  _detailActionRequiredMallCodes = returned.concat(disputed).map(function (s) { return s.mall_code; });
  // RETURNED かつ invoice_status が null の加盟店（CSVに含まれていなくても警告のみ）
  _detailReturnedOnlyMallCodes = returned.filter(function (s) {
    return !s.invoice_status || s.invoice_status === null || s.invoice_status === 'null';
  }).map(function (s) { return s.mall_code; });

  const colHeader =
    '<div class="store-list-header">' +
      '<span class="slh-col slh-col--name">加盟店名</span>' +
      '<span class="slh-col slh-col--mallcode">顧客ID</span>' +
      '<span class="slh-col slh-col--amount">請求金額</span>' +
      '<span class="slh-col slh-col--extax">小計（税抜）</span>' +
      '<span class="slh-col slh-col--tax">消費税</span>' +
      '<span class="slh-col slh-col--tax10">税内訳（10%）</span>' +
      '<span class="slh-col slh-col--tax8">税内訳（8%）</span>' +
      '<span class="slh-col slh-col--status">ステータス</span>' +
      '<span class="slh-col slh-col--toggle"></span>' +
    '</div>';

  // 要対応セクション（差し戻し or 否認があれば表示）
  if (returned.length > 0 || disputed.length > 0) {
    const section = document.getElementById('detailActionRequiredSection');
    if (section) section.classList.remove('hidden');

    if (returned.length > 0) {
      const sub  = document.getElementById('detailReturnedSubsection');
      const list = document.getElementById('detailReturnedList');
      if (sub)  sub.classList.remove('hidden');
      if (list) {
        list.innerHTML = colHeader;
        returned.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
      }
    }

    if (disputed.length > 0) {
      const sub  = document.getElementById('detailDisputedSubsection');
      const list = document.getElementById('detailDisputedList');
      if (sub)  sub.classList.remove('hidden');
      if (list) {
        list.innerHTML = colHeader;
        disputed.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
      }
    }
  }

  // 確認中・承認済みセクション
  if (normal.length > 0) {
    const section = document.getElementById('detailNormalSection');
    const list    = document.getElementById('detailNormalList');
    if (section) section.classList.remove('hidden');
    if (list) {
      list.innerHTML = colHeader;
      normal.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
    }
  }

  // 取下げ済みセクション
  if (withdrawn.length > 0) {
    const section = document.getElementById('detailWithdrawnSection');
    const list    = document.getElementById('detailWithdrawnList');
    if (section) section.classList.remove('hidden');
    if (list) {
      list.innerHTML = colHeader;
      withdrawn.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
    }
  }
}

/**
 * 加盟店アコーディオン要素を生成する。
 * @param {Object}  store
 * @param {boolean} openByDefault - RETURNED の場合 true（初期状態で展開）
 * @returns {HTMLElement}
 */
function buildDetailAccordion_(store, openByDefault) {
  const fmt        = function (n) { return Number(n || 0).toLocaleString('ja-JP'); };
  const isWithdrawn = store.invoice_status === 'WITHDRAWN';
  const isReturned = store.backoffice_review_status === 'RETURNED' && store.invoice_status !== 'DISPUTED' && store.invoice_status !== 'WITHDRAWN';
  const isDisputed = !isWithdrawn &&
                     ((store.backoffice_review_status === 'MERCHANT_CONFIRMATION_REQUESTED' && store.invoice_status === 'DISPUTED') ||
                     (store.backoffice_review_status === 'PENDING_REVIEW' && store.invoice_status === 'DISPUTED') ||
                     (store.backoffice_review_status === 'RETURNED' && store.invoice_status === 'DISPUTED'));

  // mall_code → customer_code 変換（BE が remarks[customerCode] で参照するため）
  const mappings = getMerchantMappings();
  const customerCode = (mappings.find(function (m) { return String(m.mall_code) === String(store.mall_code); }) || {}).customer_code || '';

  const accordion = document.createElement('div');
  accordion.className = 'store-accordion' +
    (openByDefault          ? ' is-open'                  : '') +
    (isReturned || isDisputed ? ' store-accordion--returned' : '');
  accordion.dataset.storeInvoiceId = store.store_invoice_id;
  accordion.dataset.mallCode = store.mall_code || '';

  // ── ヘッダー行 ───────────────────────────────────────────────────────────
  const header = document.createElement('div');
  header.className = 'store-accordion__header';
  header.innerHTML =
    '<span class="slh-col slh-col--name store-accordion__code">' + escapeHtml(store.store_name || store.mall_code) + '</span>' +
    '<span class="slh-col slh-col--mallcode">' + escapeHtml(customerCode || store.mall_code) + '</span>' +
    '<span class="slh-col slh-col--amount">'   + fmt(store.total_amount)             + '円</span>' +
    '<span class="slh-col slh-col--extax">'    + fmt(store.subtotal_amount)          + '円</span>' +
    '<span class="slh-col slh-col--tax">'      + fmt(store.tax_amount)               + '円</span>' +
    '<span class="slh-col slh-col--tax10">'    + fmt(store.standard_tax_amount)      + '円</span>' +
    '<span class="slh-col slh-col--tax8">'     + fmt(store.reduced_tax_amount)       + '円</span>' +
    '<span class="slh-col slh-col--status">'   + getDetailStatusBadge_(store.backoffice_review_status, store.invoice_status) + '</span>' +
    '<span class="slh-col slh-col--toggle"><i class="fa-solid fa-chevron-down store-accordion__icon"></i></span>';

  // ── ボディ ────────────────────────────────────────────────────────────────
  const body = document.createElement('div');
  body.className = 'store-accordion__body';

  // 差し戻し理由バナー
  if (isReturned && store.backoffice_handover) {
    const reason = document.createElement('div');
    reason.className = 'dsl-returned-reason';
    reason.innerHTML =
      '<i class="fa-solid fa-comment-dots"></i>' +
      '<span class="dsl-returned-reason__label">差し戻しコメント：</span>' +
      '<span class="dsl-returned-reason__text">' + escapeHtml(store.backoffice_handover) + '</span>';
    body.appendChild(reason);
  }

  // 否認理由 + 加盟店との合意内容（否認のみ表示）
  if (isDisputed) {
    const disputedRow = document.createElement('div');
    disputedRow.className = 'store-accordion__backoffice-remark';
    disputedRow.innerHTML =
      '<div class="backoffice-remark__disputed-left">' +
        '<div class="backoffice-remark__disputed-reason">' +
          '<span class="backoffice-remark__label">・ 否認理由</span>' +
          '<span class="backoffice-remark__reason-text">' + escapeHtml(store.store_disputed_reason || '') + '</span>' +
        '</div>' +
        '<div class="backoffice-remark__disputed-handover">' +
          '<span class="backoffice-remark__label">・ 【必須】加盟店<br>との合意内容</span>' +
          '<textarea class="backoffice-remark__handover-input" data-store-invoice-id="' + escapeHtml(store.store_invoice_id) + '" data-customer-code="' + escapeHtml(customerCode) + '" placeholder="【必須】否認に対する加盟店との合意事項と変更された内容を記載ください。">' + escapeHtml(store.wholesaler_handover || '') + '</textarea>' +
        '</div>' +
      '</div>' +
      '<div class="backoffice-remark__actions">' +
      (store.backoffice_review_status === 'PENDING_REVIEW' && store.invoice_status === 'DISPUTED'
        ? '<span class="detail-action-badge detail-action-badge--resubmitted"><i class="fa-solid fa-check"></i> 再請求済み</span>'
        : '<button type="button" class="btn btn-outline btn-sm detail-action-btn detail-action-btn--withdraw" data-action="withdraw" data-id="' + escapeHtml(store.store_invoice_id) + '"><i class="fa-regular fa-trash-can detail-action-btn__icon--danger"></i> 請求取り下げ</button>' +
          '<button type="button" class="btn btn-outline btn-sm detail-action-btn" data-action="reupload" data-id="' + escapeHtml(store.store_invoice_id) + '"><i class="fa-solid fa-upload detail-action-btn__icon--primary"></i> 修正ファイルをアップ</button>' +
          '<button type="button" class="btn btn-outline btn-sm detail-action-btn" data-action="resubmit" data-id="' + escapeHtml(store.store_invoice_id) + '"><i class="fa-solid fa-rotate detail-action-btn__icon--primary"></i> 変更なしで再請求</button>'
      ) +
      '</div>';
    body.appendChild(disputedRow);
  }

  // 取下げ済み: 合意内容（読取専用）+ 取下げをやめるボタン
  if (isWithdrawn) {
    // OBJECTION_PERIOD チェック: end_at < today なら disabled（JST基準で判定）
    const todayYmd = jstNow_().ymd;
    const endAtYmd = String(_objectionEndAt).slice(0, 10);
    const periodExpired = _objectionEndAt && todayYmd > endAtYmd;

    const withdrawnRow = document.createElement('div');
    withdrawnRow.className = 'store-accordion__backoffice-remark';
    withdrawnRow.innerHTML =
      '<div class="backoffice-remark__disputed-left">' +
        '<div class="backoffice-remark__disputed-handover">' +
          '<span class="backoffice-remark__label">・ 【必須】加盟店<br>との合意内容</span>' +
          '<div class="backoffice-remark__handover-readonly">' + escapeHtml(store.wholesaler_handover || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="backoffice-remark__actions">' +
        (periodExpired
          ? '<button type="button" class="btn btn-outline detail-action-btn detail-action-btn--undo-withdraw" disabled>' +
              '<i class="fa-solid fa-rotate detail-action-btn__icon--primary"></i> 取下げをやめる' +
            '</button>' +
            '<p class="detail-action-btn__period-expired-msg">異議申立期間が終了しています</p>'
          : '<button type="button" class="btn btn-outline detail-action-btn detail-action-btn--undo-withdraw" data-action="undo-withdraw" data-id="' + escapeHtml(store.store_invoice_id) + '">' +
              '<i class="fa-solid fa-rotate detail-action-btn__icon--primary"></i> 取下げをやめる' +
            '</button>'
        ) +
      '</div>';
    body.appendChild(withdrawnRow);
  }

  // 備考エリア（常時表示）
  const remarksDiv = document.createElement('div');
  remarksDiv.className = 'store-accordion__remarks';
  if (isReturned || isDisputed) {
    // 要対応: 編集可能
    remarksDiv.innerHTML =
      '<label class="remarks-label">・ 加盟店請求書備考 <span class="detail-meta-help-wrap"><i class="fa-solid fa-circle-question detail-meta-help" style="color:#00A7B8"></i><span class="detail-meta-tooltip">加盟店への請求書備考欄に記載されるテキストです。請求における、加盟店への連絡事項を記載ください。</span></span></label>' +
      '<input type="text" class="remarks-input" data-store-invoice-id="' + escapeHtml(store.store_invoice_id) + '" data-customer-code="' + escapeHtml(customerCode) + '" placeholder="※加盟店請求書に表示される備考情報を記載ください。" value="' + escapeHtml(store.wholesaler_remark || '') + '" />';
  } else {
    // 確認中・承認済み・取下げ済み: 読み取り専用
    remarksDiv.innerHTML =
      '<label class="remarks-label">・ 加盟店請求書備考 <span class="detail-meta-help-wrap"><i class="fa-solid fa-circle-question detail-meta-help" style="color:#00A7B8"></i><span class="detail-meta-tooltip">加盟店への請求書備考欄に記載されるテキストです。請求における、加盟店への連絡事項を記載ください。</span></span></label>' +
      '<input type="text" class="remarks-input remarks-input--readonly" readonly placeholder="備考なし" value="' + escapeHtml(store.wholesaler_remark || '') + '" />';
  }
  body.appendChild(remarksDiv);

  // ── 明細アコーディオン（ネスト）────────────────────────────────────────
  const linesAccordion = document.createElement('div');
  linesAccordion.className = 'detail-accordion' + (openByDefault ? ' is-open' : '');

  const linesHeader = document.createElement('div');
  linesHeader.className = 'detail-accordion__header';
  linesHeader.innerHTML =
    '<span class="detail-accordion__label">・ 明細</span>' +
    '<i class="fa-solid fa-chevron-down detail-accordion__icon"></i>';

  const linesBody = document.createElement('div');
  linesBody.className = 'detail-accordion__body';

  // 明細コンテナ（オンデマンドで内容を入れる / 閉じたら空にしてメモリ解放）
  const linesContainer = document.createElement('div');
  linesBody.appendChild(linesContainer);

  linesAccordion.appendChild(linesHeader);
  linesAccordion.appendChild(linesBody);
  body.appendChild(linesAccordion);

  accordion.appendChild(header);
  accordion.appendChild(body);

  // ── 開閉ロジック（外側アコーディオン）──────────────────────────────────
  header.addEventListener('click', function () {
    const isNowOpen = accordion.classList.contains('is-open');
    if (isNowOpen) {
      accordion.classList.remove('is-open');
      linesContainer.innerHTML = ''; // DOM を空にしてブラウザのメモリを解放
      linesAccordion.classList.remove('is-open');
    } else {
      accordion.classList.add('is-open');
    }
  });

  // ── 開閉ロジック（内側: 明細アコーディオン）────────────────────────────
  linesHeader.addEventListener('click', function () {
    const isOpen = linesAccordion.classList.toggle('is-open');
    if (!isOpen) {
      linesContainer.innerHTML = ''; // DOM を空にしてブラウザのメモリを解放
    } else {
      loadDetailInvoiceLines_(store.store_invoice_id, linesContainer);
    }
  });

  // RETURNED は最初から開いて明細を取得
  if (openByDefault) {
    loadDetailInvoiceLines_(store.store_invoice_id, linesContainer);
  }

  return accordion;
}

/**
 * 指定の加盟店の明細をオンデマンドで取得してコンテナに描画する。
 * @param {string}      storeInvoiceId
 * @param {HTMLElement} container
 */
function loadDetailInvoiceLines_(storeInvoiceId, container) {
  container.innerHTML =
    '<div class="dsl-lines-loading"><i class="fa-solid fa-spinner fa-spin"></i> 明細を取得中...</div>';

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        renderDetailLines_((result && result.data) ? result.data : [], container);
      })
      .withFailureHandler(function (err) {
        console.error('[detail] getInvoiceLinesByStore failed:', err);
        container.innerHTML =
          '<div class="dsl-lines-error"><i class="fa-solid fa-circle-exclamation"></i> 明細の取得に失敗しました。</div>';
      })
      .getInvoiceLinesByStore(storeInvoiceId);
  } else {
    container.innerHTML = '<div class="dsl-lines-error">GAS 環境外での実行は非対応です。</div>';
  }
}

/**
 * 明細テーブルを描画する。
 * @param {Array<Object>} lines
 * @param {HTMLElement}   container
 */
function renderDetailLines_(lines, container) {
  if (!lines || lines.length === 0) {
    container.innerHTML = '<p class="dsl-lines-empty">明細データがありません。</p>';
    return;
  }

  const fmt = function (n) { return Number(n || 0).toLocaleString('ja-JP'); };

  const rows = lines.map(function (line) {
    const date = line.transaction_date ? String(line.transaction_date).replace(/-/g, '/') : '―';
    const taxRate = Number(line.tax_category || 0);
    return '<tr>' +
      '<td>' + escapeHtml(date) + '</td>' +
      '<td>' + escapeHtml(line.item_name || '') + '</td>' +
      '<td class="num-td">' + fmt(line.unit_price) + '円</td>' +
      '<td class="num-td">' + fmt(line.quantity) + (line.quantity_unit ? ' ' + escapeHtml(line.quantity_unit) : '') + '</td>' +
      '<td class="num-td">' + fmt(line.line_amount_excluding_tax) + '円</td>' +
      '<td class="num-td">' + fmt(line.line_tax_amount) + '円（' + taxRate + '%）</td>' +
      '<td>' + (line.line_note ? escapeHtml(line.line_note) : '—') + '</td>' +
    '</tr>';
  }).join('');

  container.innerHTML =
      '<table class="detail-table">' +
        '<thead><tr>' +
          '<th>取引日</th><th>明細項目</th><th class="num-th">単価</th><th class="num-th">数量</th>' +
          '<th class="num-th">明細金額（税抜）</th><th class="num-th">内 消費税</th><th>備考</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
}

// =============================================================================
// Router: ハッシュベースの簡易 SPA ルーター
// =============================================================================

/**
 * 登録済みページのマップ。
 * key   : URL ハッシュ（'#upload' など）
 * value : そのページのルート要素の id
 */
const ROUTES = {
  '#home':    'pageHome',
  '#upload':  'pageUpload',
  '#confirm': 'pageConfirm',
  '#detail':  'pageDetail',
  '#error':   'pageError',
};

/** デフォルトルート */
const DEFAULT_ROUTE = '#home';

/**
 * location.hash から { baseHash, params } を取り出す。
 * 例: '#detail?invoiceId=b001' → { baseHash: '#detail', params: URLSearchParams }
 * @returns {{ baseHash: string, params: URLSearchParams }}
 */
function parseHash() {
  const raw = location.hash || DEFAULT_ROUTE;
  const sepIdx = raw.indexOf('?');
  if (sepIdx === -1) {
    return { baseHash: raw, params: new URLSearchParams() };
  }
  return {
    baseHash: raw.slice(0, sepIdx),
    params:   new URLSearchParams(raw.slice(sepIdx + 1)),
  };
}

/**
 * 現在のハッシュに対応するページだけ表示し、他を非表示にする。
 */
function navigate() {
  const { baseHash, params } = parseHash();
  const targetId = ROUTES[baseHash] || ROUTES[DEFAULT_ROUTE];

  Object.values(ROUTES).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden', id !== targetId);
  });

  // ヘッダーの請求スケジュールボタン: TOP と詳細画面のみ表示
  const btnCal = document.getElementById('btnCalendarOpen');
  if (btnCal) {
    btnCal.classList.toggle('hidden', targetId !== 'pageHome' && targetId !== 'pageDetail');
  }

  if (targetId === 'pageHome') {
    initHomePage();
  }

  if (targetId === 'pageUpload') {
    // 前回のエラー表示・ファイル情報・データをリセットして初期状態にする
    // （エラー後に一覧へ戻り再度アップロード画面を開いた際、古いエラーが残らないようにする）
    resetDropZone();
    fileInfoEl.classList.add('hidden');
    alertList.innerHTML = '';
    errorCard.classList.add('hidden');
    btnToConfirm.disabled = true;
    rawCsvBase64  = null;
    utf8CsvBase64 = null;
    parsedData    = null;
    sessionStorage.removeItem('shiire_parsedData');
    checkUploadDeadline_();
  }

  if (targetId === 'pageConfirm') {
    renderConfirmPage();
  }

  if (targetId === 'pageDetail') {
    const invoiceId = params.get('invoiceId') || null;
    initDetailPage(invoiceId);
  }

  if (targetId !== 'pageDetail') {
    // 詳細画面以外に遷移したら次回の再描画を許可するためキャッシュをクリア
    _detailCurrentInvoiceId = null;
    _detailActionRequiredMallCodes = [];
    _detailReturnedOnlyMallCodes = [];
    _objectionEndAt = null;
  }

  if (targetId !== 'pageConfirm') {
    // 確認画面以外に遷移したら再送信フラグをリセット
    _isResubmitConfirm = false;
  }

  console.log(`[router] navigated to ${baseHash} -> #${targetId}`);
}

// ハッシュ変化時にルーティング実行（初回ロードは getAccountInfo 完了後に呼ぶ）
window.addEventListener('hashchange', navigate);

// =============================================================================
// Detail page: 修正ファイルアップロード モーダル
// =============================================================================
(function () {
  let _targetStoreInvoiceId = null;
  let _targetActionsEl      = null;
  let _isBulk               = false;
  let _selectedFile         = null;
  let _analyzeTimer         = null;
  let _currentReader        = null;

  const modal         = document.getElementById('detailUploadModal');
  const overlay       = modal && modal.querySelector('.detail-upload-modal__overlay');
  const dropZoneEl    = document.getElementById('detailUploadDropZone');
  const fileInput     = document.getElementById('detailUploadFileInput');
  const btnSelect     = document.getElementById('detailUploadBtnSelect');
  const analyzingEl   = document.getElementById('detailUploadAnalyzing');
  const analyzingName = document.getElementById('detailUploadAnalyzingName');
  const errorCard     = document.getElementById('detailUploadErrorCard');
  const alertList     = document.getElementById('detailUploadAlertList');
  const selectedArea  = document.getElementById('detailUploadSelectedArea');
  const fileNameEl    = document.getElementById('detailUploadFileName');
  const btnRemove     = document.getElementById('detailUploadRemove');
  const btnClose      = document.getElementById('detailUploadModalClose');
  const btnConfirm    = document.getElementById('detailUploadModalConfirm');

  function openModal(storeInvoiceId, actionsEl, isBulk) {
    _targetStoreInvoiceId = storeInvoiceId;
    _targetActionsEl      = actionsEl;
    _isBulk               = !!isBulk;
    resetModalState_();
    // 個別リアップロード時は「確認画面へ進む」フッターを非表示
    if (!_isBulk && modalFooter) modalFooter.classList.add('hidden');
    modal.classList.remove('hidden');
  }

  function closeModal() {
    modal.classList.add('hidden');
  }

  const previewEl      = document.getElementById('detailUploadPreview');
  const previewTarget   = document.getElementById('previewTargetStore');
  const previewFileInfo = document.getElementById('previewFileInfo');
  const previewBody     = document.getElementById('previewBody');
  const previewOath     = document.getElementById('previewOathCheck');
  const previewSubmit   = document.getElementById('previewSubmitBtn');
  const modalFooter     = document.getElementById('detailUploadModalFooter');
  const modalDesc       = modal && modal.querySelector('.detail-upload-modal__desc');

  function resetModalState_() {
    _selectedFile = null;
    if (_analyzeTimer)  { clearTimeout(_analyzeTimer); _analyzeTimer = null; }
    if (_currentReader) { _currentReader.abort(); _currentReader = null; }
    dropZoneEl.classList.remove('hidden');
    analyzingEl.classList.add('hidden');
    errorCard.classList.add('hidden');
    selectedArea.classList.add('hidden');
    alertList.innerHTML = '';
    fileNameEl.textContent = '';
    fileInput.value = '';
    btnConfirm.disabled = true;
    // Phase 2 プレビューをリセット
    if (previewEl) previewEl.classList.add('hidden');
    if (previewTarget) previewTarget.innerHTML = '';
    if (previewFileInfo) previewFileInfo.innerHTML = '';
    if (previewBody) previewBody.innerHTML = '';
    if (previewOath) previewOath.checked = false;
    if (previewSubmit) previewSubmit.disabled = true;
    // フッター（確認画面へ進むボタン）とdescの表示を復元（一括モード時のみ）
    if (_isBulk) {
      if (modalFooter) modalFooter.classList.remove('hidden');
      if (modalDesc) modalDesc.classList.remove('hidden');
    }
  }

  function showAnalyzing_(fileName) {
    dropZoneEl.classList.add('hidden');
    analyzingEl.classList.remove('hidden');
    errorCard.classList.add('hidden');
    selectedArea.classList.add('hidden');
    if (analyzingName) analyzingName.textContent = fileName;
    btnConfirm.disabled = true;
  }

  function showErrors_(errors) {
    dropZoneEl.classList.remove('hidden');
    analyzingEl.classList.add('hidden');
    errorCard.classList.remove('hidden');
    selectedArea.classList.add('hidden');
    alertList.innerHTML = '';
    errors.forEach(function (msg) {
      const li = document.createElement('li');
      li.className = 'alert-item alert-item--error';
      li.innerHTML = '<i class="fa-solid fa-circle alert-icon"></i>' + escapeHtml(msg);
      alertList.appendChild(li);
    });
    btnConfirm.disabled = true;
  }

  function showSuccess_(file) {
    _selectedFile = file;
    analyzingEl.classList.add('hidden');
    errorCard.classList.add('hidden');

    // 個別リアップロード → モーダル内プレビュー表示
    if (!_isBulk) {
      renderModalPreview_(file);
      return;
    }

    // 一括 → 従来通り
    dropZoneEl.classList.remove('hidden');
    selectedArea.classList.remove('hidden');
    fileNameEl.textContent = file.name;
    btnConfirm.disabled = false;
  }

  function showSuccessWithWarnings_(file, warnings) {
    _selectedFile = file;
    analyzingEl.classList.add('hidden');

    // 個別リアップロード → モーダル内プレビュー表示（警告はプレビュー上部に表示）
    if (!_isBulk) {
      renderModalPreview_(file);
      // 警告をプレビュー上部に表示
      alertList.innerHTML = '';
      warnings.forEach(function (msg) {
        const li = document.createElement('li');
        li.className = 'alert-item alert-item--warn';
        li.innerHTML = '<i class="fa-solid fa-triangle-exclamation alert-icon"></i>' + escapeHtml(msg);
        alertList.appendChild(li);
      });
      errorCard.classList.remove('hidden');
      return;
    }

    // 一括 → 従来通り
    dropZoneEl.classList.remove('hidden');
    selectedArea.classList.remove('hidden');
    fileNameEl.textContent = file.name;
    btnConfirm.disabled = false;
    // 警告を表示（ボタンは有効のまま）
    alertList.innerHTML = '';
    warnings.forEach(function (msg) {
      const li = document.createElement('li');
      li.className = 'alert-item alert-item--warn';
      li.innerHTML = '<i class="fa-solid fa-triangle-exclamation alert-icon"></i>' + escapeHtml(msg);
      alertList.appendChild(li);
    });
    errorCard.classList.remove('hidden');
  }

  function handleFile_(file) {
    if (!file.name.toLowerCase().endsWith('.csv')) {
      alert('CSVファイルを選択してください');
      return;
    }
    if (_analyzeTimer)  { clearTimeout(_analyzeTimer); _analyzeTimer = null; }
    if (_currentReader) { _currentReader.abort(); _currentReader = null; }

    showAnalyzing_(file.name);
    const analyzeStartMs = Date.now();
    const MIN_ANALYZE_MS = 600;

    const reader = new FileReader();
    _currentReader = reader;

    reader.onload = function (e) {
      if (reader !== _currentReader) return;
      _currentReader = null;

      const buffer = e.target.result;
      let text;
      try {
        text = stripQuotedNewlines(decodeBuffer_(buffer));
      } catch (err) {
        analyzingEl.classList.add('hidden');
        dropZoneEl.classList.remove('hidden');
        alert('ファイルの読み込みに失敗しました');
        return;
      }

      let errors, rows;
      try {
        const result = validateCsv(text);
        errors = result.errors;
        rows   = result.rows;
      } catch (err) {
        analyzingEl.classList.add('hidden');
        dropZoneEl.classList.remove('hidden');
        alert(err.message || 'CSVの検証中にエラーが発生しました');
        return;
      }

      // --- 追加バリデーション: 加盟店の網羅性チェック ---
      const bulkWarnings = [];
      if (errors.length === 0 && rows && rows.length > 0) {
        const csvCustomerCodes = {};
        rows.forEach(function (row) { csvCustomerCodes[String(row.customer_code || '')] = true; });

        let acctInfo = null;
        try {
          const mappingsJson = sessionStorage.getItem('shiire_merchant_mappings');
          acctInfo = { merchant_mappings: mappingsJson ? JSON.parse(mappingsJson) : [] };
        } catch (_e) { acctInfo = { merchant_mappings: [] }; }
        const mappings = (acctInfo && acctInfo.merchant_mappings) || [];
        // mall_code → customer_code の逆引きマップ
        const mallToCustomer = {};
        mappings.forEach(function (m) {
          if (m.mall_code && m.customer_code) mallToCustomer[String(m.mall_code)] = String(m.customer_code);
        });
        if (_isBulk) {
          // 一括アップロード: 要対応全加盟店の網羅性チェック
          const returnedOnlySet = new Set((_detailReturnedOnlyMallCodes || []).map(String));
          const actionRequiredCcSet = new Set();
          (_detailActionRequiredMallCodes || []).forEach(function (mallCode) {
            const cc = mallToCustomer[String(mallCode)];
            if (cc) {
              actionRequiredCcSet.add(cc);
              if (!csvCustomerCodes[cc]) {
                let storeName = '';
                mappings.forEach(function (m) { if (String(m.mall_code) === String(mallCode)) storeName = m.store_name || ''; });
                if (returnedOnlySet.has(String(mallCode))) {
                  // RETURNED かつ invoice_status=null → 警告のみ
                  bulkWarnings.push('要対応の加盟店（顧客コード: ' + cc + (storeName ? ' / ' + storeName : '') + '）のデータがCSVに含まれていません。この加盟店の再請求は行われませんが、よろしいですか？');
                } else {
                  // 否認など → エラー
                  errors.push('要対応の加盟店（顧客コード: ' + cc + (storeName ? ' / ' + storeName : '') + '）のデータがCSVに含まれていません');
                }
              }
            }
          });
          // 一括アップロード: 要対応でない加盟店のデータをサイレントに除外
          // （余分な加盟店を挿入すると is_latest=TRUE の行が重複するため、FEでフィルタ + BEでも防御）
          rows = rows.filter(function (row) {
            return actionRequiredCcSet.has(String(row.customer_code || ''));
          });
          if (rows.length === 0) {
            errors.push('要対応の加盟店データがCSVに含まれていません');
          }
        } else if (_targetStoreInvoiceId) {
          // 個別修正: 対象加盟店のデータが含まれているかチェック
          const targetMallCode = _targetActionsEl && _targetActionsEl.closest('.store-accordion') ?
            _targetActionsEl.closest('.store-accordion').dataset.mallCode : null;
          if (targetMallCode) {
            const targetCc = mallToCustomer[String(targetMallCode)];
            if (targetCc && !csvCustomerCodes[targetCc]) {
              errors.push('修正対象の加盟店（顧客コード: ' + targetCc + '）のデータがCSVに含まれていません');
            }
          }
        }
      }

      // 検証成功時: グローバル変数にデータを保存（送信ハンドラが参照するため）
      if (errors.length === 0 && rows && rows.length > 0) {
        rawCsvBase64  = arrayBufferToBase64_(buffer);
        utf8CsvBase64 = stringToBase64Utf8_(text);
        parsedData    = rows;
        try { sessionStorage.setItem('shiire_parsedData', JSON.stringify(rows)); }
        catch (_e) { console.warn('[detailModal] parsedData の sessionStorage 保存に失敗:', _e); }
      }

      const elapsed   = Date.now() - analyzeStartMs;
      const remaining = Math.max(0, MIN_ANALYZE_MS - elapsed);
      _analyzeTimer = setTimeout(function () {
        _analyzeTimer = null;
        analyzingEl.classList.add('hidden');
        if (errors.length > 0) {
          showErrors_(errors);
        } else if (bulkWarnings && bulkWarnings.length > 0) {
          showSuccessWithWarnings_(file, bulkWarnings);
        } else {
          showSuccess_(file);
        }
      }, remaining);
    };

    reader.onerror = function () {
      if (reader !== _currentReader) return;
      _currentReader = null;
      analyzingEl.classList.add('hidden');
      dropZoneEl.classList.remove('hidden');
      alert('ファイルの読み込みに失敗しました');
    };

    reader.readAsArrayBuffer(file);
  }

  // CSV一括アップロードボタン
  const btnBulkUpload = document.getElementById('detailBtnUploadCsv');
  if (btnBulkUpload) {
    btnBulkUpload.addEventListener('click', function () {
      openModal(null, null, true);
    });
  }

  // ファイル選択ボタン
  if (btnSelect) btnSelect.addEventListener('click', function () { fileInput.click(); });

  // ファイル input change
  if (fileInput) {
    fileInput.addEventListener('change', function () {
      if (fileInput.files[0]) handleFile_(fileInput.files[0]);
      fileInput.value = '';
    });
  }

  // ドラッグ&ドロップ
  if (dropZoneEl) {
    dropZoneEl.addEventListener('dragover', function (e) {
      e.preventDefault();
      dropZoneEl.classList.add('drag-over');
    });
    dropZoneEl.addEventListener('dragleave', function () {
      dropZoneEl.classList.remove('drag-over');
    });
    dropZoneEl.addEventListener('drop', function (e) {
      e.preventDefault();
      dropZoneEl.classList.remove('drag-over');

      if (file) handleFile_(file);

  // 取り消しボタン
  if (btnRemove) btnRemove.addEventListener('click', function () { resetModalState_(); });

  // 「このファイルを使用する」→ ボタンエリアをファイル名+登録ボタンに切り替え
  if (btnConfirm) {
    btnConfirm.addEventListener('click', function () {
      if (!_selectedFile) return;
      const storeInvoiceId = _targetStoreInvoiceId;
      const file = _selectedFile;

      // 一括アップロードの場合: 確認画面へ遷移
      if (_isBulk) {
        if (!rawCsvBase64 || !utf8CsvBase64 || !parsedData) {
          alert('CSVのバリデーション結果が見つかりません。再度ファイルを選択してください。');

        if (!parentInvoiceId) {
          alert('請求IDが取得できませんでした。ページを再読み込みしてください。');
          return;

        // 備考を収集
        const remarks_ = {};
        document.querySelectorAll('.remarks-input[data-customer-code]').forEach(function (el) {
          const cc = el.dataset.customerCode || '';
          if (cc && el.value) remarks_[cc] = el.value;

          const cc = el.dataset.customerCode || '';
