<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仕入れコネクト Portal Site - ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ── Reset / Base ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
      font-size: 14px;
      background: #F8F8F9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────── */
    .site-header {
      background: #1a2b4a;
      color: #fff;
      display: flex;
      height: 80px;
      padding: 12px 32px;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .header-produced {
      font-size: 18px;
      font-weight: 700;
      color: #B9BEC3;
    }

    /* ── Login Card ────────────────────────────────────── */
    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      width: 582px;
      min-height: 271px;
      padding: 48px 40px;
      text-align: center;
    }
    .login-card__title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 16px;
    }
    .login-card__divider {
      width: 60%;
      margin: 0 auto 20px;
      border: none;
      border-top: 1px solid #E0E0E0;
    }
    .login-card__description {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    /* ── Google Login Button ───────────────────────────── */
    .btn-google-login {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 0 28px;
      border: 1px solid #DADCE0;
      border-radius: 26px;
      background: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: #3C4043;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn-google-login:hover {
      background: #F7F8F8;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .btn-google-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-google-login__icon {
      width: 20px;
      height: 20px;
    }

    /* ── Error Banner ──────────────────────────────────── */
    .login-error {
      display: none;
      background: #FFF0F0;
      border: 1px solid #E57373;
      border-radius: 6px;
      padding: 16px 20px;
      margin-top: 24px;
      text-align: left;
    }
    .login-error.is-visible {
      display: block;
    }
    .login-error__title {
      font-size: 14px;
      font-weight: 700;
      color: #D32F2F;
      margin-bottom: 6px;
    }
    .login-error__message {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
      white-space: pre-line;
    }

    /* ── Loading Spinner ───────────────────────────────── */
    .login-loading {
      display: none;
      margin-top: 24px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    .login-loading.is-visible {
      display: block;
    }
    .login-loading__spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #E0E0E0;
      border-top-color: #1a2b4a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Header (extended for menu page) ──────────────── */
    .site-header--menu {
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .header-right svg {
      flex-shrink: 0;
    }

    /* ── Menu Page (差し込み画面) ───────────────────────── */
    .page-hidden { display: none !important; }

    .menu-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
    }
    .menu-cards {
      display: flex;
      gap: 32px;
      max-width: 960px;
      width: 100%;
    }
    .menu-card {
      flex: 1;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 48px 36px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .menu-card__title {
      font-size: 32px;
      font-weight: 700;
      color: #3C3C3C;
      font-style: normal;
      line-height: 140%;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #E0E0E0;
      width: 100%;
    }
    .menu-card__description {
      font-size: 16px;
      font-style: normal;
      font-weight: 400;
      color: #666;
      line-height: 140%;
      width: 324px;
      height: 66px;
      margin-bottom: 32px;
      flex: none;
    }
    .btn-menu {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 0 28px;
      border: none;
      border-radius: 26px;
      background: #1a2b4a;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(26,43,74,0.28);
      text-decoration: none;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn-menu:hover {
      background: #263d6b;
      box-shadow: 0 6px 20px rgba(26,43,74,0.36);
    }
    .btn-menu__plus {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
    }

    /* ── Footer ────────────────────────────────────────── */
    .site-footer {
      text-align: center;
      padding: 14px;
      font-size: 12px;
      color: #999;
      background: #F8F8F9;
    }
  </style>
</head>
<body>

  <!-- ヘッダー（ログイン画面用） -->
  <header class="site-header" id="headerLogin">
    <span class="header-logo">仕入れコネクト Portal Site</span>
    <span class="header-produced">produced by USEN PAY</span>
  </header>

  <!-- ヘッダー（メニュー画面用：企業名表示あり） -->
  <header class="site-header site-header--menu page-hidden" id="headerMenu">
    <div class="header-left">
      <span class="header-logo">仕入れコネクト Portal Site</span>
      <span class="header-produced">produced by USEN PAY</span>
    </div>
    <div class="header-right">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14.0004 8.16667V5.83333C14.0004 4.55 12.9504 3.5 11.6671 3.5H4.66707C3.38374 3.5 2.33374 4.55 2.33374 5.83333V22.1667C2.33374 23.45 3.38374 24.5 4.66707 24.5H23.3337C24.6171 24.5 25.6671 23.45 25.6671 22.1667V10.5C25.6671 9.21667 24.6171 8.16667 23.3337 8.16667H14.0004ZM7.00041 22.1667H4.66707V19.8333H7.00041V22.1667ZM7.00041 17.5H4.66707V15.1667H7.00041V17.5ZM7.00041 12.8333H4.66707V10.5H7.00041V12.8333ZM7.00041 8.16667H4.66707V5.83333H7.00041V8.16667ZM11.6671 22.1667H9.33374V19.8333H11.6671V22.1667ZM11.6671 17.5H9.33374V15.1667H11.6671V17.5ZM11.6671 12.8333H9.33374V10.5H11.6671V12.8333ZM11.6671 8.16667H9.33374V5.83333H11.6671V8.16667ZM22.1671 22.1667H14.0004V19.8333H16.3337V17.5H14.0004V15.1667H16.3337V12.8333H14.0004V10.5H22.1671C22.8087 10.5 23.3337 11.025 23.3337 11.6667V21C23.3337 21.6417 22.8087 22.1667 22.1671 22.1667ZM21.0004 12.8333H18.6671V15.1667H21.0004V12.8333ZM21.0004 17.5H18.6671V19.8333H21.0004V17.5Z" fill="white"/>
      </svg>
      <span id="menuWholesalerName">―</span>

  </header>

  <!-- ===== ページ1: ログインカード ===== -->
  <div class="login-wrapper" id="pageLoginSection">
    <div class="login-card">
      <h1 class="login-card__title">Googleログイン認証</h1>
      <hr class="login-card__divider" />
      <p class="login-card__description">
        安全にアクセスするために、Googleアカウントでの認証が必要です。
      </p>

      <button class="btn-google-login" id="btnGoogleLogin" type="button">
        <!-- Google "G" アイコン (SVG) -->
        <svg class="btn-google-login__icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Googleでログイン
      </button>

      <!-- ローディング -->
      <div class="login-loading" id="loginLoading">
        <span class="login-loading__spinner"></span>認証中...
      </div>

      <!-- エラー表示 -->
      <div class="login-error" id="loginError">
        <p class="login-error__title" id="loginErrorTitle">ログインエラー</p>
        <p class="login-error__message" id="loginErrorMessage"></p>
      </div>
    </div>
  </div>

  <!-- ===== ページ2: メニュー選択（差し込み画面） ===== -->
  <div class="menu-wrapper page-hidden" id="pageMenuSection">
    <div class="menu-cards">
      <!-- 請求履歴の確認 -->
      <div class="menu-card">
        <h2 class="menu-card__title">請求履歴の確認</h2>
        <p class="menu-card__description">
          登録済みの請求内容の確認／差戻しや否認された請求の修正・再申請対応を行います。
        </p>
        <button type="button" class="btn-menu" id="btnGoHome">登録済みの請求を確認する</button>
      </div>
      <!-- 請求の新規登録 -->
      <div class="menu-card">
        <h2 class="menu-card__title">請求の新規登録</h2>
        <p class="menu-card__description">
          新しい請求を登録します。
        </p>
        <button type="button" class="btn-menu" id="btnGoUpload">新規請求を登録する <span class="btn-menu__plus">＋</span></button>
      </div>
    </div>
  </div>

  <!-- フッター -->
  <footer class="site-footer">
    <p>Copyright &copy; USEN PAY CORPORATION All Rights Reserved.</p>
  </footer>

  <script>
  // =============================================================================
  // 設定値（環境自動判定）
  // =============================================================================
  /** GCP Console で発行した OAuth 2.0 クライアント ID */
  const GOOGLE_CLIENT_ID = '922908723040-iiolmgkq3g812at66h44fjb1u1h8hgns.apps.googleusercontent.com';

  /** ログインセッションの有効期限（ミリ秒）: 24時間 */
  const LOGIN_SESSION_TTL_MS = 24 * 60 * 60 * 1000;

  /**
   * 環境別 GAS デプロイ URL 設定
   * GAS_API_URL: 認証 API（別 GAS プロジェクト、ANYONE_ANONYMOUS）
   * GAS_APP_URL: メインアプリ（卸システム、DOMAIN）
   * アクセス元のホスト名で自動的に切り替わる。
   * デプロイ後、各環境の GAS URL を設定してください。
   */
  const ENV_CONFIG = {
    // ローカル開発（localhost）
    local: {
      GAS_API_URL: 'https://script.google.com/macros/s/AKfycbx77SQuxQ94OZl--XEoFwAsAfruDDatyRT3hNJ5ndYRaT_vTX9fI71S3AjZFvuASpwm7A/exec',
      GAS_APP_URL: 'https://script.google.com/macros/s/AKfycbzmQJXjVO8Jj6DBI0LecYaHWq6auTI0Gci4oqSJQGypW7Dxaou70NzaGeHyBvzpKzP0Fw/exec',
    },
    // 開発環境
    dev: {
      GAS_API_URL: 'https://script.google.com/macros/s/AKfycbxyvZ7K7H__EgyO4gJ2Y3IclddbeiKBMe5QwCcktICO53fEsEqokvu2l14Hcc5RwL-4/exec',
      GAS_APP_URL: 'https://script.google.com/macros/s/AKfycbxHB_tcEaUG2yTSbDm6GehQXex1oNbJH-fINaeN8ek9viUMbSTMTl5YYbwP8S1dti_mog/exec',
    },
    // 本番環境（デプロイID が決まったら設定してください）
    prod: {
      GAS_API_URL: 'https://script.google.com/macros/s/YOUR_AUTH_PROD_DEPLOY_ID/exec',
      GAS_APP_URL: 'https://script.google.com/macros/s/YOUR_PROD_DEPLOY_ID/exec',
    },
  };

  /** ホスト名から環境を判定 */
  function detectEnv() {
    const host = window.location.hostname;
    if (host === 'localhost' || host === '127.0.0.1') return 'local';
    // TODO: 開発環境のドメインに書き換えてください
    if (host.indexOf('dev.') === 0 || host.indexOf('stg.') === 0) return 'dev';
    return 'prod';
  }

  const currentEnv   = detectEnv();
  const GAS_API_URL   = ENV_CONFIG[currentEnv].GAS_API_URL;
  const GAS_APP_URL   = ENV_CONFIG[currentEnv].GAS_APP_URL;
  console.log('[login] 環境:', currentEnv, '| API:', GAS_API_URL);

  // 未設定チェック: プレースホルダのままなら初期化を中断
  const _configError = (GAS_API_URL.indexOf('YOUR_') !== -1 || GAS_APP_URL.indexOf('YOUR_') !== -1);

  // =============================================================================
  // DOM 要素
  // =============================================================================
  const btnLogin     = document.getElementById('btnGoogleLogin');
  const elLoading    = document.getElementById('loginLoading');
  const elError      = document.getElementById('loginError');
  const elErrorTitle = document.getElementById('loginErrorTitle');
  const elErrorMsg   = document.getElementById('loginErrorMessage');

  // =============================================================================
  // Google Identity Services 初期化
  // =============================================================================
  window.onload = function () {
    // GAS URL が未設定の場合はエラーを表示して停止
    if (_configError) {
      showError('設定エラー', 'この環境（' + currentEnv + '）のGASデプロイURLが未設定です。\n管理者に連絡してください。');
      btnLogin.disabled = true;
      return;
    }

    // localStorage にログイン済みデータがあれば有効期限を検証してメニュー画面を表示
    const saved = localStorage.getItem('shiire_login_data');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (!parsed.loginAt || (Date.now() - parsed.loginAt) > LOGIN_SESSION_TTL_MS) {
          // 有効期限切れ or 旧形式 → 再ログインを要求
          localStorage.removeItem('shiire_login_data');
          console.log('[login] セッション期限切れのため再ログインが必要です');
        } else {
          showMenuPage(parsed);
          return;
        }
      } catch (e) {
        localStorage.removeItem('shiire_login_data');
      }
    }

    if (typeof google === 'undefined' || !google.accounts) {
      showError('環境エラー', 'Google認証ライブラリの読み込みに失敗しました。ページを再読み込みしてください。');
      return;
    }

    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
    });
  };

  // =============================================================================
  // ログインボタン クリック → Google One Tap プロンプト起動
  // =============================================================================
  btnLogin.addEventListener('click', function () {
    if (typeof google === 'undefined' || !google.accounts) {
      showError('読み込み中', 'Google認証ライブラリがまだ読み込まれていません。\n数秒待ってから再度お試しください。');
      return;
    }
    hideError();
    google.accounts.id.prompt(function (notification) {
      // One Tap が表示されなかった場合のフォールバック
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        const reason = notification.getNotDisplayedReason() || notification.getSkippedReason();
        console.log('[login] One Tap が表示されませんでした。理由:', reason);
        showError('認証に失敗しました',
          'Google認証画面を表示できませんでした。\nブラウザの設定やネットワーク環境を確認し、再度お試しください。\n（詳細: ' + reason + '）');
      }
    });
  });

  // =============================================================================
  // Google 認証成功コールバック
  // =============================================================================
  function handleCredentialResponse(response) {
    const idToken = response.credential;
    if (!idToken) {
      showError('認証エラー', 'Googleからのトークン取得に失敗しました。再度お試しください。');
      return;
    }

    // UI: ローディング表示
    btnLogin.disabled = true;
    elLoading.classList.add('is-visible');
    hideError();

    // GAS doPost API にトークンを送信
    // ── CORS 対応メモ ──
    // Content-Type: text/plain → Simple Request（プリフライトなし）。
    // GAS は POST に 302 リダイレクトを返し、リダイレクト先
    // (script.googleusercontent.com) が Access-Control-Allow-Origin: * を付与するため、
    // 外部オリジン（AWS 等）からでも res.text() でレスポンスを読み取れる。
    fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },  // Simple Request 条件を満たす
      body: JSON.stringify({ token: idToken }),
      redirect: 'follow',
    })
    .then(function (res) {
      // GAS の doPost は常にリダイレクト(302)を返すため、
      // fetch は自動的にリダイレクト先をフォローする。
      // レスポンスのテキストを取得してJSONパースする。
      return res.text();
    })
    .then(function (text) {
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error('サーバーからの応答を解析できませんでした。');
      }

      if (data.status === 'success') {
        // ログイン成功 → 表示に必要な最小限の情報のみ localStorage に保存
        const loginData = {
          wholesaler_id:   data.userData.wholesaler_id   || '',
          wholesaler_name: data.userData.wholesaler_name || '',
          loginAt: Date.now(),
        };
        localStorage.setItem('shiire_login_data', JSON.stringify(loginData));
        showMenuPage(loginData);
      } else if (data.status === 'fail') {
        showError('アカウント未登録',
          data.message || 'このGoogleアカウントはサービスに登録されていません。\n登録済みのアカウントで再度ログインしてください。');
      } else {
        showError('認証エラー', data.message || '認証処理中にエラーが発生しました。');
      }
    })
    .catch(function (err) {
      console.error('[login] API通信エラー:', err);
      showError('通信エラー',
        'サーバーとの通信に失敗しました。\nネットワーク接続を確認し、再度お試しください。');
    })
    .finally(function () {
      btnLogin.disabled = false;
      elLoading.classList.remove('is-visible');
    });
  }

  // =============================================================================
  // エラー表示ヘルパー
  // =============================================================================
  function showError(title, message) {
    elErrorTitle.textContent = title;
    elErrorMsg.textContent   = message;
    elError.classList.add('is-visible');
  }

  function hideError() {
    elError.classList.remove('is-visible');
  }

  // =============================================================================
  // 差し込み画面（メニュー選択ページ）表示
  // =============================================================================
  function showMenuPage(userData) {
    // ログイン画面を非表示、メニュー画面を表示
    document.getElementById('pageLoginSection').classList.add('page-hidden');
    document.getElementById('headerLogin').classList.add('page-hidden');
    document.getElementById('pageMenuSection').classList.remove('page-hidden');
    document.getElementById('headerMenu').classList.remove('page-hidden');

    // ヘッダーに企業名を表示
    const nameEl = document.getElementById('menuWholesalerName');
    if (nameEl && userData && userData.wholesaler_name) {
      nameEl.textContent = userData.wholesaler_name;
    }
  }

  // メニューボタン: 請求履歴確認 → GAS #home
  document.getElementById('btnGoHome').addEventListener('click', function () {
    window.location.replace(GAS_APP_URL + '?t=' + Date.now() + '#home');
  });

  // メニューボタン: 新規請求登録 → GAS #upload
  document.getElementById('btnGoUpload').addEventListener('click', function () {
    window.location.replace(GAS_APP_URL + '?t=' + Date.now() + '#upload');
  });
  </script>
</body>
</html>
