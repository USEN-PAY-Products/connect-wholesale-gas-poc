<style>
/* =====================================================
   Utility
   ===================================================== */
.hidden { display: none !important; }

/* =====================================================
   Reset / Base
   ===================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
  font-size: 14px;
  background: #F8F8F9;
  color: #333;
  display: flex;
  flex-direction: column;
}

a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { cursor: pointer; font-family: inherit; }

/* =====================================================
   Layout wrapper
   ===================================================== */
.main-content {
  flex: 1;
  width: 1080px;
  margin: 0 auto;
  padding: 24px 16px 0;
  position: relative;
}

/* =====================================================
   Header
   ===================================================== */
.site-header {
  background: #1a2b4a;
  color: #fff;
  display: flex;
  height: 80px;
  min-width: 1280px;
  padding: 12px 32px;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  align-self: stretch;
  gap: 16px;
}

.header-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.header-logo {
  font-size: 32px;
  font-style: normal;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.header-produced {
  font-size: 18px;
  font-style: normal;
  font-weight: 700;
  color: #B9BEC3;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.btn-template-dl {
  display: flex;
  height: 32px;
  padding: 0 16px;
  justify-content: center;
  align-items: center;
  gap: 4px;
  border: none;
  border-radius: 24px;
  background: #00A7B8;
  box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.10);
  color: #fff;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}
.btn-template-dl:hover { background: #0096a5; }

.header-store {
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.4;
  border-left: 1px solid rgba(255,255,255,0.3);
  padding-left: 16px;
}

.header-store img {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
}

.header-store span {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  flex: 1 0 0;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  overflow: hidden;
}

/* =====================================================
   Toast
   ===================================================== */
.toast {
  position: fixed;
  top: 96px;
  right: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 36px 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
  z-index: 100;
}

.toast--error {
  background: #fff0f0;
  border: 1px solid #e53935;
  color: #c62828;
}

.toast--success {
  background: #f1f8f1;
  border: 1px solid #2e7d32;
  color: #1b5e20;
}

.toast-close {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 16px;
  color: inherit;
  line-height: 1;
  padding: 2px 4px;
}
.toast-close:hover { opacity: 0.7; }

.toast.hidden { display: none; }

/* =====================================================
   Page header
   ===================================================== */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  margin-right: -92px;
  margin-left: -92px;
}

.page-title {
  font-size: 28px;
  font-style: normal;
  font-weight: 400;
}

/* =====================================================
   Buttons (shared)
   ===================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  padding: 8px 18px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  line-height: 1;
  transition: background 0.15s, opacity 0.15s;
}

/* ボタン内アイコンを文字と同じ基準線に揃える */
.btn i {
  font-size: 1em;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  position: relative;
  top: -0.05em;
}

/* 一覧に戻る・確認画面へ進むのアイコンを24x24に固定 */
.btn-back i,
.btn-submit i {
  font-size: 24px;
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.btn-back {
  background: #1a2b4a;
  color: #fff;
  display: flex;
  height: 48px;
  padding: 16px 40px;
  justify-content: center;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  border-radius: 24px;
  line-height: 1;
}
.btn-back:hover { background: #263d6b; }

.btn-primary {
  background: #3a7bd5;
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: #2f6abf; }
.btn-primary:disabled {
  background: #b0bec5;
  color: #eceff1;
  cursor: not-allowed;
}

.btn-outline {
  background: #fff;
  color: #333;
  border: 1.5px solid #bbb;
}
.btn-outline:hover { background: #f5f5f5; }

/* =====================================================
   Cards
   ===================================================== */
.card {
  background: #fff;
  border-radius: 10px;
  padding: 24px 28px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  margin-bottom: 16px;
}

/*
 * メイン白カード:
 * upload / error / buttons を1枚の白背景に縦積みする。
 * 高さは中身に応じて自動で伸びる。
 */
.main-card {
  display: flex;
  flex-direction: column;
  padding: 28px;
  gap: 24px;       /* 各子要素の間隔 */
  overflow: hidden; /* float (link-template) を内包 */
}

/* =====================================================
   Upload section
   ===================================================== */
.upload-card .card-label,
.card-label {
  font-size: 18px;
  font-style: normal;
  font-weight: 700;
  margin-bottom: 16px;
}

/* 確認画面の見出し */
#pageConfirm .card-label {
  font-size: 16px;
  font-style: normal;
  font-weight: 700;
  padding: 0;
  margin-bottom: 12px;
}

/* Drop zone */
.drop-zone {
  border: 2px dashed #9C9C9C;
  border-radius: 8px;
  background: #EFEFEF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  gap: 10px;
  transition: border-color 0.2s, background 0.2s;
  cursor: pointer;
}

.drop-zone.drag-over {
  border-color: #3a7bd5;
  background: #e8f0fe;
}

/* 成功状態 */
.drop-zone.is-success {
  border-color: #2e7d32;
  border-style: solid;
  background: #f1f8f1;
}

.drop-zone__icon--success {
  font-size: 40px;
  color: #2e7d32;
}

.drop-zone__text--success {
  text-align: center;
  color: #2e7d32;
  font-size: 14px;
  line-height: 1.6;
}

.drop-zone__icon {
  font-size: 40px;
  color: #90a4ae;
}

.drop-zone__text {
  text-align: center;
  color: #78909c;
  font-size: 14px;
  line-height: 1.6;
}

.btn-select-file {
  display: flex;
  height: 36px;
  padding: 8px 32px;
  justify-content: center;
  align-items: center;
  gap: 4px;
  border-radius: 40px;
  border: 1px solid #D9D9D9;
  background: #FFF;
  box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.06);
  color: #333;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  cursor: pointer;
}
.btn-select-file:hover { background: #f5f5f5; }

/* Template download link */
.link-template {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  color: #00A7B8;
  float: right;
}
.link-template:hover { text-decoration: underline; }

/* =====================================================
   Error card
   ===================================================== */
.error-card__title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
}

.error-card__desc {
  font-size: 13px;
  color: #555;
  margin-bottom: 14px;
  line-height: 1.6;
}

.alert-list { display: flex; flex-direction: column; gap: 8px; }

.alert-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  line-height: 1.5;
}

.alert-icon { flex-shrink: 0; margin-top: 2px; font-size: 10px; }

.alert-item--error { color: #c62828; }
.alert-item--error .alert-icon { color: #e53935; }

.alert-item--warn { color: #e65100; }
.alert-item--warn .alert-icon { color: #fb8c00; }

/* =====================================================
   Action buttons row
   ===================================================== */
.action-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.btn-submit {
  width: 230px;
  height: 48px;
  justify-content: center;
  font-size: 18px;
  font-weight: 400;
  border-radius: 24px;
  background: #1a2b4a;
  color: #fff;
}
.btn-submit:hover:not(:disabled) { background: #263d6b; }
.btn-submit:disabled {
  background: #C7C7C7;
  color: #fff;
  cursor: not-allowed;
}

.btn-cancel {
  width: 230px;
  height: 48px;
  justify-content: center;
  font-size: 18px;
  font-weight: 400;
  border-radius: 24px;
}

/* =====================================================
   Confirm page: summary table
   ===================================================== */
.summary-card {
  margin-bottom: 16px;
}

.summary-table {
  display: flex;
  border: 1px solid #D9D9D9;
  border-radius: 6px;
  overflow: hidden;
}

/* --- 各ブロック共通 --- */
.summary-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  padding: 16px 20px;
}

.summary-block--left  { flex: 0 0 260px; border-right: 1px solid #D9D9D9; }
.summary-block--mid   { flex: 1; border-right: 1px solid #D9D9D9; }
.summary-block--right { flex: 0 0 220px; background: #F9F9F9; }

/* --- 行 --- */
.summary-block__row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 4px 0;
}

.summary-block__row--main {
  padding-bottom: 8px;
}

.summary-block__row--head {
  padding-bottom: 6px;
}

/* 左ブロックの区切り線 */
.summary-block__divider {
  border-top: 1px solid #E0E0E0;
  margin: 6px 0;
}

/* --- テキスト --- */
.summary-block__label {
  font-size: 13px;
  color: #555;
  white-space: nowrap;
  flex-shrink: 0;
}

.summary-block__col-label {
  font-size: 12px;
  color: #888;
  white-space: nowrap;
  flex: 1;
  text-align: right;
}

.summary-block__tax-rate {
  font-size: 13px;
  color: #555;
  flex-shrink: 0;
  width: 32px;
}

.summary-block__value {
  font-size: 14px;
  font-weight: 600;
  color: #1a2b4a;
  white-space: nowrap;
  margin-left: auto;
  text-align: right;
}

.summary-block__value--main {
  font-size: 22px;
  font-weight: 700;
}

.summary-block__value--transfer {
  font-size: 22px;
  font-weight: 700;
}

/* =====================================================
   Confirm page: store accordion
   ===================================================== */

/* 列幅定義（ヘッダー行・各アコーディオン行で共有） */
.slh-col           { font-size: 13px; padding: 0 12px; flex-shrink: 0; }
.slh-col--name     { flex: 1 1 160px; min-width: 0; padding-left: 0; }
.slh-col--amount   { width: 120px; text-align: right; }
.slh-col--extax    { width: 120px; text-align: right; }
.slh-col--tax      { width: 100px; text-align: right; }
.slh-col--tax8     { width: 160px; text-align: right; }
.slh-col--tax10    { width: 160px; text-align: right; }
.slh-col--toggle   { width: 36px;  text-align: center; flex-shrink: 0; padding: 0; }

/* 列ヘッダー行 */
.store-list-header {
  display: flex;
  align-items: center;
  padding: 8px 18px;
  background: #fff;
  border-bottom: 1px solid #D9D9D9;
  font-size: 12px;
  color: #888;
  font-weight: 400;
}

.store-accordion {
  border-bottom: 1px solid #E0E0E0;
}
.store-accordion:last-child { border-bottom: none; }

.store-accordion__header {
  display: flex;
  align-items: center;
  padding: 14px 18px;
  background: #fff;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.store-accordion__header:hover { background: #F9FBFF; }

.store-accordion__code {
  font-weight: 600;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.store-accordion__icon {
  font-size: 13px;
  color: #888;
  transition: transform 0.2s;
}
.store-accordion.is-open .store-accordion__icon {
  transform: rotate(180deg);
}

/* 消費税内訳 表示専用スパン */
.store-tax-val {
  display: inline-block;
  width: 100px;
  border: 1px solid #D9D9D9;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 13px;
  text-align: right;
  color: #333;
  background: #fff;
}

.store-accordion__body {
  display: none;
  border-top: 1px solid #EBEBEB;
  background: #FAFAFA;
}
.store-accordion.is-open .store-accordion__body { display: block; }


/* 加盟店リスト外枠 */
.store-list-wrap {
  border: 1px solid #D9D9D9;
  border-radius: 6px;
  overflow: hidden;
}

/* =====================================================
   Confirm page: detail row cards
   ===================================================== */
.detail-row {
  border-bottom: 1px solid #EBEBEB;
  padding: 10px 16px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row:hover { background: #F9FBFF; }

.detail-row__main {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  align-items: baseline;
}

.detail-row__field {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 6px;
  padding: 0 16px 0 0;
  border-right: 1px solid #D0D0D0;
  margin-right: 16px;
  white-space: nowrap;
}
.detail-row__field:last-child {
  border-right: none;
  margin-right: 0;
}

/* 概要列は少し幅を広げる */
.detail-row__field:nth-child(2) {
  flex: 1 1 auto;
  white-space: normal;
}

.detail-row__label {
  font-size: 13px;
  color: #555;
  white-space: nowrap;
  flex-shrink: 0;
}

.detail-row__sep {
  color: #BBBBBB;
  font-size: 13px;
  flex-shrink: 0;
}

.detail-row__value {
  font-size: 13px;
  font-weight: 600;
  color: #1a2b4a;
}

.detail-row__note {
  margin-top: 6px;
  font-size: 12px;
  color: #555;
  line-height: 1.6;
  padding-left: 2px;
}

.detail-row__note-label {
  font-weight: 600;
  color: #888;
  margin-right: 4px;
}

.detail-row__note-empty {
  color: #bbb;
}

/* =====================================================
   Confirm page: submit area
   ===================================================== */
.confirm-submit-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  margin-top: 32px;
}

.confirm-check-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}

.confirm-checkbox {
  width: 20px;
  height: 20px;
  cursor: pointer;
  flex-shrink: 0;
  accent-color: #1a2b4a;
  transform: scale(1.2);
  transform-origin: center;
}

/* =====================================================
   Footer
   ===================================================== */
.site-footer {
  text-align: center;
  padding: 14px;
  font-size: 12px;
  font-style: normal;
  font-weight: 400;
  color: #999;
  background: #F8F8F9;
}

/* =====================================================
   Home: レイアウト
   ===================================================== */
.home-content {
  display: flex;
  flex-direction: column;
  gap: 32px;
  padding-bottom: 100px; /* FABと被らないよう余白 */
}

.home-section-title {
  font-size: 24px;
  font-style: normal;
  font-weight: 400;
  color: #333;
  margin-bottom: 12px;
}

/* =====================================================
   Home: カレンダー
   ===================================================== */
.calendar-card {
  width: 100%;
  max-width: 426px;
  padding: 20px 24px 24px;
  margin: 0 auto;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.calendar-month-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.2;
}

.cal-label__year {
  font-size: 13px;
  font-weight: 400;
  color: #888;
}

.cal-label__month {
  font-size: 22px;
  font-weight: 700;
  color: #1a2b4a;
  letter-spacing: 0.02em;
}

.calendar-nav {
  background: none;
  border: none;
  font-size: 20px;
  color: #3a7bd5;
  padding: 4px 8px;
  border-radius: 4px;
  line-height: 1;
  transition: background 0.15s;
}
.calendar-nav:hover { background: #e8f0fe; }

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 4px;
}

.calendar-weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: #888;
  padding: 4px 0;
}
.calendar-weekday--sun { color: #e53935; }
.calendar-weekday--sat { color: #3a7bd5; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 48px;
  gap: 2px;
}

.cal-cell {
  padding: 4px 4px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-radius: 6px;
  position: relative;
  transition: background 0.1s;
}

.cal-cell--empty {
  pointer-events: none;
}

.cal-cell__num {
  font-size: 13px;
  font-weight: 400;
  color: #333;
  line-height: 1.4;
  min-width: 22px;
  text-align: center;
  border-radius: 50%;
  padding: 1px;
}

/* 今日の日付 */
.cal-cell--today .cal-cell__num {
  background: #3a7bd5;
  color: #fff;
  font-weight: 700;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

/* イベントあり */
.cal-cell--has-event {
  background: #f5f7ff;
}

/* スケジュールバッジ */
.cal-badge {
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 10px;
  white-space: nowrap;
  line-height: 1.5;
  width: 100%;
  text-align: center;
  max-width: 52px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 請求確定: 赤系 */
.cal-badge--billing {
  background: linear-gradient(135deg, #ff5252, #ff9800);
  color: #fff;
}

/* 口座振替: 青系 */
.cal-badge--payment {
  background: linear-gradient(135deg, #3a7bd5, #00A7B8);
  color: #fff;
}

/* =====================================================
   Home: 請求履歴
   ===================================================== */
.billing-history-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* カード全体: 均等幅グリッドで各ブロックを並べる */
.billing-card {
  background: #EFEFEF;
  border-radius: 6px;
  padding: 10px 16px;
  display: grid;
  grid-template-columns: 40px 1fr 1px 1fr 1px 1fr auto;
  align-items: start;
  gap: 0;
  font-size: 12px;
  color: #333;
  min-height: 60px;
}

/* ── 月ラベル ── */
.bc-month {
  font-size: 14px;
  font-weight: 700;
  color: #333;
  text-align: center;
  padding-right: 8px;
  align-self: center;
}

/* ── 請求金額ブロック ── */
.bc-billing {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto auto;
  align-items: baseline;
  column-gap: 6px;
  row-gap: 0;
  padding: 0 16px;
}

.bc-billing__label {
  grid-column: 1;
  grid-row: 1;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  color: #555;
  white-space: nowrap;
  line-height: 1.8;
}

.bc-billing__amount {
  grid-column: 2;
  grid-row: 1;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  white-space: nowrap;
  text-align: right;
  line-height: 1.8;
}

.bc-billing__sub {
