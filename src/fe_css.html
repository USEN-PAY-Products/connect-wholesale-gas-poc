<style>
/* =====================================================
   Utility
   ===================================================== */
.hidden { display: none !important; }

/* =====================================================
   Reset / Base
   ===================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
  font-size: 14px;
  background: #F8F8F9;
  color: #333;
  display: flex;
  flex-direction: column;
}

a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { cursor: pointer; font-family: inherit; }

/* =====================================================
   Layout wrapper
   ===================================================== */
.main-content {
  flex: 1;
  width: 1080px;
  margin: 0 auto;
  padding: 24px 16px 0;
  position: relative;
}

/* =====================================================
   Header
   ===================================================== */
.site-header {
  background: #1a2b4a;
  color: #fff;
  display: flex;
  height: 80px;
  min-width: 1280px;
  padding: 12px 32px;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  align-self: stretch;
  gap: 16px;
}

.header-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.header-logo {
  font-size: 32px;
  font-style: normal;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.header-produced {
  font-size: 18px;
  font-style: normal;
  font-weight: 700;
  color: #B9BEC3;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.btn-template-dl {
  display: flex;
  height: 32px;
  padding: 0 16px;
  justify-content: center;
  align-items: center;
  gap: 4px;
  border: none;
  border-radius: 24px;
  background: #00A7B8;
  box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.10);
  color: #fff;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}
.btn-template-dl:hover { background: #0096a5; }

.header-store {
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.4;
  border-left: 1px solid rgba(255,255,255,0.3);
  padding-left: 16px;
}

.header-store img {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
}

.header-store span {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  flex: 1 0 0;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  overflow: hidden;
}

/* =====================================================
   Toast
   ===================================================== */
.toast {
  position: fixed;
  top: 96px;
  right: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 36px 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
  z-index: 100;
}

.toast--error {
  background: #fff0f0;
  border: 1px solid #e53935;
  color: #c62828;
}

.toast--success {
  background: #f1f8f1;
  border: 1px solid #2e7d32;
  color: #1b5e20;
}

.toast-close {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 16px;
  color: inherit;
  line-height: 1;
  padding: 2px 4px;
}
.toast-close:hover { opacity: 0.7; }

.toast.hidden { display: none; }

/* =====================================================
   Page header
   ===================================================== */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  margin-right: -92px;
  margin-left: -92px;
}

.page-title {
  font-size: 28px;
  font-style: normal;
  font-weight: 400;
}

/* =====================================================
   Buttons (shared)
   ===================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  padding: 8px 18px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  line-height: 1;
  transition: background 0.15s, opacity 0.15s;
}

/* ボタン内アイコンを文字と同じ基準線に揃える */
.btn i {
  font-size: 1em;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  position: relative;
  top: -0.05em;
}

/* 一覧に戻る・確認画面へ進むのアイコンを24x24に固定 */
.btn-back i,
.btn-submit i {
  font-size: 24px;
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.btn-back {
  background: #00A7B8;
  color: #fff;
  display: flex;
  height: 48px;
  padding: 16px 40px;
  justify-content: center;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  border-radius: 24px;
  line-height: 1;
}
.btn-back:hover { background: #0096a5; }

.btn-primary {
  background: #3a7bd5;
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: #2f6abf; }
.btn-primary:disabled {
  background: #b0bec5;
  color: #eceff1;
  cursor: not-allowed;
}

.btn-outline {
  background: #fff;
  color: #333;
  border: 1.5px solid #bbb;
}
.btn-outline:hover { background: #f5f5f5; }

/* =====================================================
   Cards
   ===================================================== */
.card {
  background: #fff;
  border-radius: 10px;
  padding: 24px 28px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  margin-bottom: 16px;
}

/*
 * メイン白カード:
 * upload / error / buttons を1枚の白背景に縦積みする。
 * 高さは中身に応じて自動で伸びる。
 */
.main-card {
  display: flex;
  flex-direction: column;
  padding: 28px;
  gap: 24px;       /* 各子要素の間隔 */
  overflow: hidden; /* float (link-template) を内包 */
}

/* =====================================================
   Upload section
   ===================================================== */
.upload-card .card-label,
.card-label {
  font-size: 18px;
  font-style: normal;
  font-weight: 700;
  margin-bottom: 16px;
}

/* 確認画面の見出し */
#pageConfirm .card-label {
  font-size: 16px;
  font-style: normal;
  font-weight: 700;
  padding: 0;
  margin-bottom: 12px;
}

/* Drop zone */
.drop-zone {
  border: 2px dashed #9C9C9C;
  border-radius: 8px;
  background: #EFEFEF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  gap: 10px;
  transition: border-color 0.2s, background 0.2s;
  cursor: pointer;
}

.drop-zone.drag-over {
  border-color: #3a7bd5;
  background: #e8f0fe;
}

/* ローディング中（アカウント情報取得前）の無効状態 */
.drop-zone.is-disabled {
  opacity: 0.5;
  pointer-events: none;
  cursor: not-allowed;
}

.upload-area__error {
  color: #c62828;
  font-size: 14px;
  text-align: center;
  padding: 16px;
}

/* エラーページ */
.error-page {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 16px;
}

.error-page__card {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  max-width: 560px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.error-page__banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fdecea;
  border-bottom: 1px solid #f5c6c6;
  color: #c62828;
  font-weight: 700;
  font-size: 15px;
  padding: 14px 20px;
}

.error-page__body {
  padding: 24px 24px 8px;
  font-size: 14px;
  line-height: 1.8;
  color: #333;
}

.error-page__body p {
  margin: 0 0 12px;
}

.error-page__sub {
  color: #555;
}

.error-page__contact {
  text-align: center;
  margin-top: 16px;
}

.error-page__tel {
  color: #1565c0;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
}

.error-page__tel:hover {
  text-decoration: underline;
}

.error-page__footer {
  display: flex;
  justify-content: flex-end;
  padding: 12px 20px 16px;
  border-top: 1px solid #f0f0f0;
}

.error-page__back-link {
  color: #1565c0;
  font-size: 14px;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
}

.error-page__back-link:hover {
  text-decoration: underline;
}

/* 成功状態 */
.drop-zone.is-success {
  border-color: #2e7d32;
  border-style: solid;
  background: #f1f8f1;
}

/* CSV解析中スピナー状態 */
.drop-zone.is-analyzing {
  border-color: #1565c0;
  border-style: solid;
  background: #f0f4ff;
  pointer-events: none;
  cursor: not-allowed;
}

.drop-zone__spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #c7d9f5;
  border-top-color: #1565c0;
  border-radius: 50%;
  animation: dz-spin 0.8s linear infinite;
}

@keyframes dz-spin {
  to { transform: rotate(360deg); }
}

.drop-zone__analyzing-text {
  text-align: center;
  color: #1565c0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.6;
  margin: 0;
}

.drop-zone__analyzing-sub {
  text-align: center;
  color: #5a7ab5;
  font-size: 12px;
  margin: 0;
}

.drop-zone__icon--success {
  font-size: 40px;
  color: #2e7d32;
}

.drop-zone__text--success {
  text-align: center;
  color: #2e7d32;
  font-size: 14px;
  line-height: 1.6;
}

.drop-zone__icon {
  font-size: 40px;
  color: #90a4ae;
}

.drop-zone__text {
  text-align: center;
  color: #78909c;
  font-size: 14px;
  line-height: 1.6;
}

.btn-select-file {
  display: flex;
  height: 36px;
  padding: 8px 32px;
  justify-content: center;
  align-items: center;
  gap: 4px;
  border-radius: 40px;
  border: 1px solid #D9D9D9;
  background: #FFF;
  box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.06);
  color: #333;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  cursor: pointer;
}
.btn-select-file:hover { background: #f5f5f5; }

/* Template download link */
.link-template {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  color: #00A7B8;
  float: right;
}
.link-template:hover { text-decoration: underline; }

/* =====================================================
   Error card
   ===================================================== */
.error-card__title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
}

.error-card__desc {
  font-size: 13px;
  color: #555;
  margin-bottom: 14px;
  line-height: 1.6;
}

.alert-list { display: flex; flex-direction: column; gap: 8px; }

.alert-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  line-height: 1.5;
}

.alert-icon { flex-shrink: 0; margin-top: 2px; font-size: 10px; }

.alert-item--error { color: #c62828; }
.alert-item--error .alert-icon { color: #e53935; }

.alert-item--warn { color: #e65100; }
.alert-item--warn .alert-icon { color: #fb8c00; }

/* =====================================================
   Action buttons row
   ===================================================== */
.action-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.btn-submit {
  width: 230px;
  height: 48px;
  justify-content: center;
  font-size: 18px;
  font-weight: 400;
  border-radius: 24px;
  background: #1a2b4a;
  color: #fff;
}
.btn-submit:hover:not(:disabled) { background: #263d6b; }
.btn-submit:disabled {
  background: #C7C7C7;
  color: #fff;
  cursor: not-allowed;
}

.btn-cancel {
  width: 230px;
  height: 48px;
  justify-content: center;
  font-size: 18px;
  font-weight: 400;
  border-radius: 24px;
}

/* =====================================================
   Confirm page: summary table
   ===================================================== */
.summary-card {
  margin-bottom: 16px;
}

.summary-table {
  display: flex;
  border: 1px solid #D9D9D9;
  border-radius: 6px;
  overflow: hidden;
}

/* --- 各ブロック共通 --- */
.summary-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  padding: 16px 20px;
}

.summary-block--left  { flex: 0 0 260px; border-right: 1px solid #D9D9D9; }
.summary-block--mid   { flex: 1; border-right: 1px solid #D9D9D9; }
.summary-block--right { flex: 0 0 220px; background: #F9F9F9; }

/* --- 行 --- */
.summary-block__row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 4px 0;
}

.summary-block__row--main {
  padding-bottom: 8px;
}

.summary-block__row--head {
  padding-bottom: 6px;
}

/* 左ブロックの区切り線 */
.summary-block__divider {
  border-top: 1px solid #E0E0E0;
  margin: 6px 0;
}

/* --- テキスト --- */
.summary-block__label {
  font-size: 13px;
  color: #555;
  white-space: nowrap;
  flex-shrink: 0;
}

.summary-block__col-label {
  font-size: 12px;
  color: #888;
  white-space: nowrap;
  flex: 1;
  text-align: right;
}

.summary-block__tax-rate {
  font-size: 13px;
  color: #555;
  flex-shrink: 0;
  width: 32px;
}

.summary-block__value {
  font-size: 14px;
  font-weight: 600;
  color: #1a2b4a;
  white-space: nowrap;
  margin-left: auto;
  text-align: right;
}

.summary-block__value--main {
  font-size: 22px;
  font-weight: 700;
}

.summary-block__value--transfer {
  font-size: 22px;
  font-weight: 700;
}

/* ─── 金額入力フィールド（編集可能な amount input）─── */
.amount-input {
  display: inline-block;
  width: 100%;
  border: 1px solid #C9D4E8;
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 14px;
  font-weight: 600;
  color: #1a2b4a;
  text-align: right;
  background: #FAFCFF;
  box-sizing: border-box;
}
.amount-input:focus {
  outline: none;
  border-color: #4A7FF5;
  box-shadow: 0 0 0 2px rgba(74,127,245,.15);
  background: #FFF;
}
/* サマリーの主要金額（請求金額・振込金額）はより大きく表示 */
.amount-input--main,
.amount-input--transfer {
  font-size: 20px;
  font-weight: 700;
}

/* =====================================================
   Confirm page: store accordion
   ===================================================== */

/* 列幅定義（ヘッダー行・各アコーディオン行で共有） */
.slh-col           { font-size: 13px; padding: 0 12px; flex-shrink: 0; }
.slh-col--name     { flex: 1 1 160px; min-width: 0; padding-left: 0; }
.slh-col--amount   { width: 120px; text-align: right; }
.slh-col--extax    { width: 120px; text-align: right; }
.slh-col--tax      { width: 100px; text-align: right; }
.slh-col--tax8     { width: 160px; text-align: right; }
.slh-col--tax10    { width: 160px; text-align: right; }
.slh-col--toggle   { width: 36px;  text-align: center; flex-shrink: 0; padding: 0; }

/* store accordion header 内の amount-input は幅いっぱいに使う */
.store-accordion__header .amount-input {
  width: 100%;
  font-size: 13px;
  font-weight: 600;
  padding: 2px 4px;
}

/* 列ヘッダー行 */
.store-list-header {
  display: flex;
  align-items: center;
  padding: 8px 18px;
  background: #fff;
  border-bottom: 1px solid #D9D9D9;
  font-size: 12px;
  color: #888;
  font-weight: 400;
}

.store-accordion {
  border-bottom: 1px solid #E0E0E0;
}
.store-accordion:last-child { border-bottom: none; }

.store-accordion__header {
  display: flex;
  align-items: center;
  padding: 14px 18px;
  background: #fff;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.store-accordion__header:hover { background: #F9FBFF; }

.store-accordion__code {
  font-weight: 600;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.store-accordion__icon {
  font-size: 13px;
  color: #888;
  transition: transform 0.2s;
}
.store-accordion.is-open .store-accordion__icon {
  transform: rotate(180deg);
}

/* 消費税内訳 表示専用スパン */
.store-tax-val {
  display: inline-block;
  width: 100px;
  border: 1px solid #D9D9D9;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 13px;
  text-align: right;
  color: #333;
  background: #fff;
}

.store-accordion__body {
  display: none;
  border-top: 1px solid #EBEBEB;
  background: #FAFAFA;
}
.store-accordion.is-open .store-accordion__body { display: block; }

/* 加盟店ごとの備考エリア */
.store-accordion__remarks {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 16px 14px;
  border-top: 1px dashed #D9D9D9;
  background: #F5F8FF;
}
.remarks-label {
  flex-shrink: 0;
  font-size: 13px;
  color: #555;
  padding-top: 6px;
  white-space: nowrap;
}
.remarks-input {
  flex: 1;
  min-height: 52px;
  padding: 6px 8px;
  border: 1px solid #C9D4E8;
  border-radius: 4px;
  font-size: 13px;
  resize: vertical;
  background: #FFF;
  color: #333;
}
.remarks-input:focus {
  outline: none;
  border-color: #4A7FF5;
  box-shadow: 0 0 0 2px rgba(74,127,245,.15);
}


/* 加盟店リスト外枠 */
.store-list-wrap {
  border: 1px solid #D9D9D9;
  border-radius: 6px;
  overflow: hidden;
}

/* =====================================================
   Confirm page: detail row cards
   ===================================================== */
.detail-row {
  border-bottom: 1px solid #EBEBEB;
  padding: 10px 16px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row:hover { background: #F9FBFF; }

.detail-row__main {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  align-items: baseline;
}

.detail-row__field {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 6px;
  padding: 0 16px 0 0;
  border-right: 1px solid #D0D0D0;
  margin-right: 16px;
  white-space: nowrap;
}
.detail-row__field:last-child {
  border-right: none;
  margin-right: 0;
}

/* 概要列は少し幅を広げる */
.detail-row__field:nth-child(2) {
  flex: 1 1 auto;
  white-space: normal;
}

.detail-row__label {
  font-size: 13px;
  color: #555;
  white-space: nowrap;
  flex-shrink: 0;
}

.detail-row__sep {
  color: #BBBBBB;
  font-size: 13px;
  flex-shrink: 0;
}

.detail-row__value {
  font-size: 13px;
  font-weight: 600;
  color: #1a2b4a;
}

.detail-row__note {
  margin-top: 6px;
  font-size: 12px;
  color: #555;
  line-height: 1.6;
  padding-left: 2px;
}

.detail-row__note-label {
  font-weight: 600;
  color: #888;
  margin-right: 4px;
}

.detail-row__note-empty {
  color: #bbb;
}

/* =====================================================
   Confirm page: submit area
   ===================================================== */
.confirm-submit-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  margin-top: 32px;
}

.confirm-check-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}

.confirm-checkbox {
  width: 20px;
  height: 20px;
  cursor: pointer;
  flex-shrink: 0;
  accent-color: #1a2b4a;
  transform: scale(1.2);
  transform-origin: center;
}

/* =====================================================
   Footer
   ===================================================== */
.site-footer {
  text-align: center;
  padding: 14px;
  font-size: 12px;
  font-style: normal;
  font-weight: 400;
  color: #999;
  background: #F8F8F9;
}

/* =====================================================
   Home: レイアウト
   ===================================================== */
.home-content {
  display: flex;
  flex-direction: column;
  gap: 32px;
  padding-bottom: 100px; /* FABと被らないよう余白 */
}

.home-section-title {
  font-size: 24px;
  font-style: normal;
  font-weight: 400;
  color: #333;
  margin-bottom: 12px;
}

/* =====================================================
   Home: カレンダー
   ===================================================== */
.calendar-card {
  width: 100%;
  max-width: 426px;
  padding: 20px 24px 24px;
  margin: 0 auto;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.calendar-month-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.2;
}

.cal-label__year {
  font-size: 13px;
  font-weight: 400;
  color: #888;
}

.cal-label__month {
  font-size: 22px;
  font-weight: 700;
  color: #1a2b4a;
  letter-spacing: 0.02em;
}

.calendar-nav {
  background: none;
  border: none;
  font-size: 20px;
  color: #3a7bd5;
  padding: 4px 8px;
  border-radius: 4px;
  line-height: 1;
  transition: background 0.15s;
}
.calendar-nav:hover { background: #e8f0fe; }

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 4px;
}

.calendar-weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: #888;
  padding: 4px 0;
}
.calendar-weekday--sun { color: #e53935; }
.calendar-weekday--sat { color: #3a7bd5; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 48px;
  gap: 2px;
}

.cal-cell {
  padding: 4px 4px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-radius: 6px;
  position: relative;
  transition: background 0.1s;
}

.cal-cell--empty {
  pointer-events: none;
}

.cal-cell__num {
  font-size: 13px;
  font-weight: 400;
  color: #333;
  line-height: 1.4;
  min-width: 22px;
  text-align: center;
  border-radius: 50%;
  padding: 1px;
}

/* 今日の日付 */
.cal-cell--today .cal-cell__num {
  background: #3a7bd5;
  color: #fff;
  font-weight: 700;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

/* イベントあり */
.cal-cell--has-event {
  background: #f5f7ff;
}

/* スケジュールバッジ */
.cal-badge {
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 10px;
  white-space: nowrap;
  line-height: 1.5;
  width: 100%;
  text-align: center;
  max-width: 52px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 請求確定: 赤系 */
.cal-badge--billing {
  background: linear-gradient(135deg, #ff5252, #ff9800);
  color: #fff;
}

/* 口座振替: 青系 */
.cal-badge--payment {
  background: linear-gradient(135deg, #3a7bd5, #00A7B8);
  color: #fff;
}

/* =====================================================
   Home: 請求履歴
   ===================================================== */
.billing-history-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* カード全体: 均等幅グリッドで各ブロックを並べる */
.billing-card {
  background: #EFEFEF;
  border-radius: 6px;
  padding: 10px 16px;
  display: grid;
  grid-template-columns: 40px 1fr 1px 1fr 1px 1fr auto;
  align-items: start;
  gap: 0;
  font-size: 12px;
  color: #333;
  min-height: 60px;
}

/* ── 月ラベル ── */
.bc-month {
  font-size: 14px;
  font-weight: 700;
  color: #333;
  text-align: center;
  padding-right: 8px;
  align-self: center;
}

/* ── 請求金額ブロック ── */
.bc-billing {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto auto;
  align-items: baseline;
  column-gap: 6px;
  row-gap: 0;
  padding: 0 16px;
}

.bc-billing__label {
  grid-column: 1;
  grid-row: 1;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  color: #555;
  white-space: nowrap;
  line-height: 1.8;
}

.bc-billing__amount {
  grid-column: 2;
  grid-row: 1;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  white-space: nowrap;
  text-align: right;
  line-height: 1.8;
}

.bc-billing__sub {
  grid-column: 1 / -1;
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  color: #666;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  line-height: 1.8;
}

.bc-billing__sub span {
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  color: #333;
}

/* ── 縦区切り線 ── */
.bc-divider {
  width: 1px;
  align-self: stretch;
  background: #ccc;
  margin: 4px 0;
  flex-shrink: 0;
}

/* ── 内訳ブロック ── */
.bc-breakdown {
  padding: 0 14px;
  overflow: hidden;
}

/* 3列グリッド: [内訳/税率] [小計] [税額] */
.bc-breakdown__grid {
  display: grid;
  grid-template-columns: auto 1fr 1fr;
  gap: 2px 12px;
  align-items: baseline;
}

.bc-breakdown__cell {
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  line-height: 1.8;
  white-space: nowrap;
}

.bc-breakdown__title {
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  color: #555;
  line-height: 1.8;
}

.bc-breakdown__col-label {
  color: #777;
  text-align: center;
}

.bc-breakdown__rate {
  color: #555;
}

.bc-breakdown__col-val {
  color: #333;
  text-align: center;
}

/* ── 手数料・振込金額ブロック ── */
.bc-fee {
  padding: 0 14px;
  align-self: center;
}

.bc-fee__row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  color: #555;
  line-height: 1.8;
  white-space: nowrap;
}

.bc-fee__row span {
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  color: #333;
}

/* ── 詳細リンク ── */
.bc-detail-link {
  font-size: 14px;
  font-style: normal;
  font-weight: 400;
  color: #555;
  white-space: nowrap;
  text-decoration: none;
  flex-shrink: 0;
  padding-left: 12px;
  align-self: center;
  transition: opacity 0.15s;
  background: none;
  border: none;
  outline: none;
  cursor: pointer;
}
.bc-detail-link:hover { opacity: 0.7; text-decoration: underline; }

.billing-empty {
  color: #9C9C9C;
  text-align: center;
  padding: 48px 0;
  font-size: 14px;
}

/* =====================================================
   Home: FAB（新規請求登録ボタン）
   ===================================================== */
.home-fab-area {
  display: flex;
  justify-content: flex-end;
  padding: 16px 0 32px;
}

.btn-fab {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 52px;
  padding: 0 28px;
  background: #1a2b4a;
  color: #fff;
  font-size: 18px;
  font-style: normal;
  font-weight: 400;
  border-radius: 26px;
  box-shadow: 0 4px 16px rgba(26,43,74,0.28);
  text-decoration: none;
  transition: background 0.15s, box-shadow 0.15s;
}
.btn-fab:hover {
  background: #263d6b;
  box-shadow: 0 6px 20px rgba(26,43,74,0.36);
}

.btn-fab__plus {
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
}

/* =====================================================
   Confirm page: cancel button row
   ===================================================== */
.confirm-cancel-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 16px;
  margin-right: -92px;
  margin-left: -92px;
}

.btn-cancel-confirm {
  background: transparent;
  color: #e53935;
  border: 1.5px solid #e53935;
  border-radius: 24px;
  height: 48px;
  padding: 0 40px;
  font-size: 18px;
  font-weight: 400;
  cursor: pointer;
  transition: background 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-cancel-confirm:hover { background: #fff5f5; }

/* =====================================================
   Confirm page: cancel modal
   ===================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal-overlay.hidden { display: none; }

.modal {
  background: #fff;
  border-radius: 10px;
  padding: 36px 40px 28px;
  min-width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.modal__title {
  font-size: 15px;
  font-weight: 700;
  color: #333;
  margin: 0;
}

.modal__message {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  text-align: center;
}

.modal__actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.modal__btn {
  min-width: 100px;
  height: 40px;
  justify-content: center;
  font-size: 14px;
  border-radius: 6px;
}

.btn-danger {
  background: #e53935;
  color: #fff;
  border: none;
}
.btn-danger:hover { background: #c62828; }
/* =============================================================================
   Loading Overlay
   ============================================================================= */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 9999;
  backdrop-filter: blur(2px);
}
.loading-overlay.hidden {
  display: none;
}
.loading-overlay__spinner {
  font-size: 48px;
  color: var(--color-primary, #2563eb);
}
.loading-overlay__text {
  font-size: 16px;
  font-weight: 600;
  color: #374151;
  margin: 0;
}

/* =============================================================================
   Detail page: レイアウト
   ============================================================================= */
.detail-content {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 60px;
}

.detail-bottom-actions {
  display: flex;
  justify-content: center;
  padding: 8px 0 16px;
}

/* =============================================================================
   Detail page: 親サマリーカード
   ============================================================================= */
.detail-summary-card {
  padding: 24px 28px;
}

.detail-loading-placeholder {
  text-align: center;
  color: #9C9C9C;
  padding: 36px 0;
  font-size: 15px;
}

.detail-error-msg {
  text-align: center;
  color: #c62828;
  padding: 36px 0;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.detail-summary-inner {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  align-items: start;
}

.detail-meta-row--handover {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 0 4px;
  border-top: 1px solid #E0E0E0;
  margin-top: 6px;
}

.detail-meta-label--block {
  font-size: 13px;
  font-weight: 700;
  color: #1a2b4a;
}

.detail-handover-textarea {
  width: 100%;
  min-height: 100px;
  padding: 10px 12px;
  border: 1px solid #D0D9E8;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  color: #555;
  background: #F9FAFB;
  resize: none;
  line-height: 1.6;
}
.detail-handover-textarea:read-only {
  cursor: default;
  outline: none;
}

.detail-handover-note {
  font-size: 12px;
  color: #888;
  line-height: 1.5;
}

/* -- 左: 基本情報 -- */
.detail-summary-meta__title {
  font-size: 15px;
  font-weight: 700;
  color: #333;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid #E0E0E0;
}

.detail-meta-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 5px 0;
  font-size: 13px;
}

.detail-meta-label {
  color: #666;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 120px;
}

.detail-meta-value {
  font-weight: 600;
  color: #1a2b4a;
}

.detail-meta-row--note {
  align-items: flex-start;
  padding-top: 8px;
  margin-top: 4px;
  border-top: 1px dashed #E0E0E0;
}

.detail-meta-value--note {
  font-size: 12px;
  font-weight: 400;
  color: #555;
  line-height: 1.6;
}

/* -- 右: 請求金額 -- */
.detail-summary-amount {
  min-width: 320px;
  background: #F9FAFB;
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  padding: 18px 24px;
}

.detail-amount-header {
  font-size: 13px;
  color: #888;
  margin-bottom: 6px;
}

.detail-amount-main-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid #E0E0E0;
}

.detail-amount-sublabel {
  font-size: 13px;
  color: #888;
}

.detail-amount-total {
  font-size: 32px;
  font-weight: 700;
  color: #1a2b4a;
  margin-left: auto;
}

.detail-amount-unit {
  font-size: 18px;
  font-weight: 400;
  margin-left: 2px;
}

.detail-amount-rows {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.detail-amount-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  font-size: 13px;
  color: #555;
  padding: 2px 0;
}

.detail-amount-row span:last-child {
  font-weight: 600;
  color: #1a2b4a;
}

.detail-amount-divider {
  border-top: 1px solid #E0E0E0;
  margin: 8px 0;
}

.detail-amount-section-label {
  font-size: 12px;
  color: #999;
  margin-bottom: 2px;
}

/* =============================================================================
   Detail page: セクション（差し戻し / その他）
   ============================================================================= */
.detail-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-section-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid #E0E0E0;
}

.detail-section-header--returned {
  background: #fff8f0;
  border-color: #f5a623;
}

.detail-section-header__left {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.detail-section-header__actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  padding-top: 4px;
}

.detail-section-title {
  font-size: 16px;
  font-weight: 700;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}

.detail-section-title--returned {
  font-size: 16px;
  font-weight: 700;
  color: #e65100;
  display: flex;
  align-items: center;
  gap: 8px;
}

.detail-section-title--returned i {
  color: #f5a623;
}

.detail-section-desc {
  font-size: 13px;
  color: #666;
  line-height: 1.6;
}

.btn-sm {
  height: 32px;
  padding: 0 14px;
  font-size: 13px;
  border-radius: 6px;
  gap: 5px;
}

/* =============================================================================
   Detail page: 加盟店リスト（dsl = detail store list）
   ============================================================================= */

/* 列幅定義（ヘッダー行・各アコーディオン行で共有） */
.dsl-col          { font-size: 13px; padding: 0 10px; flex-shrink: 0; }
.dsl-col--name    { flex: 1 1 160px; min-width: 0; padding-left: 0; }
.dsl-col--code    { width: 90px; }
.dsl-col--amount  { width: 110px; text-align: right; }
.dsl-col--extax   { width: 110px; text-align: right; }
.dsl-col--tax     { width: 90px;  text-align: right; }
.dsl-col--tax10   { width: 110px; text-align: right; }
.dsl-col--tax8    { width: 100px; text-align: right; }
.dsl-col--status  { width: 100px; text-align: center; }
.dsl-col--toggle  { width: 32px;  text-align: center; padding: 0; }

/* 列ヘッダー行 */
.dsl-header {
  display: flex;
  align-items: center;
  padding: 8px 16px;
  background: #F5F5F5;
  border-bottom: 1px solid #D9D9D9;
  font-size: 12px;
  color: #888;
  font-weight: 400;
}

/* アコーディオン全体 */
.dsl-accordion {
  border-bottom: 1px solid #E8E8E8;
}
.dsl-accordion:last-child { border-bottom: none; }

/* 差し戻しアコーディオン: 左に赤ボーダー */
.dsl-accordion--returned {
  border-left: 3px solid #f5a623;
  background: #fffdf8;
}

/* ヘッダー行 */
.dsl-accordion__header {
  display: flex;
  align-items: center;
  padding: 13px 16px;
  background: transparent;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.dsl-accordion__header:hover { background: #F9FBFF; }
.dsl-accordion--returned .dsl-accordion__header:hover { background: #fff4e0; }

/* 加盟店名（overflow対応） */
.dsl-store-name {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 矢印アイコン */
.dsl-accordion__icon {
  font-size: 12px;
  color: #888;
  transition: transform 0.2s;
}
.dsl-accordion.is-open .dsl-accordion__icon {
  transform: rotate(180deg);
}

/* ボディ */
.dsl-accordion__body {
  display: none;
  border-top: 1px solid #EBEBEB;
  background: #FAFAFA;
}
.dsl-accordion.is-open .dsl-accordion__body { display: block; }
.dsl-accordion--returned .dsl-accordion__body { background: #fffdf8; }

/* 差し戻し理由バナー */
.dsl-returned-reason {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 16px;
  background: #fff3e0;
  border-bottom: 1px solid #ffe0b2;
  font-size: 13px;
  line-height: 1.6;
  color: #e65100;
}

.dsl-returned-reason i {
  flex-shrink: 0;
  margin-top: 2px;
  color: #f5a623;
}

.dsl-returned-reason__label {
  font-weight: 700;
  flex-shrink: 0;
}

.dsl-returned-reason__text {
  color: #333;
}

/* 申し送りコメント */
.dsl-wholesaler-note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 8px 16px;
  background: #F5F8FF;
  border-bottom: 1px dashed #D0D9F0;
  font-size: 13px;
  color: #555;
  line-height: 1.6;
}

.dsl-wholesaler-note__label {
  font-weight: 600;
  flex-shrink: 0;
}

/* 明細コンテナ */
.dsl-lines-container {
  padding: 0;
}

.dsl-lines-loading,
.dsl-lines-error,
.dsl-lines-empty {
  text-align: center;
  padding: 24px 16px;
  font-size: 13px;
  color: #9C9C9C;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.dsl-lines-error { color: #c62828; }

/* 明細テーブル */
.dsl-lines-scroll {
  overflow-x: auto;
  padding: 0 0 8px;
}

.dsl-lines-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 700px;
}

.dsl-lines-table thead tr {
  background: #EFEFEF;
}

.dsl-lines-table th {
  text-align: right;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
  color: #666;
  border-bottom: 1px solid #D9D9D9;
  white-space: nowrap;
}

.dsl-lines-table th:first-child,
.dsl-lines-table td:first-child { text-align: left; }

.dsl-lines-table td {
  text-align: right;
  padding: 7px 12px;
  color: #333;
  border-bottom: 1px solid #F0F0F0;
  vertical-align: middle;
}

.dsl-lines-table tbody tr:last-child td { border-bottom: none; }
.dsl-lines-table tbody tr:hover td { background: #F5F8FF; }
.dsl-accordion--returned .dsl-lines-table tbody tr:hover td { background: #fff4e0; }

.dsl-tbl__item { text-align: left; }
.dsl-tbl__num  { text-align: right; font-variant-numeric: tabular-nums; }
.dsl-tbl__note { text-align: left; color: #777; font-size: 12px; }

/* =============================================================================
   Detail page: ステータスバッジ
   ============================================================================= */
.detail-status-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
