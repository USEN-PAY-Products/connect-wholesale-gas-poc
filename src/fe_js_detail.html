<script>
// ---- detail.js ----
// =============================================================================
// Detail page: 請求書詳細画面（アコーディオン連動・オンデマンド読み込み方式）
// =============================================================================

/** 現在表示中の卸インボイスID（同じ ID の再描画をスキップするためのキャッシュ） */
let _detailCurrentInvoiceId = null;
let _detailActionRequiredMallCodes = [];
/** RETURNED かつ invoice_status が null の加盟店 mall_code（警告のみでエラーにしない） */
let _detailReturnedOnlyMallCodes = [];
/** 詳細画面専用の mall_code → customer_code マップ（end 店舗も含む） */
let _detailMallToCustomerMap = {};
/**
 * 取引終了（store_status='end'）の加盟店情報 [{mall_code, customer_code, store_name}]。再請求不可。
 * 挙動はフローで異なる:
 * - 個別再請求: 対象加盟店が end ならエラーでブロック（CSV の有無に関わらず不可）。
 * - 一括再請求: 「要対応」かつ end の店舗が CSV に含まれている場合のみ警告し、今回の再請求から除外。
 *   それ以外（要対応でない end 店舗 / CSV 未収載の end 店舗）は警告なしで要対応外としてサイレント除外。
 */
let _detailEndStores = [];
/**
 * 取り下げ依頼中（backoffice_review_status='WITHDRAW_REQUESTED'）の加盟店情報
 * [{mall_code, customer_code, store_name}]。CSV一括アップロード時にこの店舗のデータが
 * 含まれていた場合、警告のうえ今回の再請求から除外（スキップ）するための判定に使用する。
 */
let _detailWithdrawRequestedStores = [];
/** 異議申立期間の終了日（OBJECTION_PERIOD の end_at）。期間終了後は「取り下げ依頼を取り消す」を無効化する（以降は自動承認バッチ〈本リポジトリ外〉が処理する） */
let _objectionEndAt = null;
/** リロード完了後に表示するトーストメッセージ（取り下げ / 取り消し成功時） */
let _detailPendingToastMsg = null;
/** 再送信モードで確認画面を表示する際のコンテキスト */
let _isResubmitConfirm = false;
let _resubmitParentInvoiceId = null;
let _resubmitRemarks = {};
let _resubmitHandovers = {};
let _resubmitDisputedCodes = [];
let _resubmitDisputedReasons = {};

/**
 * 詳細画面を初期化する。
 * navigate() から invoiceId を受け取り、GAS API でデータを取得・描画する。
 * 同じ invoiceId が渡された場合は再描画をスキップする。
 * @param {string|null} invoiceId
 */
function initDetailPage(invoiceId) {
  if (!invoiceId) {
    renderDetailError_('請求IDが指定されていません。一覧に戻ってやり直してください。');
    return;
  }
  if (_detailCurrentInvoiceId === invoiceId) return; // 同一ページの再描画スキップ

  _detailCurrentInvoiceId = invoiceId;
  resetDetailPage_();

  showLoadingOverlay('請求詳細を取得中...');

  // ペンディングトースト: 取り下げ / 取り消し成功後のリロード時に使用
  const pendingToastMsg = _detailPendingToastMsg || null;
  _detailPendingToastMsg = null;

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        hideLoadingOverlay();
        if (!result || !result.data) {
          renderDetailError_('データが見つかりませんでした。');
          return;
        }
        renderDetailPage_(result.data);
        if (pendingToastMsg) showToast(pendingToastMsg, 'success');
      })
      .withFailureHandler(function (err) {
        hideLoadingOverlay();
        console.error('[detail] fetchInvoiceDetail failed:', err);
        renderDetailError_('データの取得中にエラーが発生しました: ' + String(err.message || err));
      })
      .fetchInvoiceDetail(invoiceId, getSessionToken_());
  } else {
    hideLoadingOverlay();
    renderDetailError_('GAS 環境外での実行は非対応です。');
  }
}

/**
 * 詳細画面をリセットする（別の invoiceId に遷移する前に呼ぶ）。
 */
function resetDetailPage_() {
  const summaryCard = document.getElementById('detailSummaryCard');
  if (summaryCard) {
    summaryCard.innerHTML =
      '<div class="detail-loading-placeholder"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>';
  }
  ['detailActionRequiredSection', 'detailNormalSection', 'detailWithdrawnSection', 'detailReturnedSubsection', 'detailDisputedSubsection'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });
  ['detailReturnedList', 'detailDisputedList', 'detailNormalList', 'detailWithdrawnList'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
}

/**
 * エラーメッセージをサマリーカードに表示する。
 * @param {string} message
 */
function renderDetailError_(message) {
  const card = document.getElementById('detailSummaryCard');
  if (card) {
    card.innerHTML =
      '<p class="detail-error-msg"><i class="fa-solid fa-circle-exclamation"></i> ' +
      escapeHtml(message) + '</p>';
  }
}

// =============================================================================
// Detail page: 描画
// =============================================================================

/**
 * 取得データを詳細画面に描画する。
 * @param {{ summary: Object, stores: Array<Object> }} data
 */
function renderDetailPage_(data) {
  _objectionEndAt = (data.summary && data.summary.objection_end_at) || null;
  renderDetailSummary_(data.summary);
  renderDetailStoreList_(data.stores || []);
  checkReuploadDeadline_();
  checkWholesalerEndStatus_();
}

/**
 * 異議申立期間（OBJECTION_PERIOD）の end_at を確認し、
 * 期限切れなら「修正ファイルをアップ」「変更なしで再請求」「請求取り下げ」「CSV一括アップロード」ボタンを無効化する。
 */
function checkReuploadDeadline_() {
  // CSV一括アップロードボタン（detailBtnUploadCsv）はページ内に1つだけ存在する静的要素で、
  // 個別ボタン（アコーディオン内の reupload/resubmit/withdraw）と異なり請求書を切り替えても
  // DOM が再生成されない。そのため、以前に表示した別の請求書（異議申立期間が期限切れ）で
  // 無効化された状態が、その後に表示した期限内の請求書にも残ってしまう不具合があった。
  // ここで毎回いったんリセットしてから、現在表示中の請求書の期限で判定し直す。
  const bulkBtn = document.getElementById('detailBtnUploadCsv');
  if (bulkBtn) {
    bulkBtn.disabled = false;
    bulkBtn.title    = '';
    bulkBtn.style.opacity = '';
    const parentActionsForReset = bulkBtn.parentElement;
    const oldMsg = parentActionsForReset && parentActionsForReset.querySelector('.detail-action-btn__period-expired-msg');
    if (oldMsg) oldMsg.remove();
  }

  if (!_objectionEndAt) return;
  const today = jstNow_().ymd;
  const endAt = String(_objectionEndAt).slice(0, 10);
  if (today <= endAt) return;

  // 期限切れ: 再アップロード系ボタンを無効化
  const expiredMsg = '異議申立期間（' + endAt + ' まで）を過ぎているため、操作できません。';

  // 個別ボタン（修正ファイルをアップ / 変更なしで再請求 / 請求取り下げ）
  document.querySelectorAll('[data-action="reupload"], [data-action="resubmit"], [data-action="withdraw"]').forEach(function(btn) {
    btn.disabled = true;
    btn.title    = expiredMsg;
    btn.style.opacity = '0.5';
  });
  // 各 .backoffice-remark__actions に期限切れメッセージを追加（重複防止）
  document.querySelectorAll('.backoffice-remark__actions').forEach(function(actionsEl) {
    if (actionsEl.querySelector('.detail-action-btn__period-expired-msg')) return;
    const msgEl = document.createElement('p');
    msgEl.className = 'detail-action-btn__period-expired-msg';
    msgEl.textContent = '異議申立期間が終了しています';
    actionsEl.appendChild(msgEl);
  });

  // 一括再送信ボタン（CSV一括アップロード）
  if (bulkBtn) {
    bulkBtn.disabled = true;
    bulkBtn.title    = expiredMsg;
    bulkBtn.style.opacity = '0.5';
    // ボタンの親要素に期限切れメッセージを追加
    const parentActions = bulkBtn.parentElement;
    if (parentActions && !parentActions.querySelector('.detail-action-btn__period-expired-msg')) {
      const msgEl = document.createElement('p');
      msgEl.className = 'detail-action-btn__period-expired-msg';
      msgEl.textContent = '異議申立期間が終了しています';
      parentActions.appendChild(msgEl);
    }
  }
}

/**
 * 卸ステータス（wholesaler_status）が 'end'（契約終了）かを確認し、
 * 契約終了なら「修正ファイルをアップ」「変更なしで再請求」「請求取り下げ」
 * 「取り下げ依頼を取り消す」「CSV一括アップロード」ボタンを無効化する（過去請求の参照は引き続き可能）。
 */
function checkWholesalerEndStatus_() {
  const wholesalerStatus = sessionStorage.getItem('shiire_wholesaler_status');
  if (wholesalerStatus !== 'end') return;

  const endMsg = '仕入れコネクトの契約が終了しているため、操作できません。';

  // 個別ボタン（修正ファイルをアップ / 変更なしで再請求 / 請求取り下げ / 取り下げ依頼を取り消す）
  // 既に他の理由（異議申立期間切れ等）で disabled かつ title 設定済みの場合は上書きしない
  // （tooltip の理由と画面上のメッセージ段落の食い違いを防止するため）
  document.querySelectorAll('[data-action="reupload"], [data-action="resubmit"], [data-action="withdraw"], [data-action="cancel-withdraw-request"]').forEach(function(btn) {
    if (btn.disabled && btn.title) return;
    btn.disabled = true;
    btn.title    = endMsg;
    btn.style.opacity = '0.5';
  });
  // 各 .backoffice-remark__actions のうち、上記いずれかのボタンが存在する行にのみ契約終了メッセージを追加する
  // （異議申立期限切れメッセージとの重複も防止）
  document.querySelectorAll('.backoffice-remark__actions').forEach(function(actionsEl) {
    if (!actionsEl.querySelector('[data-action="reupload"], [data-action="resubmit"], [data-action="withdraw"], [data-action="cancel-withdraw-request"]')) return;
    if (actionsEl.querySelector('.detail-action-btn__period-expired-msg')) return;
    const msgEl = document.createElement('p');
    msgEl.className = 'detail-action-btn__period-expired-msg';
    msgEl.textContent = endMsg;
    actionsEl.appendChild(msgEl);
  });

  // 一括再送信ボタン（CSV一括アップロード）
  // 既に他の理由（異議申立期間切れ等）で disabled かつ title 設定済みの場合は上書きしない
  const bulkBtn2 = document.getElementById('detailBtnUploadCsv');
  if (bulkBtn2 && !(bulkBtn2.disabled && bulkBtn2.title)) {
    bulkBtn2.disabled = true;
    bulkBtn2.title    = endMsg;
    bulkBtn2.style.opacity = '0.5';
    const parentActions2 = bulkBtn2.parentElement;
    if (parentActions2 && !parentActions2.querySelector('.detail-action-btn__period-expired-msg')) {
      const msgEl2 = document.createElement('p');
      msgEl2.className = 'detail-action-btn__period-expired-msg';
      msgEl2.textContent = endMsg;
      parentActions2.appendChild(msgEl2);
    }
  }
}

/**
 * 親サマリーカードを描画する。
 * @param {Object} s
 */
function renderDetailSummary_(s) {
  const card = document.getElementById('detailSummaryCard');
  if (!card || !s) return;

  const fmt = function (n) { return Number(n || 0).toLocaleString('ja-JP'); };
  const rawDate = s.created_at || s.wholesaler_invoice_date || '';
  const date = rawDate ? String(rawDate).replace(/-/g, '/').replace(/T/, ' ').replace(/\.\d+$/, '') : '―';
  // 手数料率は BQ の NUMERIC をそのまま表示する。runQuery_() は cell.v を文字列で返すため、
  // Number() 変換すると精度落ち（0.1→0.10000000000000002）や末専0消失（3.50→3.5）が起き得る。
  const feeRate = (s.wholesaler_fee_rate != null && String(s.wholesaler_fee_rate) !== '')
    ? String(s.wholesaler_fee_rate) + '%' : '―';

  const billingMonth = s.wholesaler_invoice_date
    ? String(s.wholesaler_invoice_date).replace(/-/g, '/').replace(/^(\d{4}\/\d{2}).*$/, '$1') : '―';

  card.innerHTML = `
    <div class="detail-summary-title">請求基本情報</div>
    <div class="detail-summary-inner">
      <div class="detail-summary-meta">
        <div class="detail-meta-row">
            <span class="detail-meta-label">請求月</span>
            <span class="detail-meta-value">${escapeHtml(String(billingMonth))}</span>
        </div>
        <div class="detail-meta-row">
            <span class="detail-meta-label">登録日時</span>
            <span class="detail-meta-value">${escapeHtml(date)}</span>
        </div>
        <div class="detail-meta-row">
          <span class="detail-meta-label">手数料（${escapeHtml(feeRate)}）<span class="detail-meta-help-wrap"><i class="fa-solid fa-circle-question detail-meta-help" style="color:#00A7B8"></i><span class="detail-meta-tooltip">手数料は、卸コネクトサービスの使用料としての料金です。<br>加盟店への請求金額の総額に対して、設定された手数料率をかけることで算出されます。<br>その他、手数料に関するお問い合わせは000-0000-0000までご連絡ください。</span></span></span>
          <span class="detail-meta-value">${fmt(s.invoice_fee_amount)}円</span>
        </div>
        <div class="detail-meta-row">
          <span class="detail-meta-label">振込予定金額</span>
          <span class="detail-meta-value">${fmt(s.payment_amount)}円</span>
        </div>
        <div class="detail-meta-row--handover">
          <span class="detail-meta-label detail-meta-label--block">USEN PAY社<br>からのコメント</span>
          <textarea class="detail-handover-textarea" readonly placeholder="差し戻しなどが発生した場合は、こちらに申し送り事項が記載される場合があります。">${escapeHtml(s.handover_matter || '')}</textarea>
        </div>
      </div>

      <div class="summary-card__divider"></div>

      <div class="detail-summary-amount confirm-summary-amount">
        <div class="detail-amount-header">請求金額</div>
        <div class="confirm-amount-group">
          <div class="confirm-amount-row confirm-amount-row--total">
            <span>合計（税込）</span><span>${fmt(s.wholesaler_total_amount)}円</span>
          </div>
          <div class="confirm-amount-row confirm-amount-row--sub">
            <span>小計（税抜）</span><span>${fmt(s.wholesaler_subtotal_amount)}円</span>
          </div>
          <div class="confirm-amount-row confirm-amount-row--sub">
            <span>消費税</span><span>${fmt(s.wholesaler_tax_amount)}円</span>
          </div>
        </div>
        <div class="detail-amount-divider"></div>
        <div class="confirm-amount-group">
          <div class="detail-amount-section-label">内訳</div>
          <div class="confirm-amount-row confirm-amount-row--sub">
            <span>10%対象小計（税抜）</span><span>${fmt(s.wholesaler_standard_tax_target_amount)}円</span>
          </div>
          <div class="confirm-amount-row confirm-amount-row--sub">
            <span>10%対象消費税</span><span>${fmt(s.wholesaler_standard_tax_amount)}円</span>
          </div>
          <div class="confirm-amount-row confirm-amount-row--sub">
            <span>8%対象小計（税抜）</span><span>${fmt(s.wholesaler_reduced_tax_target_amount)}円</span>
          </div>
          <div class="confirm-amount-row confirm-amount-row--sub">
            <span>8%対象消費税</span><span>${fmt(s.wholesaler_reduced_tax_amount)}円</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

/**
 * backoffice_review_status に対応するステータスバッジ HTML を返す。
 * @param {string} status
 * @returns {string}
 */
function getDetailStatusBadge_(backofficeStatus, invoiceStatus) {
  // 取り下げ済: WITHDRAWN（最優先。取下げは全ステータスに優先する）
  if (invoiceStatus === 'WITHDRAWN') {
    return '<span class="detail-status-badge badge--withdrawn"><i class="fa-solid fa-check"></i> 取下げ済</span>';
  }
  // 承認済み: invoice_status が APPROVED であれば BO ステータスに関係なく「承認済み」（WITHDRAWN 以外で最優先）
  if (invoiceStatus === 'APPROVED') {
    return '<span class="detail-status-badge badge--approved"><i class="fa-solid fa-circle-check"></i> 承認済み</span>';
  }
  // 否認: MERCHANT_CONFIRMATION_REQUESTED + DISPUTED
  if (backofficeStatus === 'MERCHANT_CONFIRMATION_REQUESTED' && invoiceStatus === 'DISPUTED') {
    return '<span class="detail-status-badge badge--disputed"><i class="fa-solid fa-minus-circle"></i> 否認</span>';
  }
  // 差戻し: RETURNED（invoice_status が DISPUTED かどうかは問わない。
  // BOが差し戻し済み（RETURNED）であれば否認の有無に関わらず「差戻し」バッジに統一する）
  if (backofficeStatus === 'RETURNED') {
    return '<span class="detail-status-badge badge--returned"><i class="fa-solid fa-rotate-left"></i> 差戻し</span>';
  }
  // 確認中: MERCHANT_CONFIRMATION_REQUESTED + PENDING_CONFIRMATION
  if (backofficeStatus === 'MERCHANT_CONFIRMATION_REQUESTED' && invoiceStatus === 'PENDING_CONFIRMATION') {
    return '<span class="detail-status-badge badge--requested">確認中</span>';
  }
  // 未検収: PENDING_REVIEW
  return '<span class="detail-status-badge badge--pending">未検収</span>';
}

/**
 * 加盟店リストを RETURNED / その他で分けてそれぞれのセクションに描画する。
 * @param {Array<Object>} stores
 */
function renderDetailStoreList_(stores) {
  // 差し戻し: RETURNED かつ DISPUTED でなく WITHDRAWN でもなく APPROVED でもない
  const returned  = stores.filter(function (s) {
    return s.backoffice_review_status === 'RETURNED' && s.invoice_status !== 'DISPUTED' && s.invoice_status !== 'WITHDRAWN' && s.invoice_status !== 'APPROVED';
  });
  // 否認: (MCR/RETURNED/WITHDRAW_REQUESTED + DISPUTED) ※WITHDRAWN は除外
  // ※ PENDING_REVIEW + DISPUTED（再請求済み）は要対応ではなく「確認中・承認済み」に表示する
  const disputed  = stores.filter(function (s) {
    return (s.backoffice_review_status === 'MERCHANT_CONFIRMATION_REQUESTED' && s.invoice_status === 'DISPUTED') ||
           (s.backoffice_review_status === 'RETURNED' && s.invoice_status === 'DISPUTED') ||
           (s.backoffice_review_status === 'WITHDRAW_REQUESTED' && s.invoice_status === 'DISPUTED');
  });
  // 取下げ済: WITHDRAWN
  const withdrawn = stores.filter(function (s) {
    return s.invoice_status === 'WITHDRAWN';
  });
  // 確認中・承認済み: invoice_status が APPROVED の場合は BO ステータスに関係なくここに入る。それ以外は上記以外すべて。
  // ※ PENDING_REVIEW + DISPUTED（再請求済み）もここに含まれる
  const normal    = stores.filter(function (s) {
    if (s.invoice_status === 'APPROVED') return true;
    return s.invoice_status !== 'WITHDRAWN' &&
      !(s.backoffice_review_status === 'RETURNED') &&
      !(s.backoffice_review_status === 'MERCHANT_CONFIRMATION_REQUESTED' && s.invoice_status === 'DISPUTED') &&
      !(s.backoffice_review_status === 'WITHDRAW_REQUESTED' && s.invoice_status === 'DISPUTED');
  });

  // 要対応の mall_code 一覧をグローバル変数に保持（バリデーション用）
  // ※ WITHDRAWN は分離済みのため disputed にはもう含まれない
  _detailActionRequiredMallCodes = returned.concat(disputed).map(function (s) { return s.mall_code; });
  // RETURNED かつ invoice_status が null の加盟店（CSVに含まれていなくても警告のみ）
  _detailReturnedOnlyMallCodes = returned.filter(function (s) {
    return !s.invoice_status || s.invoice_status === null || s.invoice_status === 'null';
  }).map(function (s) { return s.mall_code; });

  // 詳細画面専用の mall_code → customer_code マップを構築（end 店舗も含む）
  _detailMallToCustomerMap = {};
  stores.forEach(function(s) {
    if (s.mall_code && s.customer_code) {
      _detailMallToCustomerMap[String(s.mall_code)] = String(s.customer_code);
    }
  });

  // 取引終了（store_status='end'）の加盟店を抽出（再請求不可の判定に使用）
  _detailEndStores = stores.filter(function (s) {
    return s.store_status === 'end' && s.mall_code;
  }).map(function (s) {
    return {
      mall_code:     String(s.mall_code),
      customer_code: String(s.customer_code || ''),
      store_name:    s.store_name || '',
    };
  });

  // 取り下げ依頼中（backoffice_review_status='WITHDRAW_REQUESTED'）の加盟店を抽出
  // （CSV一括アップロード時、含まれていれば警告のうえスキップする判定に使用）
  _detailWithdrawRequestedStores = stores.filter(function (s) {
    return s.backoffice_review_status === 'WITHDRAW_REQUESTED' && s.mall_code;
  }).map(function (s) {
    return {
      mall_code:     String(s.mall_code),
      customer_code: String(s.customer_code || ''),
      store_name:    s.store_name || '',
    };
  });

  const colHeader =
    '<div class="store-list-header">' +
      '<span class="slh-col slh-col--name">加盟店名</span>' +
      '<span class="slh-col slh-col--mallcode">顧客ID</span>' +
      '<span class="slh-col slh-col--amount">請求金額</span>' +
      '<span class="slh-col slh-col--extax">小計（税抜）</span>' +
      '<span class="slh-col slh-col--tax">消費税</span>' +
      '<span class="slh-col slh-col--tax10">税内訳（10%）</span>' +
      '<span class="slh-col slh-col--tax8">税内訳（8%）</span>' +
      '<span class="slh-col slh-col--status">ステータス</span>' +
      '<span class="slh-col slh-col--toggle"></span>' +
    '</div>';

  // 要対応セクション（差し戻し or 否認があれば表示）
  if (returned.length > 0 || disputed.length > 0) {
    const section = document.getElementById('detailActionRequiredSection');
    if (section) section.classList.remove('hidden');

    if (returned.length > 0) {
      const sub  = document.getElementById('detailReturnedSubsection');
      const list = document.getElementById('detailReturnedList');
      if (sub)  sub.classList.remove('hidden');
      if (list) {
        list.innerHTML = colHeader;
        returned.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
      }
    }

    if (disputed.length > 0) {
      const sub  = document.getElementById('detailDisputedSubsection');
      const list = document.getElementById('detailDisputedList');
      if (sub)  sub.classList.remove('hidden');
      if (list) {
        list.innerHTML = colHeader;
        disputed.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
      }
    }
  }

  // 確認中・承認済みセクション
  if (normal.length > 0) {
    const section = document.getElementById('detailNormalSection');
    const list    = document.getElementById('detailNormalList');
    if (section) section.classList.remove('hidden');
    if (list) {
      list.innerHTML = colHeader;
      normal.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
    }
  }

  // 取下げ済みセクション
  if (withdrawn.length > 0) {
    const section = document.getElementById('detailWithdrawnSection');
    const list    = document.getElementById('detailWithdrawnList');
    if (section) section.classList.remove('hidden');
    if (list) {
      list.innerHTML = colHeader;
      withdrawn.forEach(function (store) { list.appendChild(buildDetailAccordion_(store, false)); });
    }
  }
}

/**
 * 加盟店アコーディオン要素を生成する。
 * @param {Object}  store
 * @param {boolean} openByDefault - RETURNED の場合 true（初期状態で展開）
 * @returns {HTMLElement}
 */
/**
 * mall_code から customer_code を解決する（end 店舗対応）。
 * 優先順: 1) store.customer_code（BE由来）2) _detailMallToCustomerMap（end 店舗含む）3) getMerchantMappings()
 * @param {string} mallCode - 解決対象の mall_code
 * @param {Object} [store] - BE 由来の store オブジェクト（あれば customer_code を最優先で使用）
 * @returns {string} customer_code（見つからなければ ''）
 */
function resolveCustomerCode_(mallCode, store) {
  // 1) store.customer_code（BE 由来・最優先）
  if (store && store.customer_code) return String(store.customer_code);
  // 2) 詳細画面専用マップ（end 店舗も含む）
  if (mallCode && _detailMallToCustomerMap && _detailMallToCustomerMap[String(mallCode)]) {
    return _detailMallToCustomerMap[String(mallCode)];
  }
  // 3) SessionStorage の merchant_mappings（active 店舗のみ・最終フォールバック）
  const mappings = getMerchantMappings();
  return (mappings.find(function (m) { return String(m.mall_code) === String(mallCode); }) || {}).customer_code || '';
}

function buildDetailAccordion_(store, openByDefault) {
  const fmt        = function (n) { return Number(n || 0).toLocaleString('ja-JP'); };
  const isWithdrawn = store.invoice_status === 'WITHDRAWN';
  const isReturned = store.backoffice_review_status === 'RETURNED' && store.invoice_status !== 'DISPUTED' && store.invoice_status !== 'WITHDRAWN';
  const isWithdrawRequested = store.backoffice_review_status === 'WITHDRAW_REQUESTED' && store.invoice_status === 'DISPUTED';
  const isDisputed = !isWithdrawn &&
                     ((store.backoffice_review_status === 'MERCHANT_CONFIRMATION_REQUESTED' && store.invoice_status === 'DISPUTED') ||
                     (store.backoffice_review_status === 'RETURNED' && store.invoice_status === 'DISPUTED') ||
                     isWithdrawRequested);

  // mall_code → customer_code 変換（BE が remarks[customerCode] で参照するため）
  const customerCode = resolveCustomerCode_(store.mall_code, store);

  const accordion = document.createElement('div');
  accordion.className = 'store-accordion' +
    (openByDefault          ? ' is-open'                  : '') +
    (isReturned || isDisputed ? ' store-accordion--returned' : '');
  accordion.dataset.storeInvoiceId = store.store_invoice_id;
  accordion.dataset.mallCode = store.mall_code || '';

  // ── ヘッダー行 ───────────────────────────────────────────────────────────
  const header = document.createElement('div');
  header.className = 'store-accordion__header';
  header.innerHTML =
    '<span class="slh-col slh-col--name store-accordion__code">' + escapeHtml(store.wholesaler_managed_store_name || store.store_name || store.mall_code) + '</span>' +
    '<span class="slh-col slh-col--mallcode">' + escapeHtml(customerCode || store.mall_code) + '</span>' +
    '<span class="slh-col slh-col--amount">'   + fmt(store.total_amount)             + '円</span>' +
    '<span class="slh-col slh-col--extax">'    + fmt(store.subtotal_amount)          + '円</span>' +
    '<span class="slh-col slh-col--tax">'      + fmt(store.tax_amount)               + '円</span>' +
    '<span class="slh-col slh-col--tax10">'    + fmt(store.standard_tax_amount)      + '円</span>' +
    '<span class="slh-col slh-col--tax8">'     + fmt(store.reduced_tax_amount)       + '円</span>' +
    '<span class="slh-col slh-col--status">'   + getDetailStatusBadge_(store.backoffice_review_status, store.invoice_status) + '</span>' +
    '<span class="slh-col slh-col--toggle"><i class="fa-solid fa-chevron-down store-accordion__icon"></i></span>';

  // ── ボディ ────────────────────────────────────────────────────────────────
  const body = document.createElement('div');
  body.className = 'store-accordion__body';

  // USEN PAY社からのコメント（差戻し・読み取り専用）
  // 否認（MERCHANT_CONFIRMATION_REQUESTED + DISPUTED）と同じ表示形式に揃える。
  if (isReturned && store.backoffice_handover) {
    const payComment = document.createElement('div');
    payComment.className = 'store-accordion__backoffice-remark';
    payComment.innerHTML =
      '<div class="backoffice-remark__disputed-left">' +
        '<div class="backoffice-remark__disputed-handover">' +
          '<span class="backoffice-remark__label">・ USEN PAY社<br>からのコメント</span>' +
          '<textarea class="backoffice-remark__handover-input backoffice-remark__pay-comment" readonly>' + escapeHtml(store.backoffice_handover || '') + '</textarea>' +
        '</div>' +
      '</div>';
    body.appendChild(payComment);
  }

  // 否認理由 + 加盟店との合意内容（否認のみ表示）
  if (isDisputed) {
    const disputedRow = document.createElement('div');
    disputedRow.className = 'store-accordion__backoffice-remark';

    // 取り下げ依頼中: OBJECTION_PERIOD チェック（期限切れなら取り消し不可。以降は自動承認バッチ〈本リポジトリ外〉が処理）
    const withdrawReqTodayYmd = jstNow_().ymd;
    const withdrawReqEndAtYmd = String(_objectionEndAt).slice(0, 10);
    const withdrawRequestPeriodExpired = isWithdrawRequested && _objectionEndAt && withdrawReqTodayYmd > withdrawReqEndAtYmd;

    disputedRow.innerHTML =
      '<div class="backoffice-remark__disputed-left">' +
        '<div class="backoffice-remark__disputed-reason">' +
          '<span class="backoffice-remark__label">・ 否認理由</span>' +
          '<span class="backoffice-remark__reason-text">' + escapeHtml(store.store_disputed_reason || '') + '</span>' +
        '</div>' +
        '<div class="backoffice-remark__disputed-handover">' +
          '<span class="backoffice-remark__label">・ 【必須】加盟店<br>との合意内容</span>' +
          '<textarea class="backoffice-remark__handover-input" data-store-invoice-id="' + escapeHtml(store.store_invoice_id) + '" data-customer-code="' + escapeHtml(customerCode) + '" placeholder="【必須】否認に対する加盟店との合意事項と変更された内容を記載ください。">' + escapeHtml(store.wholesaler_handover || '') + '</textarea>' +
        '</div>' +
        // USEN PAY社からのコメント（否認 RETURNED + DISPUTED のときのみ・読み取り専用）
        (store.backoffice_review_status === 'RETURNED' && store.invoice_status === 'DISPUTED'
          ? '<div class="backoffice-remark__disputed-handover">' +
              '<span class="backoffice-remark__label">・ USEN PAY社<br>からのコメント</span>' +
              '<textarea class="backoffice-remark__handover-input backoffice-remark__pay-comment" readonly>' + escapeHtml(store.backoffice_handover || '') + '</textarea>' +
            '</div>'
          : '') +
      '</div>' +
      '<div class="backoffice-remark__actions' + (store.backoffice_review_status === 'RETURNED' && store.invoice_status === 'DISPUTED' ? ' backoffice-remark__actions--shifted' : '') + '">' +
    (isWithdrawRequested
      ? (
          '<span class="btn detail-action-badge--withdraw-requested"><i class="fa-solid fa-check"></i> 取り下げ依頼済み</span>' +
          (withdrawRequestPeriodExpired
            ? '<button type="button" class="btn btn-outline btn-sm detail-action-btn" disabled>' +
                '<i class="fa-solid fa-rotate detail-action-btn__icon--primary"></i> 取り下げ依頼を取り消す' +
              '</button>' +
              '<p class="detail-action-btn__period-expired-msg">異議申立期間が終了しています</p>'
            : '<button type="button" class="btn btn-outline btn-sm detail-action-btn" data-action="cancel-withdraw-request" data-id="' + escapeHtml(store.store_invoice_id) + '">' +
                '<i class="fa-solid fa-rotate detail-action-btn__icon--primary"></i> 取り下げ依頼を取り消す' +
              '</button>'
          )
        )
      : '<button type="button" class="btn btn-outline btn-sm detail-action-btn detail-action-btn--withdraw" data-action="withdraw" data-id="' + escapeHtml(store.store_invoice_id) + '"><i class="fa-regular fa-trash-can detail-action-btn__icon--danger"></i> 請求取り下げ</button>' +
          '<button type="button" class="btn btn-outline btn-sm detail-action-btn" data-action="reupload" data-id="' + escapeHtml(store.store_invoice_id) + '"><i class="fa-solid fa-upload detail-action-btn__icon--primary"></i> 修正ファイルをアップ</button>' +
          '<button type="button" class="btn btn-outline btn-sm detail-action-btn" data-action="resubmit" data-id="' + escapeHtml(store.store_invoice_id) + '"><i class="fa-solid fa-rotate detail-action-btn__icon--primary"></i> 変更なしで再請求</button>'
    ) +
      '</div>';
    body.appendChild(disputedRow);

    // 合意内容入力時にエラー表示（バナー）をクリアする（確認画面・個別再請求モーダルと同じ挙動）
    const disputedHandoverInput = disputedRow.querySelector('.backoffice-remark__handover-input[data-customer-code]');
    if (disputedHandoverInput) {
      disputedHandoverInput.addEventListener('input', function () {
        disputedHandoverInput.classList.remove('confirm-handover-input--error');
        disputedHandoverInput.removeAttribute('aria-invalid');
        disputedHandoverInput.removeAttribute('aria-describedby');
        const leftDiv = disputedHandoverInput.closest('.backoffice-remark__disputed-left');
        const bannerEl = leftDiv && leftDiv.querySelector('.backoffice-remark__error-banner');
        if (bannerEl) bannerEl.remove();
      });
    }
  }

  // 取下げ済み: 合意内容（読取専用）。BOによる最終確定後のため取り消し操作は提供しない。
  if (isWithdrawn) {
    const withdrawnRow = document.createElement('div');
    withdrawnRow.className = 'store-accordion__backoffice-remark';
    withdrawnRow.innerHTML =
      '<div class="backoffice-remark__disputed-left">' +
        '<div class="backoffice-remark__disputed-reason">' +
          '<span class="backoffice-remark__label">・ 否認理由</span>' +
          '<span class="backoffice-remark__reason-text">' + escapeHtml(store.store_disputed_reason || '') + '</span>' +
        '</div>' +
        '<div class="backoffice-remark__disputed-handover">' +
          '<span class="backoffice-remark__label">・ 【必須】加盟店<br>との合意内容</span>' +
          '<div class="backoffice-remark__handover-readonly">' + escapeHtml(store.wholesaler_handover || '') + '</div>' +
        '</div>' +
      '</div>';
    body.appendChild(withdrawnRow);
  }

  // 確認中・承認済み・未検収（normalグループ）: 否認理由（読取専用）+ 合意内容（読取専用）
  // 過去に否認され store_disputed_reason が登録されている場合や、
  // wholesaler_handover が登録済みの場合のみ、それぞれの行を表示する
  if (!isReturned && !isDisputed && !isWithdrawn && (store.store_disputed_reason || store.wholesaler_handover)) {
    const handoverRow = document.createElement('div');
    handoverRow.className = 'store-accordion__backoffice-remark';
    handoverRow.innerHTML =
      '<div class="backoffice-remark__disputed-left">' +
        (store.store_disputed_reason
          ? '<div class="backoffice-remark__disputed-reason">' +
              '<span class="backoffice-remark__label">・ 否認理由</span>' +
              '<span class="backoffice-remark__reason-text">' + escapeHtml(store.store_disputed_reason || '') + '</span>' +
            '</div>'
          : '') +
        (store.wholesaler_handover
          ? '<div class="backoffice-remark__disputed-handover">' +
              '<span class="backoffice-remark__label">・ 【必須】加盟店<br>との合意内容</span>' +
              '<div class="backoffice-remark__handover-readonly">' + escapeHtml(store.wholesaler_handover || '') + '</div>' +
            '</div>'
          : '') +
      '</div>';
    body.appendChild(handoverRow);
  }

  // 備考エリア（常時表示）
  const remarksDiv = document.createElement('div');
  remarksDiv.className = 'store-accordion__remarks';
  if (isReturned || isDisputed) {
    // 要対応: 編集可能
    remarksDiv.innerHTML =
      '<label class="remarks-label">・ 請求書備考 <span class="detail-meta-help-wrap"><i class="fa-solid fa-circle-question detail-meta-help" style="color:#00A7B8"></i><span class="detail-meta-tooltip">加盟店への請求書備考欄に記載されるテキストです。請求における、加盟店への連絡事項を記載ください。</span></span></label>' +
      '<input type="text" class="remarks-input" data-store-invoice-id="' + escapeHtml(store.store_invoice_id) + '" data-customer-code="' + escapeHtml(customerCode) + '" placeholder="※加盟店請求書に表示される備考情報を記載ください。" value="' + escapeHtml(store.wholesaler_remark || '') + '" />';
  } else {
    // 確認中・承認済み・取下げ済み: 読み取り専用
    remarksDiv.innerHTML =
      '<label class="remarks-label">・ 請求書備考 <span class="detail-meta-help-wrap"><i class="fa-solid fa-circle-question detail-meta-help" style="color:#00A7B8"></i><span class="detail-meta-tooltip">加盟店への請求書備考欄に記載されるテキストです。請求における、加盟店への連絡事項を記載ください。</span></span></label>' +
      '<input type="text" class="remarks-input remarks-input--readonly" readonly placeholder="備考なし" value="' + escapeHtml(store.wholesaler_remark || '') + '" />';
  }
  body.appendChild(remarksDiv);

  // ── 明細アコーディオン（ネスト）────────────────────────────────────────
  const linesAccordion = document.createElement('div');
  linesAccordion.className = 'detail-accordion' + (openByDefault ? ' is-open' : '');

  const linesHeader = document.createElement('div');
  linesHeader.className = 'detail-accordion__header';
  linesHeader.innerHTML =
    '<span class="detail-accordion__label">・ 明細</span>' +
    '<i class="fa-solid fa-chevron-down detail-accordion__icon"></i>';

  const linesBody = document.createElement('div');
  linesBody.className = 'detail-accordion__body';

  // 明細コンテナ（オンデマンドで内容を入れる / 閉じたら空にしてメモリ解放）
  const linesContainer = document.createElement('div');
  linesBody.appendChild(linesContainer);

  linesAccordion.appendChild(linesHeader);
  linesAccordion.appendChild(linesBody);
  body.appendChild(linesAccordion);

  accordion.appendChild(header);
  accordion.appendChild(body);

  // ── 開閉ロジック（外側アコーディオン）──────────────────────────────────
  header.addEventListener('click', function () {
    const isNowOpen = accordion.classList.contains('is-open');
    if (isNowOpen) {
      accordion.classList.remove('is-open');
      linesContainer.innerHTML = ''; // DOM を空にしてブラウザのメモリを解放
      linesAccordion.classList.remove('is-open');
    } else {
      accordion.classList.add('is-open');
    }
  });

  // ── 開閉ロジック（内側: 明細アコーディオン）────────────────────────────
  linesHeader.addEventListener('click', function () {
    const isOpen = linesAccordion.classList.toggle('is-open');
    if (!isOpen) {
      linesContainer.innerHTML = ''; // DOM を空にしてブラウザのメモリを解放
    } else {
      loadDetailInvoiceLines_(store.store_invoice_id, linesContainer);
    }
  });

  // RETURNED は最初から開いて明細を取得
  if (openByDefault) {
    loadDetailInvoiceLines_(store.store_invoice_id, linesContainer);
  }

  return accordion;
}

/**
 * 指定の加盟店の明細をオンデマンドで取得してコンテナに描画する。
 * @param {string}      storeInvoiceId
 * @param {HTMLElement} container
 */
function loadDetailInvoiceLines_(storeInvoiceId, container) {
  container.innerHTML =
    '<div class="dsl-lines-loading"><i class="fa-solid fa-spinner fa-spin"></i> 明細を取得中...</div>';

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function (result) {
        renderDetailLines_((result && result.data) ? result.data : [], container);
      })
      .withFailureHandler(function (err) {
        console.error('[detail] getInvoiceLinesByStore failed:', err);
        container.innerHTML =
          '<div class="dsl-lines-error"><i class="fa-solid fa-circle-exclamation"></i> 明細の取得に失敗しました。</div>';
      })
      .getInvoiceLinesByStore(storeInvoiceId, getSessionToken_());
  } else {
    container.innerHTML = '<div class="dsl-lines-error">GAS 環境外での実行は非対応です。</div>';
  }
}

/**
 * 明細テーブルを描画する。
 * @param {Array<Object>} lines
 * @param {HTMLElement}   container
 */
function renderDetailLines_(lines, container) {
  if (!lines || lines.length === 0) {
    container.innerHTML = '<p class="dsl-lines-empty">明細データがありません。</p>';
    return;
  }

  const fmt = function (n) { return Number(n || 0).toLocaleString('ja-JP'); };

  const rows = lines.map(function (line) {
    const date = line.transaction_date ? String(line.transaction_date).replace(/-/g, '/') : '―';
    const taxRate = Number(line.tax_category || 0);
    return '<tr>' +
      '<td>' + escapeHtml(date) + '</td>' +
      '<td>' + escapeHtml(line.item_name || '') + '</td>' +
      '<td class="num-td">' + fmt(line.unit_price) + '円</td>' +
      '<td class="num-td">' + fmt(line.quantity) + (line.quantity_unit ? ' ' + escapeHtml(line.quantity_unit) : '') + '</td>' +
      '<td class="num-td">' + fmt(line.line_amount_excluding_tax) + '円</td>' +
      '<td class="num-td tax-cell"><span class="tax-amount">' + fmt(line.line_tax_amount) + '円</span><span class="tax-rate">（' + taxRate + '%）</span></td>' +
      '<td>' + (line.line_note ? escapeHtml(line.line_note) : '—') + '</td>' +
    '</tr>';
  }).join('');

  container.innerHTML =
      '<table class="detail-table">' +
        '<thead><tr>' +
          '<th>取引日</th><th>明細項目</th><th class="num-th">単価</th><th class="num-th">数量</th>' +
          '<th class="num-th">明細金額（税抜）</th><th class="num-th">消費税</th><th>備考</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
}

// Detail page: 修正ファイルアップロード モーダル

(function () {

  let _selectedFile         = null;
  let _analyzeTimer         = null;
  let _currentReader        = null;

  }

  function closeModal() {
    modal.classList.add('hidden');
  }

  const previewEl      = document.getElementById('detailUploadPreview');
  const previewTarget   = document.getElementById('previewTargetStore');
  const previewFileInfo = document.getElementById('previewFileInfo');
  const previewBody     = document.getElementById('previewBody');
  const previewOath     = document.getElementById('previewOathCheck');
  const previewSubmit   = document.getElementById('previewSubmitBtn');
  const modalFooter     = document.getElementById('detailUploadModalFooter');
  const modalDesc       = modal && modal.querySelector('.detail-upload-modal__desc');

  function resetModalState_() {
