name: Deploy GAS API

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ブランチ名に応じて、GitHubのEnvironmentを動的に切り替える
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージのインストール
        run: npm install

      - name: claspのインストール
        run: npm install -g @google/clasp

      - name: ビルド (dist/ を生成)
        run: npm run build

      - name: 認証情報とGASプロジェクトの紐付け
        # 選択されたEnvironmentのSecretsが自動で注入されます
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '{"scriptId":"${{ secrets.SCRIPT_ID }}","rootDir":"dist"}' > .clasp.json

      - name: GASへコードを送信 (エディタの更新)
        run: clasp push --force

      - name: ウェブアプリとしてデプロイ (APIの更新)
        # 既存のデプロイメントIDを指定して上書き更新します
        run: clasp deploy -i ${{ secrets.DEPLOYMENT_ID }} -d "Auto deployed via GitHub Actions"